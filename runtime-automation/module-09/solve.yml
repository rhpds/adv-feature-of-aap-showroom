---
# Module 09 Solve — Policy Enforcement (OPA)
#
# What this playbook automates:
#   block-01: Clone opa-policy-enforcement from Gitea on bastion; copy *.rego to /var/lib/opa/policies/
#   prose-03: PATCH Demo JT policy_enforcement="aap/deny"; launch; poll; assert error status (policy blocked)
#   prose-04: PATCH Demo JT policy_enforcement="aap/extravars", extra_vars color=red; launch; poll; assert error
#   prose-05: PATCH extra_vars color=blue; launch; assert SUCCEEDS
#   prose-07: Get current UTC hour on bastion; patch maintenance_window.rego to bracket current hour
#   prose-08: PATCH Demo JT policy_enforcement="aap/maintenance"; add label "maintenance"; launch; assert SUCCEEDS
#   prose-09: Remove label "maintenance"; launch; poll; assert error (no label)
#   prose-10: PUT outside-window rego to OPA (pre-built in Play 2);
#             re-add label "maintenance"; launch; poll; assert error (outside window)
#   final:    PUT inclusive rego back to OPA; ensure maintenance label is associated
#
# SKIP (visual / exploratory only):
#   prose-01: AAP login
#   prose-02: Read-only OPA settings view
#   prose-06: Open-ended exploration
#   prose-11: prose-06 equivalent
#
# Play 1: build dynamic bastion inventory (localhost)
# Play 2: bastion — git clone, copy policies, patch rego files (inclusive + exclusive versions)
# Play 3: localhost — all AAP REST API calls (PATCH JT, launch, poll, assert)
#
# All variables are resolved via lookup('ansible.builtin.env', ...) — no bare extravars.
# AAP 2.5 unified gateway: REST API base is /api/controller/v2/
# OPA container mounts /var/lib/opa/policies as /policies and --watch auto-reloads on change.
# OPA blocks happen at runtime: AAP accepts the launch (HTTP 201) but OPA causes job status=error.
# Therefore block detection polls the job status, not the launch HTTP response.
#
# ARCHITECTURE: All bastion file operations happen in Play 2 (direct connection, no delegate_to).
# Play 3 only uses localhost REST API calls. OPA updates in Play 3 are done by:
#   - ssh cat <file on bastion> | curl PUT http://10.88.0.1:8181/v1/policies/...
#   All running entirely on localhost (runner container).
# This avoids Ansible delegate_to shell/heredoc issues.
#
# Two rego versions are pre-built in Play 2:
#   /var/lib/opa/policies/maintenance_window.rego  — inclusive (current hour inside window)
#   /tmp/maint_excl.rego                           — exclusive (current hour OUTSIDE window)
# Play 3 PUTs the appropriate version to OPA as needed.
#
# OPA is accessible from runner container at http://10.88.0.1:8181 (Podman network gateway).

# =============================================================================
# Play 1 — Build dynamic bastion inventory from environment variables
# =============================================================================
- name: Build bastion inventory
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _ssh_host: "{{ lookup('ansible.builtin.env', 'SSH_HOSTNAME') }}"
    _ssh_port: "{{ lookup('ansible.builtin.env', 'SSH_PORT') | default('22', true) }}"
    _ssh_user: "{{ lookup('ansible.builtin.env', 'SSH_USERNAME') | default('lab-user', true) }}"
    _ssh_pass: "{{ lookup('ansible.builtin.env', 'SSH_PASSWORD') }}"
  tasks:
    - name: Add bastion to in-memory inventory
      ansible.builtin.add_host:
        name: bastion
        groups: bastion
        ansible_host: "{{ _ssh_host }}"
        ansible_port: "{{ _ssh_port }}"
        ansible_user: "{{ _ssh_user }}"
        ansible_password: "{{ _ssh_pass }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      when: _ssh_host | length > 0

# =============================================================================
# Play 2 — Bastion: clone OPA policies, copy to policy dir, build rego variants
# =============================================================================
- name: Module 09 — Bastion file operations
  hosts: bastion
  gather_facts: false
  vars:
    _gitea_url: "{{ lookup('ansible.builtin.env', 'GITEA_URL') }}"
    _gitea_user: "{{ lookup('ansible.builtin.env', 'GITEA_USERNAME') }}"
    _opa_policy_dir: /var/lib/opa/policies
    _repo_dir: /home/lab-user/opa-policy-enforcement

  tasks:

    # -------------------------------------------------------------------------
    # block-01: Clone opa-policy-enforcement repo (idempotent) and copy policies
    # -------------------------------------------------------------------------
    - name: Clone opa-policy-enforcement repo from Gitea (idempotent)
      ansible.builtin.shell: |
        if [ -d "{{ _repo_dir }}/.git" ]; then
          git -C "{{ _repo_dir }}" pull --ff-only 2>&1 && echo updated || echo already-ok
        else
          git clone "{{ _gitea_url }}/{{ _gitea_user }}/opa-policy-enforcement.git" "{{ _repo_dir }}" 2>&1 && echo cloned
        fi
      register: r_clone
      changed_when: "'cloned' in r_clone.stdout or 'updated' in r_clone.stdout"
      ignore_errors: true

    - name: Copy rego policies to OPA policy directory
      ansible.builtin.shell: |
        mkdir -p "{{ _opa_policy_dir }}"
        cp "{{ _repo_dir }}"/*.rego "{{ _opa_policy_dir }}/" 2>&1 && echo copied
      register: r_copy
      changed_when: "'copied' in r_copy.stdout"
      ignore_errors: true

    # After cp: OPA file watcher may trigger (with permission denied for .tmp files).
    # Use curl PUT to sync each policy to OPA immediately.
    - name: Reload all three policies into OPA via PUT API (post-copy sync)
      ansible.builtin.shell: |
        for REGO in deny.rego extra_vars.rego maintenance_window.rego; do
          REGO_PATH="{{ _opa_policy_dir }}/${REGO}"
          RESULT=$(curl -s -X PUT \
            "http://localhost:8181/v1/policies/policies/${REGO}" \
            -H 'Content-Type: text/plain' \
            --data-binary "@${REGO_PATH}" 2>/dev/null)
          echo "${REGO}: ${RESULT}"
        done
      register: r_opa_reload_all
      changed_when: false
      ignore_errors: true

    # -------------------------------------------------------------------------
    # Verify policy files are in place
    # -------------------------------------------------------------------------
    - name: Check deny.rego exists
      ansible.builtin.stat:
        path: "{{ _opa_policy_dir }}/deny.rego"
      register: r_deny_rego

    - name: Check extra_vars.rego exists
      ansible.builtin.stat:
        path: "{{ _opa_policy_dir }}/extra_vars.rego"
      register: r_extravars_rego

    - name: Check maintenance_window.rego exists
      ansible.builtin.stat:
        path: "{{ _opa_policy_dir }}/maintenance_window.rego"
      register: r_maint_rego

    - name: Set policy files present facts
      ansible.builtin.set_fact:
        deny_ok: "{{ r_deny_rego.stat.exists }}"
        extravars_ok: "{{ r_extravars_rego.stat.exists }}"
        maint_ok: "{{ r_maint_rego.stat.exists }}"

    # -------------------------------------------------------------------------
    # prose-07 (part A): Get current UTC hour
    # -------------------------------------------------------------------------
    - name: Get current UTC hour
      ansible.builtin.shell: date -u +%H
      register: r_utc_hour
      changed_when: false
      ignore_errors: true

    - name: Set UTC hour facts
      ansible.builtin.set_fact:
        current_hour: "{{ r_utc_hour.stdout | trim | int }}"
        window_start_hour: "{{ r_utc_hour.stdout | trim | int }}"
        window_end_hour: "{{ (r_utc_hour.stdout | trim | int + 2) % 24 }}"

    # -------------------------------------------------------------------------
    # prose-07 (part B): Write INCLUSIVE maintenance_window.rego
    # Python atomic rename runs directly on bastion (not via delegate_to).
    # This is the primary rego file used for prose-08, prose-09, and final state.
    # -------------------------------------------------------------------------
    - name: "prose-07: Write inclusive maintenance_window.rego via Python (atomic)"
      ansible.builtin.shell: |
        python3 << 'PYEOF'
        import re, os, tempfile, sys
        rego_path  = '{{ _opa_policy_dir }}/maintenance_window.rego'
        start_hour = '{{ window_start_hour }}'
        end_hour   = '{{ window_end_hour }}'
        with open(rego_path, 'r') as f:
            content = f.read()
        content = re.sub(r'^\s*window_start_hour\s*:=\s*\d+',
                         'window_start_hour := ' + start_hour, content, flags=re.MULTILINE)
        content = re.sub(r'^\s*window_start_minute\s*:=\s*\d+',
                         'window_start_minute := 0', content, flags=re.MULTILINE)
        content = re.sub(r'^\s*window_end_hour\s*:=\s*\d+',
                         'window_end_hour := ' + end_hour, content, flags=re.MULTILINE)
        content = re.sub(r'^\s*window_end_minute\s*:=\s*\d+',
                         'window_end_minute := 0', content, flags=re.MULTILINE)
        dir_ = os.path.dirname(rego_path)
        fd, tmp = tempfile.mkstemp(dir=dir_, suffix='.tmp')
        os.write(fd, content.encode())
        os.close(fd)
        os.chmod(tmp, 0o644)
        os.rename(tmp, rego_path)
        print('wrote: window_start_hour=' + start_hour + ' window_end_hour=' + end_hour)
        PYEOF
      register: r_write_incl_play2
      changed_when: true
      ignore_errors: true

    - name: "prose-07: PUT inclusive maintenance_window.rego to OPA API (immediate reload)"
      ansible.builtin.shell: |
        REGO="{{ _opa_policy_dir }}/maintenance_window.rego"
        RESULT=$(curl -s -X PUT \
          http://localhost:8181/v1/policies/policies/maintenance_window.rego \
          -H 'Content-Type: text/plain' \
          --data-binary "@${REGO}" 2>/dev/null)
        echo "opa_put_result: ${RESULT}"
        OPA_VAL=$(curl -s -X POST \
          http://localhost:8181/v1/data/aap/maintenance/window_start_hour \
          -H 'Content-Type: application/json' \
          -d '{}' 2>/dev/null | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("result","none"))' 2>/dev/null)
        echo "opa_verify_window_start_hour: ${OPA_VAL}"
      register: r_put_incl_play2
      changed_when: false
      ignore_errors: true

    - name: Verify maintenance_window.rego has correct inclusive start hour
      ansible.builtin.shell: |
        grep "window_start_hour" "{{ _opa_policy_dir }}/maintenance_window.rego" | grep -q "{{ window_start_hour }}" && echo ok || echo wrong
      register: r_rego_incl_check
      changed_when: false
      ignore_errors: true

    - name: Set maintenance window inclusive patched fact
      ansible.builtin.set_fact:
        maint_window_incl_patched: "{{ (r_rego_incl_check.stdout | default('wrong') | trim) == 'ok' }}"

    # -------------------------------------------------------------------------
    # prose-07 (part C): Pre-build EXCLUSIVE maintenance_window.rego for prose-10
    # Write to /tmp/maint_excl.rego on bastion.
    # Play 3 will PUT this file's content to OPA when needed (via SSH cat | curl).
    # This runs directly on bastion (no delegate_to), so Python heredoc works fine.
    # -------------------------------------------------------------------------
    - name: "prose-07: Write EXCLUSIVE maintenance_window.rego to /tmp/maint_excl.rego"
      ansible.builtin.shell: |
        python3 << 'PYEOF'
        import re, os, tempfile, subprocess
        rego_path  = '{{ _opa_policy_dir }}/maintenance_window.rego'
        excl_path  = '/tmp/maint_excl.rego'
        cur_hour   = int('{{ window_start_hour }}')
        excl_start = (cur_hour + 12) % 24
        excl_end   = (cur_hour + 14) % 24
        with open(rego_path, 'r') as f:
            content = f.read()
        content = re.sub(r'^\s*window_start_hour\s*:=\s*\d+',
                         'window_start_hour := ' + str(excl_start), content, flags=re.MULTILINE)
        content = re.sub(r'^\s*window_start_minute\s*:=\s*\d+',
                         'window_start_minute := 0', content, flags=re.MULTILINE)
        content = re.sub(r'^\s*window_end_hour\s*:=\s*\d+',
                         'window_end_hour := ' + str(excl_end), content, flags=re.MULTILINE)
        content = re.sub(r'^\s*window_end_minute\s*:=\s*\d+',
                         'window_end_minute := 0', content, flags=re.MULTILINE)
        with open(excl_path, 'w') as f:
            f.write(content)
        os.chmod(excl_path, 0o644)
        print('wrote excl: window_start_hour=' + str(excl_start) + ' window_end_hour=' + str(excl_end)
              + ' (cur_hour=' + str(cur_hour) + ' excluded)')
        PYEOF
      register: r_write_excl_play2
      changed_when: true
      ignore_errors: true

    - name: Verify /tmp/maint_excl.rego was written correctly
      ansible.builtin.shell: |
        if [ -f /tmp/maint_excl.rego ]; then
          EXCL_START=$(grep '^window_start_hour' /tmp/maint_excl.rego | grep -oE '[0-9]+' | head -1)
          INCL_START=$(grep '^window_start_hour' {{ _opa_policy_dir }}/maintenance_window.rego | grep -oE '[0-9]+' | head -1)
          echo "incl_start=${INCL_START} excl_start=${EXCL_START}"
          [ "${EXCL_START}" != "${INCL_START}" ] && echo "ok" || echo "wrong-same-as-incl"
        else
          echo "MISSING"
        fi
      register: r_excl_check
      changed_when: false
      ignore_errors: true

    - name: Set exclusive rego written fact
      ansible.builtin.set_fact:
        excl_rego_ready: "{{ 'ok' in (r_excl_check.stdout | default('') | trim) }}"

    # -------------------------------------------------------------------------
    # OPA server reachability check from bastion localhost
    # -------------------------------------------------------------------------
    - name: Check OPA server reachable on bastion:8181/health
      ansible.builtin.shell: |
        curl -s -o /dev/null -w "%{http_code}" http://localhost:8181/health 2>/dev/null || echo 000
      register: r_opa_health
      changed_when: false
      ignore_errors: true

    - name: Set OPA reachable fact
      ansible.builtin.set_fact:
        opa_reachable: "{{ (r_opa_health.stdout | default('000') | trim) in ['200', '204'] }}"

    # -------------------------------------------------------------------------
    # Share facts to Play 3 via dummy host
    # -------------------------------------------------------------------------
    - name: Persist bastion facts to dummy host for Play 3
      ansible.builtin.add_host:
        name: _facts_relay
        groups: facts_relay
        bastion_deny_ok: "{{ deny_ok }}"
        bastion_extravars_ok: "{{ extravars_ok }}"
        bastion_maint_ok: "{{ maint_ok }}"
        bastion_opa_reachable: "{{ opa_reachable }}"
        bastion_maint_window_incl_patched: "{{ maint_window_incl_patched }}"
        bastion_current_hour: "{{ current_hour }}"
        bastion_excl_rego_ready: "{{ excl_rego_ready }}"

# =============================================================================
# Play 3 — Localhost: all AAP REST API calls
# =============================================================================
- name: Module 09 — AAP REST API policy enforcement steps
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _controller_url: "{{ lookup('ansible.builtin.env', 'CONTROLLER_URL') | regex_replace('/$', '') }}"
    _controller_user: "{{ lookup('ansible.builtin.env', 'CONTROLLER_USERNAME') }}"
    _controller_pass: "{{ lookup('ansible.builtin.env', 'CONTROLLER_PASSWORD') }}"
    _aap_api: "{{ lookup('ansible.builtin.env', 'CONTROLLER_URL') | regex_replace('/$', '') }}/api/controller/v2"
    _ssh_host: "{{ lookup('ansible.builtin.env', 'SSH_HOSTNAME') }}"
    _ssh_port: "{{ lookup('ansible.builtin.env', 'SSH_PORT') | default('22', true) }}"
    _ssh_user: "{{ lookup('ansible.builtin.env', 'SSH_USERNAME') | default('lab-user', true) }}"
    _opa_policy_dir: /var/lib/opa/policies
    _opa_api: "http://10.88.0.1:8181"
    _opa_incl_rego: "/var/lib/opa/policies/maintenance_window.rego"
    _opa_excl_rego: "/tmp/maint_excl.rego"

  tasks:

    # -------------------------------------------------------------------------
    # Discover Demo Job Template ID
    # -------------------------------------------------------------------------
    - name: Query Demo Job Template ID from AAP API
      ansible.builtin.uri:
        url: "{{ _aap_api }}/job_templates/?name=Demo+Job+Template"
        method: GET
        user: "{{ _controller_user }}"
        password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
      register: r_jt_query
      ignore_errors: true

    - name: Set Demo Job Template ID fact
      ansible.builtin.set_fact:
        jt_id: "{{ (r_jt_query.json.results | default([]) | first).id | default('') | string }}"
      when: r_jt_query.json.count | default(0) | int > 0

    - name: Warn if Demo Job Template not found
      ansible.builtin.debug:
        msg: "WARNING: Demo Job Template not found — cannot proceed with policy steps"
      when: jt_id | default('') | length == 0

    # -------------------------------------------------------------------------
    # prose-03: Set policy_enforcement=aap/deny, clear extra_vars; launch; poll; assert error
    # OPA blocks at runtime — job is launched (HTTP 201) then ends with status=error
    # -------------------------------------------------------------------------
    - name: "prose-03: PATCH Demo JT — opa_query_path=aap/deny, clear extra_vars"
      ansible.builtin.uri:
        url: "{{ _aap_api }}/job_templates/{{ jt_id }}/"
        method: PATCH
        user: "{{ _controller_user }}"
        password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        body_format: json
        body:
          opa_query_path: "aap/deny"
          extra_vars: ""
        status_code: [200]
      register: r_patch_deny
      ignore_errors: true
      when: jt_id | default('') | length > 0

    - name: "prose-03: Launch Demo JT with aap/deny (OPA will block at runtime)"
      ansible.builtin.uri:
        url: "{{ _aap_api }}/job_templates/{{ jt_id }}/launch/"
        method: POST
        user: "{{ _controller_user }}"
        password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        body_format: json
        body: {}
        status_code: [200, 201, 400, 403]
      register: r_launch_deny
      ignore_errors: true
      when: jt_id | default('') | length > 0

    - name: "prose-03: Set deny-launch job ID fact"
      ansible.builtin.set_fact:
        deny_job_id: "{{ r_launch_deny.json.job | default(r_launch_deny.json.id | default('')) | string }}"
      when:
        - jt_id | default('') | length > 0
        - r_launch_deny.status | default(0) in [200, 201]

    - name: "prose-03: Poll deny job to completion (OPA blocks at runtime — expect error)"
      ansible.builtin.uri:
        url: "{{ _aap_api }}/jobs/{{ deny_job_id }}/"
        method: GET
        user: "{{ _controller_user }}"
        password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
      register: r_poll_deny
      until: r_poll_deny.json.status | default('') in ['successful', 'failed', 'canceled', 'error']
      retries: 12
      delay: 5
      ignore_errors: true
      when:
        - jt_id | default('') | length > 0
        - deny_job_id | default('') | length > 0

    - name: "prose-03: Set deny policy block fact (job ended in error/failed = OPA blocked)"
      ansible.builtin.set_fact:
        deny_policy_blocks: >-
          {{
            (r_launch_deny.status | default(0) in [400, 403]
              and 'policy' in (r_launch_deny.json | to_json | lower))
            or (deny_job_id | default('') | length > 0
                and r_poll_deny.json.status | default('') in ['error', 'failed'])
          }}
      when: jt_id | default('') | length > 0

    # -------------------------------------------------------------------------
    # prose-04: Set policy_enforcement=aap/extravars, extra_vars color=red; launch; poll; assert error
    # -------------------------------------------------------------------------
    - name: "prose-04: PATCH Demo JT — opa_query_path=aap/extravars, extra_vars color=red"
      ansible.builtin.uri:
        url: "{{ _aap_api }}/job_templates/{{ jt_id }}/"
        method: PATCH
        user: "{{ _controller_user }}"
        password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        body_format: json
        body:
          opa_query_path: "aap/extravars"
          extra_vars: "color: red"
        status_code: [200]
      register: r_patch_extravars_red
      ignore_errors: true
      when: jt_id | default('') | length > 0

    - name: "prose-04: Launch Demo JT with color=red (OPA will block at runtime)"
      ansible.builtin.uri:
        url: "{{ _aap_api }}/job_templates/{{ jt_id }}/launch/"
        method: POST
        user: "{{ _controller_user }}"
        password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        body_format: json
        body: {}
        status_code: [200, 201, 400, 403]
      register: r_launch_extravars_red
      ignore_errors: true
      when: jt_id | default('') | length > 0

    - name: "prose-04: Set extravars-red launch job ID fact"
      ansible.builtin.set_fact:
        extravars_red_job_id: "{{ r_launch_extravars_red.json.job | default(r_launch_extravars_red.json.id | default('')) | string }}"
      when:
        - jt_id | default('') | length > 0
        - r_launch_extravars_red.status | default(0) in [200, 201]

    - name: "prose-04: Poll extravars-red job to completion (expect error)"
      ansible.builtin.uri:
        url: "{{ _aap_api }}/jobs/{{ extravars_red_job_id }}/"
        method: GET
        user: "{{ _controller_user }}"
        password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
      register: r_poll_extravars_red
      until: r_poll_extravars_red.json.status | default('') in ['successful', 'failed', 'canceled', 'error']
      retries: 12
      delay: 5
      ignore_errors: true
      when:
        - jt_id | default('') | length > 0
        - extravars_red_job_id | default('') | length > 0

    - name: "prose-04: Set extravars-red block fact"
      ansible.builtin.set_fact:
        extravars_red_blocks: >-
          {{
            (r_launch_extravars_red.status | default(0) in [400, 403]
              and 'policy' in (r_launch_extravars_red.json | to_json | lower))
            or (extravars_red_job_id | default('') | length > 0
                and r_poll_extravars_red.json.status | default('') in ['error', 'failed'])
          }}
      when: jt_id | default('') | length > 0

    # -------------------------------------------------------------------------
    # prose-05: Set extra_vars color=blue (same opa_query_path=aap/extravars); launch; assert SUCCEEDS
    # -------------------------------------------------------------------------
    - name: "prose-05: PATCH Demo JT — extra_vars color=blue (aap/extravars)"
      ansible.builtin.uri:
        url: "{{ _aap_api }}/job_templates/{{ jt_id }}/"
        method: PATCH
        user: "{{ _controller_user }}"
        password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        body_format: json
        body:
          opa_query_path: "aap/extravars"
          extra_vars: "color: blue"
        status_code: [200]
      register: r_patch_extravars_blue
      ignore_errors: true
      when: jt_id | default('') | length > 0

    - name: "prose-05: Launch Demo JT with color=blue (expect success)"
      ansible.builtin.uri:
        url: "{{ _aap_api }}/job_templates/{{ jt_id }}/launch/"
        method: POST
        user: "{{ _controller_user }}"
        password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        body_format: json
        body: {}
        status_code: [200, 201]
      register: r_launch_extravars_blue
      ignore_errors: true
      when: jt_id | default('') | length > 0

    - name: "prose-05: Set blue-launch job ID fact"
      ansible.builtin.set_fact:
        extravars_blue_job_id: "{{ r_launch_extravars_blue.json.job | default(r_launch_extravars_blue.json.id | default('')) | string }}"
      when:
        - jt_id | default('') | length > 0
        - r_launch_extravars_blue.status | default(0) in [200, 201]

    - name: "prose-05: Set blue-launch allowed fact"
      ansible.builtin.set_fact:
        extravars_blue_allowed: >-
          {{
            r_launch_extravars_blue.status | default(0) in [200, 201]
            and 'policy violation' not in (r_launch_extravars_blue.json | to_json | lower)
            and (extravars_blue_job_id | default('') | length > 0)
          }}
      when: jt_id | default('') | length > 0

    - name: "prose-05: Poll blue-launch job to completion (up to 60s)"
      ansible.builtin.uri:
        url: "{{ _aap_api }}/jobs/{{ extravars_blue_job_id }}/"
        method: GET
        user: "{{ _controller_user }}"
        password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
      register: r_poll_blue
      until: r_poll_blue.json.status | default('') in ['successful', 'failed', 'canceled', 'error']
      retries: 12
      delay: 5
      ignore_errors: true
      when:
        - jt_id | default('') | length > 0
        - extravars_blue_allowed | default(false)
        - extravars_blue_job_id | default('') | length > 0

    # -------------------------------------------------------------------------
    # prose-08 (setup): PATCH Demo JT opa_query_path=aap/maintenance; find/create label; associate
    # prose-08 OPA update: PUT inclusive rego (pre-built in Play 2) to OPA from localhost.
    # The inclusive rego was already written to /var/lib/opa/policies/maintenance_window.rego by Play 2.
    # -------------------------------------------------------------------------
    - name: "prose-08: PATCH Demo JT — opa_query_path=aap/maintenance, clear extra_vars"
      ansible.builtin.uri:
        url: "{{ _aap_api }}/job_templates/{{ jt_id }}/"
        method: PATCH
        user: "{{ _controller_user }}"
        password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        body_format: json
        body:
          opa_query_path: "aap/maintenance"
          extra_vars: ""
        status_code: [200]
      register: r_patch_maint
      ignore_errors: true
      when: jt_id | default('') | length > 0

    - name: Query Default organization ID
      ansible.builtin.uri:
        url: "{{ _aap_api }}/organizations/?name=Default"
        method: GET
        user: "{{ _controller_user }}"
        password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
      register: r_org
      ignore_errors: true

    - name: Set Default org ID fact
      ansible.builtin.set_fact:
        default_org_id: "{{ (r_org.json.results | default([{'id': 1}]) | first).id | default(1) | int }}"

    - name: Query existing maintenance label in AAP
      ansible.builtin.uri:
        url: "{{ _aap_api }}/labels/?name=maintenance"
        method: GET
        user: "{{ _controller_user }}"
        password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
      register: r_label_find
      ignore_errors: true

    - name: Set maintenance label ID from existing label
      ansible.builtin.set_fact:
        maintenance_label_id: "{{ (r_label_find.json.results | default([]) | first).id | int }}"
      when: r_label_find.json.count | default(0) | int > 0

    - name: Create maintenance label in AAP if absent
      ansible.builtin.uri:
        url: "{{ _aap_api }}/labels/"
        method: POST
        user: "{{ _controller_user }}"
        password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        body_format: json
        body:
          name: "maintenance"
          organization: "{{ default_org_id }}"
        status_code: [200, 201]
      register: r_label_create
      ignore_errors: true
      when: r_label_find.json.count | default(0) | int == 0

    - name: Set maintenance label ID from newly created label
      ansible.builtin.set_fact:
        maintenance_label_id: "{{ r_label_create.json.id | int }}"
      when:
        - r_label_find.json.count | default(0) | int == 0
        - r_label_create.status | default(0) in [200, 201]

    - name: Debug maintenance label ID
      ansible.builtin.debug:
        msg: "maintenance_label_id = {{ maintenance_label_id | default('NOT SET') }}"

    # prose-08: PUT INCLUSIVE rego to OPA from localhost.
    # SSH cat reads the inclusive rego from bastion (written in Play 2), pipes to OPA PUT.
    # This runs entirely on localhost — no delegate_to.
    - name: "prose-08: PUT INCLUSIVE maintenance_window.rego to OPA API via localhost curl"
      ansible.builtin.shell: |
        REGO_CONTENT=$(ssh -p {{ _ssh_port }} -i /app/.ssh/id_rsa \
          -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
          {{ _ssh_user }}@{{ _ssh_host }} \
          'cat {{ _opa_incl_rego }}' 2>/dev/null)
        if [ -z "${REGO_CONTENT}" ]; then
          echo "ERROR: could not read inclusive rego from bastion"
          exit 1
        fi
        RESULT=$(echo "${REGO_CONTENT}" | curl -s -X PUT \
          {{ _opa_api }}/v1/policies/policies/maintenance_window.rego \
          -H 'Content-Type: text/plain' \
          --data-binary @- 2>/dev/null)
        echo "opa_put: ${RESULT}"
        OPA_VAL=$(curl -s -X POST \
          {{ _opa_api }}/v1/data/aap/maintenance/window_start_hour \
          -H 'Content-Type: application/json' \
          -d '{}' 2>/dev/null \
          | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("result","none"))' 2>/dev/null)
        echo "opa_verify_window_start_hour: ${OPA_VAL}"
      register: r_put_incl
      changed_when: false
      ignore_errors: true

    - name: "prose-08: Associate maintenance label with Demo Job Template"
      ansible.builtin.uri:
        url: "{{ _aap_api }}/job_templates/{{ jt_id }}/labels/"
        method: POST
        user: "{{ _controller_user }}"
        password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        body_format: json
        body: "{{ {'id': maintenance_label_id | int} }}"
        status_code: [200, 201, 204]
      register: r_label_assoc
      ignore_errors: true
      when:
        - jt_id | default('') | length > 0
        - maintenance_label_id | default('') | string | length > 0

    - name: "prose-08: Launch Demo JT with maintenance label inside window (expect success)"
      ansible.builtin.uri:
        url: "{{ _aap_api }}/job_templates/{{ jt_id }}/launch/"
        method: POST
        user: "{{ _controller_user }}"
        password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        body_format: json
        body: {}
        status_code: [200, 201]
      register: r_launch_maint_with_label
      ignore_errors: true
      when: jt_id | default('') | length > 0

    - name: "prose-08: Set maintenance+label-inside-window allowed fact"
      ansible.builtin.set_fact:
        maint_with_label_allowed: >-
          {{
            r_launch_maint_with_label.status | default(0) in [200, 201]
            and 'policy violation' not in (r_launch_maint_with_label.json | to_json | lower)
          }}
      when: jt_id | default('') | length > 0

    - name: "prose-08: Set maintenance+label job ID fact"
      ansible.builtin.set_fact:
        maint_label_job_id: "{{ r_launch_maint_with_label.json.job | default(r_launch_maint_with_label.json.id | default('')) | string }}"
      when:
        - jt_id | default('') | length > 0
        - maint_with_label_allowed | default(false)

    - name: "prose-08: Poll maintenance+label job to completion (up to 60s)"
      ansible.builtin.uri:
        url: "{{ _aap_api }}/jobs/{{ maint_label_job_id }}/"
        method: GET
        user: "{{ _controller_user }}"
        password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
      register: r_poll_maint_label
      until: r_poll_maint_label.json.status | default('') in ['successful', 'failed', 'canceled', 'error']
      retries: 12
      delay: 5
      ignore_errors: true
      when:
        - jt_id | default('') | length > 0
        - maint_with_label_allowed | default(false)
        - maint_label_job_id | default('') | length > 0

    # -------------------------------------------------------------------------
    # prose-09: Remove maintenance label; launch inside window; poll; assert error (no label)
    # -------------------------------------------------------------------------
    - name: "prose-09: Disassociate maintenance label from Demo Job Template"
      ansible.builtin.uri:
        url: "{{ _aap_api }}/job_templates/{{ jt_id }}/labels/"
        method: POST
        user: "{{ _controller_user }}"
        password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        body_format: json
        body: "{{ {'id': maintenance_label_id | int, 'disassociate': true} }}"
        status_code: [200, 201, 204]
      register: r_label_disassoc
      ignore_errors: true
      when:
        - jt_id | default('') | length > 0
        - maintenance_label_id | default('') | string | length > 0

    - name: "prose-09: Launch Demo JT without label, inside window (OPA will block at runtime)"
      ansible.builtin.uri:
        url: "{{ _aap_api }}/job_templates/{{ jt_id }}/launch/"
        method: POST
        user: "{{ _controller_user }}"
        password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        body_format: json
        body: {}
        status_code: [200, 201, 400, 403]
      register: r_launch_maint_no_label
      ignore_errors: true
      when: jt_id | default('') | length > 0

    - name: "prose-09: Set no-label launch job ID fact"
      ansible.builtin.set_fact:
        maint_no_label_job_id: "{{ r_launch_maint_no_label.json.job | default(r_launch_maint_no_label.json.id | default('')) | string }}"
      when:
        - jt_id | default('') | length > 0
        - r_launch_maint_no_label.status | default(0) in [200, 201]

    - name: "prose-09: Poll no-label job to completion (expect error)"
      ansible.builtin.uri:
        url: "{{ _aap_api }}/jobs/{{ maint_no_label_job_id }}/"
        method: GET
        user: "{{ _controller_user }}"
        password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
      register: r_poll_no_label
      until: r_poll_no_label.json.status | default('') in ['successful', 'failed', 'canceled', 'error']
      retries: 12
      delay: 5
      ignore_errors: true
      when:
        - jt_id | default('') | length > 0
        - maint_no_label_job_id | default('') | length > 0

    - name: "prose-09: Set no-label block fact"
      ansible.builtin.set_fact:
        maint_no_label_blocks: >-
          {{
            (r_launch_maint_no_label.status | default(0) in [400, 403]
              and 'policy' in (r_launch_maint_no_label.json | to_json | lower))
            or (maint_no_label_job_id | default('') | length > 0
                and r_poll_no_label.json.status | default('') in ['error', 'failed'])
          }}
      when: jt_id | default('') | length > 0

    # -------------------------------------------------------------------------
    # prose-10: PUT EXCLUSIVE rego to OPA; re-add label; launch; poll; assert error (outside window)
    # The exclusive rego (/tmp/maint_excl.rego) was pre-built in Play 2 on bastion.
    # This PUT happens entirely from localhost via SSH cat | curl — no delegate_to.
    # -------------------------------------------------------------------------
    - name: "prose-10: PUT OUTSIDE-window maintenance_window.rego to OPA API via localhost curl"
      ansible.builtin.shell: |
        REGO_CONTENT=$(ssh -p {{ _ssh_port }} -i /app/.ssh/id_rsa \
          -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
          {{ _ssh_user }}@{{ _ssh_host }} \
          'cat {{ _opa_excl_rego }}' 2>/dev/null)
        if [ -z "${REGO_CONTENT}" ]; then
          echo "ERROR: could not read exclusive rego from bastion ({{ _opa_excl_rego }})"
          exit 1
        fi
        RESULT=$(echo "${REGO_CONTENT}" | curl -s -X PUT \
          {{ _opa_api }}/v1/policies/policies/maintenance_window.rego \
          -H 'Content-Type: text/plain' \
          --data-binary @- 2>/dev/null)
        echo "opa_put: ${RESULT}"
        OPA_VAL=$(curl -s -X POST \
          {{ _opa_api }}/v1/data/aap/maintenance/window_start_hour \
          -H 'Content-Type: application/json' \
          -d '{}' 2>/dev/null \
          | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("result","none"))' 2>/dev/null)
        echo "opa_verify_window_start_hour: ${OPA_VAL}"
      register: r_put_excl
      changed_when: false
      ignore_errors: true

    - name: "prose-10: Re-associate maintenance label with Demo Job Template"
      ansible.builtin.uri:
        url: "{{ _aap_api }}/job_templates/{{ jt_id }}/labels/"
        method: POST
        user: "{{ _controller_user }}"
        password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        body_format: json
        body: "{{ {'id': maintenance_label_id | int} }}"
        status_code: [200, 201, 204]
      register: r_label_reassoc
      ignore_errors: true
      when:
        - jt_id | default('') | length > 0
        - maintenance_label_id | default('') | string | length > 0

    - name: "prose-10: Launch Demo JT with label but OUTSIDE maintenance window (OPA will block)"
      ansible.builtin.uri:
        url: "{{ _aap_api }}/job_templates/{{ jt_id }}/launch/"
        method: POST
        user: "{{ _controller_user }}"
        password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        body_format: json
        body: {}
        status_code: [200, 201, 400, 403]
      register: r_launch_outside
      ignore_errors: true
      when: jt_id | default('') | length > 0

    - name: "prose-10: Set outside-window launch job ID fact"
      ansible.builtin.set_fact:
        outside_window_job_id: "{{ r_launch_outside.json.job | default(r_launch_outside.json.id | default('')) | string }}"
      when:
        - jt_id | default('') | length > 0
        - r_launch_outside.status | default(0) in [200, 201]

    - name: "prose-10: Poll outside-window job to completion (expect error)"
      ansible.builtin.uri:
        url: "{{ _aap_api }}/jobs/{{ outside_window_job_id }}/"
        method: GET
        user: "{{ _controller_user }}"
        password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
      register: r_poll_outside
      until: r_poll_outside.json.status | default('') in ['successful', 'failed', 'canceled', 'error']
      retries: 12
      delay: 5
      ignore_errors: true
      when:
        - jt_id | default('') | length > 0
        - outside_window_job_id | default('') | length > 0

    - name: "prose-10: Set outside-window block fact"
      ansible.builtin.set_fact:
        maint_outside_window_blocks: >-
          {{
            (r_launch_outside.status | default(0) in [400, 403]
              and 'policy' in (r_launch_outside.json | to_json | lower))
            or (outside_window_job_id | default('') | length > 0
                and r_poll_outside.json.status | default('') in ['error', 'failed'])
          }}
      when: jt_id | default('') | length > 0

    # -------------------------------------------------------------------------
    # Final state: PUT INCLUSIVE rego back to OPA; ensure maintenance label is associated
    # The inclusive rego is at /var/lib/opa/policies/maintenance_window.rego on bastion.
    # SSH cat reads it, curl PUTs to OPA — all from localhost, no delegate_to.
    # -------------------------------------------------------------------------
    - name: "Final: PUT INCLUSIVE maintenance_window.rego to OPA API via localhost curl"
      ansible.builtin.shell: |
        REGO_CONTENT=$(ssh -p {{ _ssh_port }} -i /app/.ssh/id_rsa \
          -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
          {{ _ssh_user }}@{{ _ssh_host }} \
          'cat {{ _opa_incl_rego }}' 2>/dev/null)
        if [ -z "${REGO_CONTENT}" ]; then
          echo "ERROR: could not read inclusive rego from bastion"
          exit 1
        fi
        RESULT=$(echo "${REGO_CONTENT}" | curl -s -X PUT \
          {{ _opa_api }}/v1/policies/policies/maintenance_window.rego \
          -H 'Content-Type: text/plain' \
          --data-binary @- 2>/dev/null)
        echo "opa_put: ${RESULT}"
        OPA_VAL=$(curl -s -X POST \
          {{ _opa_api }}/v1/data/aap/maintenance/window_start_hour \
          -H 'Content-Type: application/json' \
          -d '{}' 2>/dev/null \
          | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("result","none"))' 2>/dev/null)
        echo "opa_put: ${RESULT} opa_window_start_hour: ${OPA_VAL}"
      register: r_final_put
      changed_when: false
      ignore_errors: true

    # -------------------------------------------------------------------------
    # Final state: ensure maintenance label is associated with Demo JT (validate task-7)
    # -------------------------------------------------------------------------
    - name: Read back Demo Job Template label list for final state
      ansible.builtin.uri:
        url: "{{ _aap_api }}/job_templates/{{ jt_id }}/labels/"
        method: GET
        user: "{{ _controller_user }}"
        password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
      register: r_jt_labels_check
      ignore_errors: true
      when: jt_id | default('') | length > 0

    - name: Set label-present-final fact
      ansible.builtin.set_fact:
        label_present_final: >-
          {{
            (r_jt_labels_check.json.results | default([])
              | selectattr('name', 'equalto', 'maintenance') | list | length) > 0
          }}
      when: jt_id | default('') | length > 0

    - name: Re-associate maintenance label if absent (ensure final state for validate task-7)
      ansible.builtin.uri:
        url: "{{ _aap_api }}/job_templates/{{ jt_id }}/labels/"
        method: POST
        user: "{{ _controller_user }}"
        password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        body_format: json
        body: "{{ {'id': maintenance_label_id | int} }}"
        status_code: [200, 201, 204]
      register: r_label_final_assoc
      ignore_errors: true
      when:
        - jt_id | default('') | length > 0
        - maintenance_label_id | default('') | string | length > 0
        - not (label_present_final | default(false) | bool)

    # -------------------------------------------------------------------------
    # Final state verification — read back Demo JT to confirm opa_query_path and label
    # -------------------------------------------------------------------------
    - name: Read back Demo Job Template final state
      ansible.builtin.uri:
        url: "{{ _aap_api }}/job_templates/{{ jt_id }}/"
        method: GET
        user: "{{ _controller_user }}"
        password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
      register: r_jt_final
      ignore_errors: true
      when: jt_id | default('') | length > 0

    - name: Read back Demo Job Template label list (final confirm)
      ansible.builtin.uri:
        url: "{{ _aap_api }}/job_templates/{{ jt_id }}/labels/"
        method: GET
        user: "{{ _controller_user }}"
        password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
      register: r_jt_labels_final
      ignore_errors: true
      when: jt_id | default('') | length > 0

    - name: Set final state facts
      ansible.builtin.set_fact:
        final_opa_query_path: "{{ r_jt_final.json.opa_query_path | default('') }}"
        final_label_maintenance: >-
          {{
            (r_jt_labels_final.json.results | default([]) | selectattr('name', 'equalto', 'maintenance') | list | length) > 0
          }}
      when: jt_id | default('') | length > 0

    # -------------------------------------------------------------------------
    # Report
    # -------------------------------------------------------------------------
    - name: Report solve status
      ansible.builtin.debug:
        msg: |
          === Module 09 Solve — Policy Enforcement (OPA) ===

          [Bastion — policy files]
          deny.rego in /var/lib/opa/policies:               {{ 'ok' if hostvars['_facts_relay']['bastion_deny_ok'] | default(false) else 'NOT ok' }}
          extra_vars.rego in /var/lib/opa/policies:         {{ 'ok' if hostvars['_facts_relay']['bastion_extravars_ok'] | default(false) else 'NOT ok' }}
          maintenance_window.rego in /var/lib/opa/policies: {{ 'ok' if hostvars['_facts_relay']['bastion_maint_ok'] | default(false) else 'NOT ok' }}
          OPA server reachable on bastion:8181:              {{ 'ok' if hostvars['_facts_relay']['bastion_opa_reachable'] | default(false) else 'NOT ok' }}
          exclusive rego pre-built (/tmp/maint_excl.rego):  {{ 'ok' if hostvars['_facts_relay']['bastion_excl_rego_ready'] | default(false) else 'NOT ok' }}

          [AAP policy enforcement tests]
          Demo Job Template found (id={{ jt_id | default('NOT FOUND') }}): {{ 'ok' if jt_id | default('') | length > 0 else 'NOT ok' }}
          prose-03 aap/deny blocks job execution:            {{ 'ok' if deny_policy_blocks | default(false) else 'NOT ok' }}
          prose-04 aap/extravars blocks color=red:           {{ 'ok' if extravars_red_blocks | default(false) else 'NOT ok' }}
          prose-05 aap/extravars allows color=blue:          {{ 'ok' if extravars_blue_allowed | default(false) else 'NOT ok' }}
          prose-08 aap/maintenance + label allows (inside):  {{ 'ok' if maint_with_label_allowed | default(false) else 'NOT ok' }}
          prose-09 aap/maintenance blocks (no label):        {{ 'ok' if maint_no_label_blocks | default(false) else 'NOT ok' }}
          prose-10 aap/maintenance blocks (outside window):  {{ 'ok' if maint_outside_window_blocks | default(false) else 'NOT ok' }}

          [OPA patch debug]
          prose-07 incl write (Play2): {{ r_write_incl_play2.stdout | default('skipped') | trim }}
          prose-07 incl PUT (Play2):   {{ r_put_incl_play2.stdout | default('skipped') | trim }}
          prose-07 excl write (Play2): {{ r_write_excl_play2.stdout | default('skipped') | trim }}
          prose-08 incl PUT (local):   {{ r_put_incl.stdout | default('skipped') | trim }}
          prose-10 excl PUT (local):   {{ r_put_excl.stdout | default('skipped') | trim }}
          final PUT (local):           {{ r_final_put.stdout | default('skipped') | trim }}

          [Final Demo JT state]
          opa_query_path = aap/maintenance:                  {{ 'ok' if final_opa_query_path | default('') == 'aap/maintenance' else 'NOT ok — value: ' ~ (final_opa_query_path | default('NOT SET')) }}
          label "maintenance" present on Demo JT:            {{ 'ok' if final_label_maintenance | default(false) else 'NOT ok' }}

          SKIPPED (visual/exploratory only):
            prose-01: AAP login
            prose-02: Read-only OPA settings view
            prose-06: Open-ended exploration
            prose-11: Open-ended exploration
