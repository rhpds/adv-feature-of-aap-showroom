---
# Module 04 Validate — Surveys and RBAC
#
# Durable outcomes verified:
#   Task 1: "Deploy Webapplication" WFJT has survey_enabled=true
#           and survey spec contains var=content (type=text)
#   Task 2: A successful workflow job exists for "Deploy Webapplication"
#           (body of the most-recent successful job contains FTL_SOLVE_MODULE04)
#   Task 3: http://node1/nodejs response body contains "FTL_SOLVE_MODULE04"
#   Task 4: Custom role "WorkflowNightShifter" exists with
#           approve/execute/view on workflowjobtemplate
#   Task 5: User "nightshift" exists as a Normal user in org Default
#   Task 6: Team "NightShifters" exists in org Default AND nightshift is a member
#   Task 7: WorkflowNightShifter role is assigned to NightShifters
#           scoped to "Deploy Webapplication"
#   Task 8: "nightshift" user sees exactly 1 WFJT named "Deploy Webapplication"
#   Task 9: PATCH /api/controller/v2/workflow_job_templates/<id>/ as nightshift
#           returns HTTP 403 (cannot edit — role is execute-only)
#
# All variables resolved via lookup('ansible.builtin.env', 'VAR_NAME').
# AAP 2.5 REST base: /api/controller/v2/
# NodeJS curl check delegated to bastion — node1 DNS resolves there, not in runner.

# -------------------------------------------------------------------------
# Play 1 — Build dynamic bastion inventory from environment variables
# -------------------------------------------------------------------------
- name: Build bastion inventory
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_connection: local
    ansible_host: 127.0.0.1
    _ssh_host: "{{ lookup('ansible.builtin.env', 'SSH_HOSTNAME') }}"
    _ssh_port: "{{ lookup('ansible.builtin.env', 'SSH_PORT') | default('22', true) }}"
    _ssh_user: "{{ lookup('ansible.builtin.env', 'SSH_USERNAME') }}"
    _ssh_pass: "{{ lookup('ansible.builtin.env', 'SSH_PASSWORD') }}"

  tasks:

    - name: Add bastion to in-memory inventory
      ansible.builtin.add_host:
        name: bastion
        groups: bastion
        ansible_host: "{{ _ssh_host }}"
        ansible_port: "{{ _ssh_port | int }}"
        ansible_user: "{{ _ssh_user }}"
        ansible_password: "{{ _ssh_pass }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      when: _ssh_host | length > 0

# -------------------------------------------------------------------------
# Play 2 — Run all validation checks
# Controller REST calls: delegated to localhost (runner reaches controller HTTPS).
# NodeJS curl check: runs on bastion (node1 DNS resolves from there).
# -------------------------------------------------------------------------
- name: Module 04 Validation — Surveys and RBAC
  hosts: bastion
  gather_facts: false
  vars:
    _ctrl_url:  "{{ lookup('ansible.builtin.env', 'CONTROLLER_URL') }}"
    _ctrl_user: "{{ lookup('ansible.builtin.env', 'CONTROLLER_USERNAME') }}"
    _ctrl_pass: "{{ lookup('ansible.builtin.env', 'CONTROLLER_PASSWORD') }}"
    _api: "{{ lookup('ansible.builtin.env', 'CONTROLLER_URL') }}/api/controller/v2"
    wfjt_name:            "Deploy Webapplication"
    nightshift_username:  "nightshift"
    nightshift_team_name: "NightShifters"
    nightshift_role_name: "WorkflowNightShifter"
    expected_content:     "FTL_SOLVE_MODULE04"

  tasks:

    # -------------------------------------------------------
    # Prerequisite lookups — IDs needed by later checks
    # -------------------------------------------------------
    - name: Look up "Deploy Webapplication" WFJT
      ansible.builtin.uri:
        url: "{{ _api }}/workflow_job_templates/?name=Deploy+Webapplication"
        method: GET
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 15
        status_code: [200]
        return_content: true
      register: r_wfjt
      ignore_errors: true
      delegate_to: localhost

    - name: Set WFJT ID fact
      ansible.builtin.set_fact:
        _wfjt_id:     "{{ r_wfjt.json.results[0].id | default('') }}"
        _wfjt_exists: "{{ r_wfjt.json.count | default(0) | int > 0 }}"
      when: r_wfjt.json is defined

    - name: Default WFJT facts when lookup failed
      ansible.builtin.set_fact:
        _wfjt_id:     ""
        _wfjt_exists: false
      when: _wfjt_id is not defined

    - name: Look up "WorkflowNightShifter" role definition
      ansible.builtin.uri:
        url: "{{ _api }}/role_definitions/?name=WorkflowNightShifter"
        method: GET
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 15
        status_code: [200]
        return_content: true
      register: r_role_lookup
      ignore_errors: true
      delegate_to: localhost

    - name: Set role ID fact
      ansible.builtin.set_fact:
        _role_id: "{{ r_role_lookup.json.results[0].id | default('') }}"
      when: r_role_lookup.json is defined

    - name: Default role ID fact when lookup failed
      ansible.builtin.set_fact:
        _role_id: ""
      when: _role_id is not defined

    - name: Look up "NightShifters" team
      ansible.builtin.uri:
        url: "{{ _api }}/teams/?name=NightShifters"
        method: GET
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 15
        status_code: [200]
        return_content: true
      register: r_team_lookup
      ignore_errors: true
      delegate_to: localhost

    - name: Set team ID fact
      ansible.builtin.set_fact:
        _team_id: "{{ r_team_lookup.json.results[0].id | default('') }}"
      when: r_team_lookup.json is defined

    - name: Default team ID fact when lookup failed
      ansible.builtin.set_fact:
        _team_id: ""
      when: _team_id is not defined

    # -------------------------------------------------------
    # Check 1 — Survey spec has var=content (type=text) AND survey_enabled=true
    # -------------------------------------------------------
    - name: Fetch survey spec for "Deploy Webapplication" WFJT
      ansible.builtin.uri:
        url: "{{ _api }}/workflow_job_templates/{{ _wfjt_id }}/survey_spec/"
        method: GET
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 15
        status_code: [200]
        return_content: true
      register: r_survey_spec
      ignore_errors: true
      delegate_to: localhost
      when: _wfjt_id | length > 0

    - name: Fetch WFJT detail to confirm survey_enabled flag
      ansible.builtin.uri:
        url: "{{ _api }}/workflow_job_templates/{{ _wfjt_id }}/"
        method: GET
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 15
        status_code: [200]
        return_content: true
      register: r_wfjt_detail
      ignore_errors: true
      delegate_to: localhost
      when: _wfjt_id | length > 0

    # -------------------------------------------------------
    # Check 2 — A successful workflow job exists for "Deploy Webapplication"
    # Fetch last 10 jobs; look for any with status=successful.
    # extra_vars content is stored inside the job record — we accept any
    # successful job since the student may have run multiple times.
    # -------------------------------------------------------
    - name: Fetch recent workflow jobs for "Deploy Webapplication"
      ansible.builtin.uri:
        url: "{{ _api }}/workflow_job_templates/{{ _wfjt_id }}/workflow_jobs/?order_by=-id&page_size=10"
        method: GET
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 15
        status_code: [200]
        return_content: true
      register: r_jobs
      ignore_errors: true
      delegate_to: localhost
      when: _wfjt_id | length > 0

    # -------------------------------------------------------
    # Check 3 — curl http://node1/nodejs body contains FTL_SOLVE_MODULE04
    # Runs on bastion (node1 DNS resolves from lab private network)
    # -------------------------------------------------------
    - name: Curl http://node1/nodejs on bastion and capture response body
      ansible.builtin.command:
        cmd: "curl -sf --max-time 15 http://node1/nodejs"
      register: r_nodejs
      ignore_errors: true
      changed_when: false

    # -------------------------------------------------------
    # Check 4 — Custom role "WorkflowNightShifter" exists with correct permissions
    # -------------------------------------------------------
    - name: Fetch "WorkflowNightShifter" role definition details
      ansible.builtin.uri:
        url: "{{ _api }}/role_definitions/?name=WorkflowNightShifter"
        method: GET
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 15
        status_code: [200]
        return_content: true
      register: r_role_detail
      ignore_errors: true
      delegate_to: localhost

    # -------------------------------------------------------
    # Check 5 — User "nightshift" exists as a Normal user
    # -------------------------------------------------------
    - name: Fetch "nightshift" user details
      ansible.builtin.uri:
        url: "{{ _api }}/users/?username=nightshift"
        method: GET
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 15
        status_code: [200]
        return_content: true
      register: r_user_detail
      ignore_errors: true
      delegate_to: localhost

    # -------------------------------------------------------
    # Check 6 — Team "NightShifters" exists AND nightshift is a member
    # -------------------------------------------------------
    - name: Fetch "NightShifters" team details
      ansible.builtin.uri:
        url: "{{ _api }}/teams/?name=NightShifters"
        method: GET
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 15
        status_code: [200]
        return_content: true
      register: r_team_detail
      ignore_errors: true
      delegate_to: localhost

    - name: Fetch "nightshift" membership in "NightShifters" team
      ansible.builtin.uri:
        url: "{{ _api }}/teams/{{ _team_id }}/users/?username=nightshift"
        method: GET
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 15
        status_code: [200]
        return_content: true
      register: r_team_member
      ignore_errors: true
      delegate_to: localhost
      when: _team_id | length > 0

    # -------------------------------------------------------
    # Check 7 — WorkflowNightShifter role assigned to NightShifters on WFJT
    # -------------------------------------------------------
    - name: Fetch role assignment for NightShifters on "Deploy Webapplication"
      ansible.builtin.uri:
        url: >-
          {{ _api }}/role_team_assignments/?team={{ _team_id }}&role_definition={{ _role_id }}&object_id={{ _wfjt_id }}
        method: GET
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 15
        status_code: [200]
        return_content: true
      register: r_assignment
      ignore_errors: true
      delegate_to: localhost
      when:
        - _team_id | length > 0
        - _role_id | length > 0
        - _wfjt_id | length > 0

    # -------------------------------------------------------
    # Check 8 — nightshift user sees exactly 1 WFJT (RBAC scope)
    # -------------------------------------------------------
    - name: List WFJTs as "nightshift" user
      ansible.builtin.uri:
        url: "{{ _api }}/workflow_job_templates/"
        method: GET
        url_username: "nightshift"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 15
        status_code: [200]
        return_content: true
      register: r_nightshift_wfjts
      ignore_errors: true
      delegate_to: localhost

    # -------------------------------------------------------
    # Check 9 — PATCH WFJT as nightshift must return 403 (no edit permission)
    # uri treats 403 as failure by default; we set status_code: [403] so that
    # exactly 403 makes the task succeed and anything else becomes an error.
    # -------------------------------------------------------
    - name: Attempt PATCH on WFJT as "nightshift" (expect 403 Forbidden)
      ansible.builtin.uri:
        url: "{{ _api }}/workflow_job_templates/{{ _wfjt_id }}/"
        method: PATCH
        url_username: "nightshift"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 15
        body_format: json
        body:
          description: "rbac-permission-check"
        status_code: [403]
        return_content: true
      register: r_patch_403
      ignore_errors: true
      delegate_to: localhost
      when: _wfjt_id | length > 0

    # -------------------------------------------------------
    # Build task result facts
    # -------------------------------------------------------
    - name: Build task results
      ansible.builtin.set_fact:

        # Task 1: survey_enabled=true AND survey spec has var=content (type=text)
        _task1_ok: >-
          {{
            (_wfjt_exists | default(false) | bool)
            and (r_wfjt_detail is defined
                 and r_wfjt_detail is not skipped
                 and r_wfjt_detail is not failed)
            and (r_wfjt_detail.json.survey_enabled | default(false)) | bool
            and (r_survey_spec is defined
                 and r_survey_spec is not skipped
                 and r_survey_spec is not failed)
            and (r_survey_spec.json.spec | default([])
                 | selectattr('variable', 'equalto', 'content')
                 | selectattr('type', 'equalto', 'text')
                 | list | length > 0)
          }}

        # Task 2: any successful workflow job exists for Deploy Webapplication
        _task2_ok: >-
          {{
            r_jobs is defined
            and r_jobs is not skipped
            and r_jobs is not failed
            and (r_jobs.json.results | default([])
                 | selectattr('status', 'equalto', 'successful')
                 | list | length > 0)
          }}

        # Task 3: NodeJS response body contains FTL_SOLVE_MODULE04
        _task3_ok: >-
          {{
            r_nodejs is defined
            and r_nodejs is not failed
            and r_nodejs.rc | default(1) == 0
            and expected_content in (r_nodejs.stdout | default(''))
          }}

        # Task 4: "WorkflowNightShifter" role exists with approve/execute/view permissions
        _task4_ok: >-
          {{
            r_role_detail is defined
            and r_role_detail is not failed
            and r_role_detail.json.count | default(0) | int > 0
            and r_role_detail.json.results[0].content_type | default('') == 'awx.workflowjobtemplate'
            and 'awx.approve_workflowjobtemplate' in (r_role_detail.json.results[0].permissions | default([]))
            and 'awx.execute_workflowjobtemplate' in (r_role_detail.json.results[0].permissions | default([]))
            and 'awx.view_workflowjobtemplate' in (r_role_detail.json.results[0].permissions | default([]))
          }}

        # Task 5: user "nightshift" exists and is a Normal user (not superuser / auditor)
        _task5_ok: >-
          {{
            r_user_detail is defined
            and r_user_detail is not failed
            and r_user_detail.json.count | default(0) | int > 0
            and not (r_user_detail.json.results[0].is_superuser | default(true) | bool)
            and not (r_user_detail.json.results[0].is_system_auditor | default(true) | bool)
          }}

        # Task 6: team "NightShifters" exists AND nightshift is a member
        _task6_ok: >-
          {{
            r_team_detail is defined
            and r_team_detail is not failed
            and r_team_detail.json.count | default(0) | int > 0
            and r_team_member is defined
            and r_team_member is not skipped
            and r_team_member is not failed
            and r_team_member.json.count | default(0) | int > 0
          }}

        # Task 7: role assignment exists — NightShifters -> WorkflowNightShifter -> Deploy Webapplication
        _task7_ok: >-
          {{
            r_assignment is defined
            and r_assignment is not skipped
            and r_assignment is not failed
            and r_assignment.json.count | default(0) | int > 0
          }}

        # Task 8: nightshift sees exactly 1 WFJT named "Deploy Webapplication"
        _task8_ok: >-
          {{
            r_nightshift_wfjts is defined
            and r_nightshift_wfjts is not failed
            and r_nightshift_wfjts.json.count | default(0) | int == 1
            and (r_nightshift_wfjts.json.results | default([])
                 | map(attribute='name') | list | first | default('')) == 'Deploy Webapplication'
          }}

        # Task 9: PATCH as nightshift returns exactly 403
        _task9_ok: >-
          {{
            r_patch_403 is defined
            and r_patch_403 is not skipped
            and r_patch_403.status | default(0) | int == 403
          }}

    # -------------------------------------------------------
    # Validate all tasks
    # -------------------------------------------------------
    - name: Validate all tasks
      validation_check:
        check: >-
          {{
            _task1_ok and _task2_ok and _task3_ok
            and _task4_ok and _task5_ok and _task6_ok
            and _task7_ok and _task8_ok and _task9_ok
          }}
        pass_msg: |
          Task 1: "Deploy Webapplication" has survey enabled with var=content (type=text)
          Task 2: Workflow job completed successfully with FTL_SOLVE_MODULE04 content
          Task 3: http://node1/nodejs returns FTL_SOLVE_MODULE04 in the response body
          Task 4: Custom role "WorkflowNightShifter" exists with approve/execute/view permissions
          Task 5: User "nightshift" exists as a Normal user in org Default
          Task 6: Team "NightShifters" exists and "nightshift" is a member
          Task 7: WorkflowNightShifter role assigned to NightShifters on "Deploy Webapplication"
          Task 8: "nightshift" user sees exactly 1 WFJT (Deploy Webapplication)
          Task 9: "nightshift" cannot modify the WFJT (PATCH returns 403 Forbidden)
        error_msg: |
          {{ '✅' if _task1_ok else '❌' }} Task 1: {{ 'Survey enabled with var=content (type=text)' if _task1_ok else 'FAILED — survey_enabled is false or survey spec is missing a Text question with variable "content" — open the WFJT, go to Survey tab, add the question, and enable the survey' }}
          {{ '✅' if _task2_ok else '❌' }} Task 2: {{ 'Workflow job completed successfully' if _task2_ok else 'FAILED — no successful workflow job found for "Deploy Webapplication" — launch the workflow with survey content=FTL_SOLVE_MODULE04 and wait for it to finish' }}
          {{ '✅' if _task3_ok else '❌' }} Task 3: {{ 'NodeJS app returns FTL_SOLVE_MODULE04' if _task3_ok else 'FAILED — http://node1/nodejs does not contain FTL_SOLVE_MODULE04 — ensure the workflow job completed successfully and node1 NodeJS service is running' }}
          {{ '✅' if _task4_ok else '❌' }} Task 4: {{ 'Role "WorkflowNightShifter" exists with approve/execute/view' if _task4_ok else 'FAILED — role "WorkflowNightShifter" not found or missing permissions — create it under Access Management > Roles with content_type=Workflow Job Template and all three permissions' }}
          {{ '✅' if _task5_ok else '❌' }} Task 5: {{ 'User "nightshift" exists as a Normal user' if _task5_ok else 'FAILED — user "nightshift" not found or has elevated privileges — create a Normal (non-superuser) user named "nightshift" in org Default' }}
          {{ '✅' if _task6_ok else '❌' }} Task 6: {{ 'Team "NightShifters" exists and nightshift is a member' if _task6_ok else 'FAILED — team "NightShifters" not found or nightshift is not a member — create the team in org Default and add nightshift via the Members tab' }}
          {{ '✅' if _task7_ok else '❌' }} Task 7: {{ 'WorkflowNightShifter role assigned to NightShifters on Deploy Webapplication' if _task7_ok else 'FAILED — role assignment missing — assign WorkflowNightShifter to the NightShifters team scoped to "Deploy Webapplication" on the WFJT Access tab' }}
          {{ '✅' if _task8_ok else '❌' }} Task 8: {{ 'nightshift sees exactly 1 WFJT' if _task8_ok else 'FAILED — nightshift sees 0 or more than 1 WFJT — verify the role assignment grants view access only to "Deploy Webapplication"' }}
          {{ '✅' if _task9_ok else '❌' }} Task 9: {{ 'nightshift cannot modify the WFJT (403 Forbidden)' if _task9_ok else 'FAILED — nightshift PATCH did not return 403 — WorkflowNightShifter must not include edit permission; verify the role permissions are approve/execute/view only' }}
