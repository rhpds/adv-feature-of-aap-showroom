---
# Module 03 Solve — Workflows
#
# What the student does in this module:
#   1. Create "Deploy Webapplication" workflow job template in AAP (org Default)
#   2. Add two nodes: Web Infra Deploy (run_type: always from Start)
#                     Web App Deploy  (run_type: on_success, linked to Web Infra Deploy)
#   3. Launch the workflow and wait for successful completion
#   4. Verify NodeJS app returns "Hello World" at http://node1_hostname/nodejs
#
# Automation strategy:
#   Play 1 — Build bastion inventory from ENV vars (SSH_HOST / SSH_PORT / SSH_USERNAME / SSH_PASSWORD)
#   Play 2 — REST API calls via ansible.builtin.uri delegated to localhost
#             (runner can reach controller HTTPS; avoids awx.awx OAuth issues on AAP 2.5)
#             AAP 2.5 REST API base: /api/controller/v2/
#             success_nodes link uses curl (uri module sends Jinja2 ints as JSON strings)
#   NodeJS check — curl run directly on bastion (node1 DNS resolves there, not in runner)
#
# All variables resolved exclusively via lookup('ansible.builtin.env', 'VAR_NAME').

# -------------------------------------------------------------------------
# Play 1 — Build dynamic bastion inventory from environment variables
# -------------------------------------------------------------------------
- name: Build bastion inventory
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _ssh_host: "{{ lookup('ansible.builtin.env', 'SSH_HOST') }}"
    _ssh_port: "{{ lookup('ansible.builtin.env', 'SSH_PORT') | default('22') }}"
    _ssh_user: "{{ lookup('ansible.builtin.env', 'SSH_USERNAME') }}"
    _ssh_pass: "{{ lookup('ansible.builtin.env', 'SSH_PASSWORD') }}"

  tasks:

    - name: Add bastion to in-memory inventory
      ansible.builtin.add_host:
        name: bastion
        groups: bastion
        ansible_host: "{{ _ssh_host }}"
        ansible_port: "{{ _ssh_port | int }}"
        ansible_user: "{{ _ssh_user }}"
        ansible_password: "{{ _ssh_pass }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      when: _ssh_host | length > 0

# -------------------------------------------------------------------------
# Play 2 — Create workflow, link nodes, launch and verify
# All AAP REST calls use ansible.builtin.uri delegated to localhost.
# NodeJS check runs via ansible.builtin.command directly on bastion.
# -------------------------------------------------------------------------
- name: Module 03 Solve — Workflows
  hosts: bastion
  gather_facts: false
  vars:
    _ctrl_url: "{{ lookup('ansible.builtin.env', 'CONTROLLER_URL') }}"
    _ctrl_user: "{{ lookup('ansible.builtin.env', 'CONTROLLER_USERNAME') }}"
    _ctrl_pass: "{{ lookup('ansible.builtin.env', 'CONTROLLER_PASSWORD') }}"
    _node1: "{{ lookup('ansible.builtin.env', 'SSH_HOST') | regex_replace('^bastion\\.', 'node1.') }}"
    _api: "{{ lookup('ansible.builtin.env', 'CONTROLLER_URL') }}/api/controller/v2"

  tasks:

    # -----------------------------------------------------------------------
    # Prereq — Confirm prerequisite job templates from module-02 exist
    # -----------------------------------------------------------------------
    - name: Get Web Infra Deploy job template ID
      ansible.builtin.uri:
        url: "{{ _api }}/job_templates/?name=Web+Infra+Deploy"
        method: GET
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_jt_infra
      ignore_errors: true
      delegate_to: localhost

    - name: Get Web App Deploy job template ID
      ansible.builtin.uri:
        url: "{{ _api }}/job_templates/?name=Web+App+Deploy"
        method: GET
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_jt_app
      ignore_errors: true
      delegate_to: localhost

    - name: Set job template ID facts
      ansible.builtin.set_fact:
        _jt_infra_id: "{{ r_jt_infra.json.results[0].id | default('') }}"
        _jt_app_id: "{{ r_jt_app.json.results[0].id | default('') }}"

    - name: Report prerequisite job template IDs
      ansible.builtin.debug:
        msg: "Prereq JTs — Web Infra Deploy: {{ _jt_infra_id }}  |  Web App Deploy: {{ _jt_app_id }}"

    # -----------------------------------------------------------------------
    # Task 1 — Create "Deploy Webapplication" workflow job template (idempotent)
    # POST /api/controller/v2/workflow_job_templates/
    # -----------------------------------------------------------------------
    - name: Check if "Deploy Webapplication" workflow job template already exists
      ansible.builtin.uri:
        url: "{{ _api }}/workflow_job_templates/?name=Deploy+Webapplication"
        method: GET
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_wfjt_check
      ignore_errors: true
      delegate_to: localhost

    - name: Set existing WFJT ID when found
      ansible.builtin.set_fact:
        _existing_wfjt_id: "{{ r_wfjt_check.json.results[0].id | default('') }}"
      when:
        - r_wfjt_check is not failed
        - (r_wfjt_check.json.count | default(0)) | int > 0

    - name: Default existing WFJT ID to empty when not found
      ansible.builtin.set_fact:
        _existing_wfjt_id: ""
      when: _existing_wfjt_id is not defined

    - name: Create "Deploy Webapplication" workflow job template
      ansible.builtin.uri:
        url: "{{ _api }}/workflow_job_templates/"
        method: POST
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [201]
        body_format: json
        body:
          name: "Deploy Webapplication"
          organization: 1
          description: "Deploy web infrastructure and application via workflow"
        return_content: true
      register: r_wfjt_create
      ignore_errors: true
      delegate_to: localhost
      when: _existing_wfjt_id | length == 0

    - name: Set WFJT ID from newly created template
      ansible.builtin.set_fact:
        _wfjt_id: "{{ r_wfjt_create.json.id | default('') }}"
      when:
        - r_wfjt_create is not skipped
        - r_wfjt_create is not failed

    - name: Set WFJT ID from existing template
      ansible.builtin.set_fact:
        _wfjt_id: "{{ _existing_wfjt_id }}"
      when: _existing_wfjt_id | length > 0

    - name: Default WFJT ID when creation failed
      ansible.builtin.set_fact:
        _wfjt_id: ""
      when: _wfjt_id is not defined

    - name: Report workflow template status
      ansible.builtin.debug:
        msg: "Workflow template ID: {{ _wfjt_id }} ({{ 'existing' if _existing_wfjt_id | length > 0 else 'created' }})"

    # -----------------------------------------------------------------------
    # Task 2 — Check how many workflow nodes already exist (idempotency guard)
    # -----------------------------------------------------------------------
    - name: Check existing workflow nodes
      ansible.builtin.uri:
        url: "{{ _api }}/workflow_job_templates/{{ _wfjt_id }}/workflow_nodes/?page_size=20"
        method: GET
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_existing_nodes
      ignore_errors: true
      delegate_to: localhost
      when: _wfjt_id | length > 0

    - name: Set existing nodes count fact
      ansible.builtin.set_fact:
        _existing_nodes_count: "{{ r_existing_nodes.json.count | default(0) | int }}"
      when:
        - r_existing_nodes is not skipped
        - r_existing_nodes is not failed

    - name: Default existing nodes count to 0
      ansible.builtin.set_fact:
        _existing_nodes_count: 0
      when: _existing_nodes_count is not defined

    # -----------------------------------------------------------------------
    # Task 3 — Create workflow nodes when not already present
    # Web Infra Deploy → (always from Start)
    # Web App Deploy   → (created here; linked on_success in Task 4)
    # -----------------------------------------------------------------------
    - name: Create Web Infra Deploy workflow node
      ansible.builtin.uri:
        url: "{{ _api }}/workflow_job_templates/{{ _wfjt_id }}/workflow_nodes/"
        method: POST
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [201]
        body_format: json
        body:
          unified_job_template: "{{ _jt_infra_id | int }}"
          identifier: "Web Infra Deploy"
        return_content: true
      register: r_node_infra
      ignore_errors: true
      delegate_to: localhost
      when:
        - _wfjt_id | length > 0
        - _jt_infra_id | length > 0
        - _existing_nodes_count | int == 0

    - name: Create Web App Deploy workflow node
      ansible.builtin.uri:
        url: "{{ _api }}/workflow_job_templates/{{ _wfjt_id }}/workflow_nodes/"
        method: POST
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [201]
        body_format: json
        body:
          unified_job_template: "{{ _jt_app_id | int }}"
          identifier: "Web App Deploy"
        return_content: true
      register: r_node_app
      ignore_errors: true
      delegate_to: localhost
      when:
        - _wfjt_id | length > 0
        - _jt_app_id | length > 0
        - _existing_nodes_count | int == 0

    - name: Set node IDs from newly created nodes
      ansible.builtin.set_fact:
        _node_infra_id: "{{ r_node_infra.json.id | default('') }}"
        _node_app_id: "{{ r_node_app.json.id | default('') }}"
      when:
        - r_node_infra is not skipped
        - r_node_infra is not failed
        - r_node_app is not skipped
        - r_node_app is not failed

    - name: Set node IDs from pre-existing nodes
      ansible.builtin.set_fact:
        _node_infra_id: >-
          {{
            r_existing_nodes.json.results
            | default([])
            | selectattr('identifier', 'equalto', 'Web Infra Deploy')
            | map(attribute='id')
            | first
            | default('')
          }}
        _node_app_id: >-
          {{
            r_existing_nodes.json.results
            | default([])
            | selectattr('identifier', 'equalto', 'Web App Deploy')
            | map(attribute='id')
            | first
            | default('')
          }}
      when: _existing_nodes_count | int > 0

    - name: Default node IDs when not yet set
      ansible.builtin.set_fact:
        _node_infra_id: "{{ _node_infra_id | default('') }}"
        _node_app_id: "{{ _node_app_id | default('') }}"

    - name: Report workflow node IDs
      ansible.builtin.debug:
        msg: "Node IDs — Web Infra Deploy: {{ _node_infra_id }}  |  Web App Deploy: {{ _node_app_id }}"

    # -----------------------------------------------------------------------
    # Task 4 — Link Web App Deploy as success_node of Web Infra Deploy
    # POST /api/controller/v2/workflow_job_template_nodes/<infra_id>/success_nodes/
    #
    # curl is used here instead of ansible.builtin.uri because uri's body_format:json
    # renders Jinja2-templated integers as JSON strings ("N" not N) and the AAP API
    # strictly requires the "id" field to be an integer type.
    # -----------------------------------------------------------------------
    - name: Check if success link already exists between the two nodes
      ansible.builtin.uri:
        url: "{{ _api }}/workflow_job_template_nodes/{{ _node_infra_id }}/success_nodes/"
        method: GET
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_success_check
      ignore_errors: true
      delegate_to: localhost
      when: _node_infra_id | string | length > 0

    - name: Set success link exists fact
      ansible.builtin.set_fact:
        _success_link_exists: "{{ (r_success_check.json.count | default(0)) | int > 0 }}"
      when:
        - r_success_check is not skipped
        - r_success_check is not failed

    - name: Default success link exists to false
      ansible.builtin.set_fact:
        _success_link_exists: false
      when: _success_link_exists is not defined

    - name: Link Web App Deploy as success_node of Web Infra Deploy (curl for integer body)
      ansible.builtin.command:
        cmd: >-
          curl -sk
          -u "{{ _ctrl_user }}:{{ _ctrl_pass }}"
          -X POST
          -H "Content-Type: application/json"
          -d '{"id": {{ _node_app_id | int }}}'
          -w "\n%{http_code}"
          "{{ _api }}/workflow_job_template_nodes/{{ _node_infra_id }}/success_nodes/"
      register: r_link
      changed_when: (r_link.stdout_lines | last | default('0')) | int == 204
      failed_when: (r_link.stdout_lines | last | default('0')) | int not in [204, 400]
      ignore_errors: true
      delegate_to: localhost
      when:
        - _node_infra_id | string | length > 0
        - _node_app_id | string | length > 0
        - not _success_link_exists

    - name: Report node link result
      ansible.builtin.debug:
        msg: >-
          Success link (Web Infra Deploy -> Web App Deploy):
          {{ 'already existed' if _success_link_exists
             else ('ok' if (r_link is not skipped and r_link is not failed)
             else 'FAILED') }}

    # -----------------------------------------------------------------------
    # Task 5 — Launch "Deploy Webapplication" workflow and poll until done
    # POST /api/controller/v2/workflow_job_templates/<id>/launch/
    # Poll /api/controller/v2/workflow_jobs/<job_id>/ until terminal state
    # Timeout: 30 retries x 10 s = 5 minutes
    # -----------------------------------------------------------------------
    - name: Launch Deploy Webapplication workflow
      ansible.builtin.uri:
        url: "{{ _api }}/workflow_job_templates/{{ _wfjt_id }}/launch/"
        method: POST
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [201]
        body_format: json
        body: {}
        return_content: true
      register: r_launch
      ignore_errors: true
      delegate_to: localhost
      when: _wfjt_id | length > 0

    - name: Set workflow job ID fact
      ansible.builtin.set_fact:
        _wf_job_id: "{{ r_launch.json.id | default('') }}"
      when:
        - r_launch is not skipped
        - r_launch is not failed

    - name: Default workflow job ID when launch failed
      ansible.builtin.set_fact:
        _wf_job_id: ""
      when: _wf_job_id is not defined

    - name: Report workflow job ID
      ansible.builtin.debug:
        msg: "Launched workflow job ID: {{ _wf_job_id }}"

    - name: Wait for workflow job to reach a terminal state
      ansible.builtin.uri:
        url: "{{ _api }}/workflow_jobs/{{ _wf_job_id }}/"
        method: GET
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 15
        status_code: [200]
        return_content: true
      register: r_job_status
      ignore_errors: true
      delegate_to: localhost
      until: r_job_status.json.status | default('') in ['successful', 'failed', 'error', 'canceled']
      retries: 30
      delay: 10
      when: _wf_job_id | length > 0

    - name: Set workflow final status fact
      ansible.builtin.set_fact:
        _workflow_status: "{{ r_job_status.json.status | default('unknown') }}"
      when:
        - r_job_status is not skipped
        - r_job_status is not failed

    - name: Default workflow status when not polled
      ansible.builtin.set_fact:
        _workflow_status: "unknown"
      when: _workflow_status is not defined

    - name: Report workflow final status
      ansible.builtin.debug:
        msg: "Workflow job {{ _wf_job_id }} final status: {{ _workflow_status }}"

    # -----------------------------------------------------------------------
    # Task 6 — Verify NodeJS application responds with "Hello World" on node1
    # curl runs directly on bastion — node1 DNS is reachable from bastion, not runner
    # -----------------------------------------------------------------------
    - name: Verify NodeJS application returns Hello World on node1
      ansible.builtin.command:
        cmd: "curl -sf --max-time 10 http://node1/nodejs"
      register: r_nodejs
      ignore_errors: true
      changed_when: false

    - name: Set nodejs check fact
      ansible.builtin.set_fact:
        _nodejs_ok: "{{ r_nodejs.rc | default(1) == 0 and 'hello world' in (r_nodejs.stdout | default('') | lower) }}"

    # -----------------------------------------------------------------------
    # Final Report
    # -----------------------------------------------------------------------
    - name: Report solve status
      ansible.builtin.debug:
        msg: |
          Workflow template "Deploy Webapplication" (ID {{ _wfjt_id }}): {{ 'ok' if _wfjt_id | length > 0 else 'NOT ok — failed to create/find template' }}
          Prerequisite JTs present (Web Infra Deploy / Web App Deploy): {{ 'ok' if (_jt_infra_id | length > 0 and _jt_app_id | length > 0) else 'NOT ok — run module-02 solve first' }}
          Workflow nodes configured (2 nodes): {{ 'ok (Web Infra Deploy -> Web App Deploy)' if (_node_infra_id | string | length > 0 and _node_app_id | string | length > 0) else 'NOT ok — check JT IDs above' }}
          Success link (on_success edge): {{ 'ok' if (_success_link_exists or (r_link is defined and r_link is not skipped and r_link is not failed)) else 'NOT ok' }}
          Workflow launched and completed successfully: {{ 'ok' if _workflow_status == 'successful' else 'NOT ok (status: ' ~ _workflow_status ~ ')' }}
          NodeJS app at http://node1/nodejs returns Hello World: {{ 'ok' if _nodejs_ok else 'NOT ok — check workflow job details in AAP UI' }}
