---
# Module 05 Solve — Dynamic Inventories
#
# What the student does:
#   block-01: Verify Gitea inventory_list URL returns HTTP 200 + JSON with "dyngroup" key
#   block-02: Write dyninv.sh to /home/lab-user/dyninv.sh on bastion
#   block-03: chmod +x /home/lab-user/dyninv.sh
#   block-04: Run dyninv.sh --list; verify JSON output contains "dyngroup"
#   prose-01: Create AAP inventory "Cloud inventory" in org Default
#   prose-02: Create inventory source "Cloud inventory Script" (scm, Lab Project Repo,
#             source_path=constructed-inventory/inventory-script,
#             update_on_launch=true, update_cache_timeout=300)
#   prose-03: Trigger inventory sync; poll until status=successful
#   prose-04: Verify >= 7 hosts in "Cloud inventory" after sync
#
# Variable resolution: ALL vars come from env lookups — no bare extravars.
# Play 1 — build bastion inventory from env
# Play 2 — bastion tasks (write dyninv.sh, chmod, smoke-test --list)
# Play 3 — localhost REST API tasks (Gitea check, create inventory + source, sync, verify hosts)

# ─────────────────────────────────────────────────────────────────────────────
# Play 1 — Build bastion in-memory inventory from env lookups
# ─────────────────────────────────────────────────────────────────────────────
- name: Module 05 Solve — build bastion inventory
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_connection: local
    ansible_host: 127.0.0.1
    _ssh_host: "{{ lookup('ansible.builtin.env', 'SSH_HOSTNAME') }}"
    _ssh_port: "{{ lookup('ansible.builtin.env', 'SSH_PORT') | default('22', true) }}"
    _ssh_user: "{{ lookup('ansible.builtin.env', 'SSH_USERNAME') | default('lab-user', true) }}"
    _ssh_pass: "{{ lookup('ansible.builtin.env', 'SSH_PASSWORD') }}"

  tasks:
    - name: Add bastion to in-memory inventory
      ansible.builtin.add_host:
        name: bastion
        groups: bastion
        ansible_host: "{{ _ssh_host }}"
        ansible_port: "{{ _ssh_port | int }}"
        ansible_user: "{{ _ssh_user }}"
        ansible_password: "{{ _ssh_pass }}"
        ansible_ssh_private_key_file: "/app/.ssh/id_rsa"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      when: _ssh_host | length > 0

# ─────────────────────────────────────────────────────────────────────────────
# Play 2 — Write dyninv.sh to bastion and smoke-test it
# ─────────────────────────────────────────────────────────────────────────────
- name: Module 05 Solve — write dyninv.sh to bastion
  hosts: bastion
  gather_facts: false
  vars:
    _ssh_user: "{{ lookup('ansible.builtin.env', 'SSH_USERNAME') | default('lab-user', true) }}"
    _gitea_url: "{{ lookup('ansible.builtin.env', 'GITEA_URL') | regex_replace('/+$', '') }}"
    _gitea_user: "{{ lookup('ansible.builtin.env', 'GITEA_USERNAME') }}"
    _gitea_repo: "playbooks-adv-controller"
    _script_path: "/home/{{ lookup('ansible.builtin.env', 'SSH_USERNAME') | default('lab-user', true) }}/dyninv.sh"
    _inventory_list_url: >-
      {{ lookup('ansible.builtin.env', 'GITEA_URL') | regex_replace('/+$', '') }}/{{ lookup('ansible.builtin.env', 'GITEA_USERNAME') }}/playbooks-adv-controller/raw/branch/main/constructed-inventory/inventory_list

  tasks:

    # ── block-02 + block-03 — Write the dynamic inventory script (mode=0755) ──
    - name: Write dyninv.sh to bastion home directory (mode 0755)
      ansible.builtin.copy:
        dest: "{{ _script_path }}"
        mode: "0755"
        content: |
          #!/bin/bash

          if [ "$1" == "--list" ] ; then
              curl -sS {{ _inventory_list_url }}
          elif [ "$1" == "--host" ]; then
              echo '{"_meta": {"hostvars": {}}}'
          else
              echo "{ }"
          fi

    # ── block-04 — Smoke-test: run dyninv.sh --list and confirm "dyngroup" ───
    - name: Run dyninv.sh --list and capture JSON output
      ansible.builtin.command:
        cmd: "{{ _script_path }} --list"
      register: r_dyninv
      changed_when: false
      ignore_errors: true

    - name: Set dyninv smoke-test result fact
      ansible.builtin.set_fact:
        _dyninv_ok: "{{ 'dyngroup' in (r_dyninv.stdout | default('')) }}"

    - name: Show dyninv.sh --list result (first 400 chars)
      ansible.builtin.debug:
        msg: >-
          dyninv.sh --list (first 400 chars): {{ r_dyninv.stdout[:400] | default('(empty)') }}
          Contains "dyngroup": {{ _dyninv_ok }}

# ─────────────────────────────────────────────────────────────────────────────
# Play 3 — REST API tasks: Gitea check, AAP inventory + source, sync, host count
# All uri tasks run on localhost (runner container reaches controller HTTPS).
# ─────────────────────────────────────────────────────────────────────────────
- name: Module 05 Solve — configure AAP Cloud inventory
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_connection: local
    ansible_host: 127.0.0.1
    # ── env lookups ────────────────────────────────────────────────────────────
    _controller_url: "{{ lookup('ansible.builtin.env', 'CONTROLLER_URL') | regex_replace('/+$', '') }}"
    _controller_user: "{{ lookup('ansible.builtin.env', 'CONTROLLER_USERNAME') }}"
    _controller_pass: "{{ lookup('ansible.builtin.env', 'CONTROLLER_PASSWORD') }}"
    _gitea_url: "{{ lookup('ansible.builtin.env', 'GITEA_URL') | regex_replace('/+$', '') }}"
    _gitea_username: "{{ lookup('ansible.builtin.env', 'GITEA_USERNAME') }}"
    _ssh_username: "{{ lookup('ansible.builtin.env', 'SSH_USERNAME') | default('lab-user', true) }}"
    # ── derived ────────────────────────────────────────────────────────────────
    _api: "{{ _controller_url }}/api/controller/v2"
    _inventory_list_url: >-
      {{ _gitea_url }}/{{ _gitea_username }}/playbooks-adv-controller/raw/branch/main/constructed-inventory/inventory_list

  tasks:

    # ── block-01 — Verify Gitea inventory_list URL returns HTTP 200 ───────────
    - name: Verify Gitea inventory_list URL returns HTTP 200
      ansible.builtin.uri:
        url: "{{ _inventory_list_url }}"
        method: GET
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_gitea_check
      ignore_errors: true

    - name: Set Gitea check facts
      ansible.builtin.set_fact:
        _gitea_ok: "{{ r_gitea_check.status | default(0) == 200 }}"
        _gitea_has_dyngroup: "{{ 'dyngroup' in (r_gitea_check.content | default('')) }}"

    - name: Report Gitea inventory_list check
      ansible.builtin.debug:
        msg: >-
          Gitea inventory_list HTTP 200: {{ _gitea_ok }}
          Contains "dyngroup": {{ _gitea_has_dyngroup }}

    # ── prose-01: Resolve Default org ID ─────────────────────────────────────
    - name: Look up "Default" organization ID
      ansible.builtin.uri:
        url: "{{ _api }}/organizations/?name=Default"
        method: GET
        url_username: "{{ _controller_user }}"
        url_password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_org
      ignore_errors: true

    - name: Set Default org ID fact
      ansible.builtin.set_fact:
        _org_id: "{{ (r_org.json.results | default([]) | map(attribute='id') | list | first) | default('') }}"
        _org_ok: "{{ (r_org.json.count | default(0)) | int > 0 }}"

    - name: Warn if Default org not found
      ansible.builtin.debug:
        msg: "WARNING: Default organization not found — inventory creation will be skipped."
      when: not (_org_ok | bool)

    # ── prose-01: Check if "Cloud inventory" already exists ──────────────────
    - name: Check if "Cloud inventory" already exists in AAP
      ansible.builtin.uri:
        url: "{{ _api }}/inventories/?name=Cloud+inventory&organization={{ _org_id }}"
        method: GET
        url_username: "{{ _controller_user }}"
        url_password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_inv_check
      ignore_errors: true
      when: _org_id | string | length > 0

    - name: Set inventory pre-existing facts
      ansible.builtin.set_fact:
        _inv_exists: "{{ (r_inv_check.json.count | default(0)) | int > 0 }}"
        _inv_id: "{{ (r_inv_check.json.results | default([]) | map(attribute='id') | list | first) | default('') }}"
      when: r_inv_check is not skipped

    - name: Default inventory facts when org lookup skipped
      ansible.builtin.set_fact:
        _inv_exists: false
        _inv_id: ''
      when: r_inv_check is skipped or r_inv_check is not defined

    # ── prose-01: Create "Cloud inventory" ───────────────────────────────────
    - name: Create "Cloud inventory" in AAP org Default
      ansible.builtin.uri:
        url: "{{ _api }}/inventories/"
        method: POST
        url_username: "{{ _controller_user }}"
        url_password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [201]
        body_format: json
        body:
          name: "Cloud inventory"
          organization: "{{ _org_id | int }}"
          description: "Dynamic cloud inventory from Gitea script"
        return_content: true
      register: r_inv_create
      ignore_errors: true
      when:
        - not (_inv_exists | bool)
        - _org_id | string | length > 0

    - name: Set inventory ID from creation result
      ansible.builtin.set_fact:
        _inv_id: "{{ r_inv_create.json.id | default(_inv_id) }}"
      when:
        - r_inv_create is not skipped
        - r_inv_create is not failed
        - (r_inv_create.json.id | default('')) | string | length > 0

    - name: Set inventory ok fact
      ansible.builtin.set_fact:
        _inv_ok: "{{ _inv_id | string | length > 0 }}"

    - name: Report inventory status
      ansible.builtin.debug:
        msg: >-
          Cloud inventory ID: {{ _inv_id }}
          ({{ 'pre-existing' if _inv_exists else ('created' if _inv_ok else 'FAILED') }})

    # ── prose-02: Resolve "Lab Project Repo" SCM project ID ──────────────────
    - name: Look up "Lab Project Repo" SCM project in AAP
      ansible.builtin.uri:
        url: "{{ _api }}/projects/?name=Lab+Project+Repo"
        method: GET
        url_username: "{{ _controller_user }}"
        url_password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_project
      ignore_errors: true

    - name: Set project ID fact
      ansible.builtin.set_fact:
        _project_id: "{{ (r_project.json.results | default([]) | map(attribute='id') | list | first) | default('') }}"
        _project_ok: "{{ (r_project.json.count | default(0)) | int > 0 }}"

    - name: Warn if Lab Project Repo not found
      ansible.builtin.debug:
        msg: "WARNING: Lab Project Repo not found in AAP — inventory source creation will be skipped."
      when: not (_project_ok | bool)

    # ── prose-02: Check if "Cloud inventory Script" source already exists ─────
    - name: Check if "Cloud inventory Script" source already exists
      ansible.builtin.uri:
        url: "{{ _api }}/inventory_sources/?name=Cloud+inventory+Script&inventory={{ _inv_id }}"
        method: GET
        url_username: "{{ _controller_user }}"
        url_password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_src_check
      ignore_errors: true
      when: _inv_id | string | length > 0

    - name: Set source pre-existing facts
      ansible.builtin.set_fact:
        _src_exists: "{{ (r_src_check.json.count | default(0)) | int > 0 }}"
        _src_id: "{{ (r_src_check.json.results | default([]) | map(attribute='id') | list | first) | default('') }}"
      when: r_src_check is not skipped

    - name: Default source facts when inventory lookup was skipped
      ansible.builtin.set_fact:
        _src_exists: false
        _src_id: ''
      when: r_src_check is skipped or r_src_check is not defined

    # ── prose-02: Create "Cloud inventory Script" source ─────────────────────
    - name: Create "Cloud inventory Script" source (scm, update_on_launch, cache=300)
      ansible.builtin.uri:
        url: "{{ _api }}/inventory_sources/"
        method: POST
        url_username: "{{ _controller_user }}"
        url_password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [201]
        body_format: json
        body:
          name: "Cloud inventory Script"
          inventory: "{{ _inv_id | int }}"
          source: "scm"
          source_project: "{{ _project_id | int }}"
          source_path: "constructed-inventory/inventory-script"
          update_on_launch: true
          update_cache_timeout: 300
          overwrite: true
          overwrite_vars: true
        return_content: true
      register: r_src_create
      ignore_errors: true
      when:
        - not (_src_exists | bool)
        - _inv_id | string | length > 0
        - _project_id | string | length > 0

    - name: Set source ID from creation result
      ansible.builtin.set_fact:
        _src_id: "{{ r_src_create.json.id | default(_src_id) }}"
      when:
        - r_src_create is not skipped
        - r_src_create is not failed
        - (r_src_create.json.id | default('')) | string | length > 0

    - name: Set source ok fact
      ansible.builtin.set_fact:
        _src_ok: "{{ _src_id | string | length > 0 }}"

    - name: Report source status
      ansible.builtin.debug:
        msg: >-
          Cloud inventory Script source ID: {{ _src_id }}
          ({{ 'pre-existing' if _src_exists else ('created' if _src_ok else 'FAILED — check project ID and inventory ID') }})

    # ── prose-03: Trigger inventory sync ─────────────────────────────────────
    - name: Trigger inventory sync for "Cloud inventory Script"
      ansible.builtin.uri:
        url: "{{ _api }}/inventory_sources/{{ _src_id }}/update/"
        method: POST
        url_username: "{{ _controller_user }}"
        url_password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [202]
        return_content: true
      register: r_sync_trigger
      ignore_errors: true
      when: _src_id | string | length > 0

    - name: Set sync job ID fact
      ansible.builtin.set_fact:
        _sync_job_id: "{{ r_sync_trigger.json.id | default('') }}"
      when:
        - r_sync_trigger is not skipped
        - r_sync_trigger is not failed

    - name: Default sync job ID when trigger skipped
      ansible.builtin.set_fact:
        _sync_job_id: ''
      when: _sync_job_id is not defined

    - name: Report sync trigger result
      ansible.builtin.debug:
        msg: "Inventory sync triggered — job ID: {{ _sync_job_id | default('N/A') }}"

    # ── prose-03: Poll until sync completes (up to 3 min: 18 x 10 s) ────────
    - name: Wait for inventory sync to complete
      ansible.builtin.uri:
        url: "{{ _api }}/inventory_updates/{{ _sync_job_id }}/"
        method: GET
        url_username: "{{ _controller_user }}"
        url_password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 15
        status_code: [200]
        return_content: true
      register: r_sync_status
      ignore_errors: true
      until: r_sync_status.json.status | default('') in ['successful', 'failed', 'error', 'canceled']
      retries: 18
      delay: 10
      when: _sync_job_id | string | length > 0

    - name: Set sync final status fact
      ansible.builtin.set_fact:
        _sync_final_status: "{{ r_sync_status.json.status | default('unknown') }}"
        _sync_ok: "{{ (r_sync_status.json.status | default('')) == 'successful' }}"
      when: r_sync_status is not skipped

    - name: Default sync status when not triggered
      ansible.builtin.set_fact:
        _sync_final_status: "skipped"
        _sync_ok: false
      when: _sync_final_status is not defined

    - name: Report sync result
      ansible.builtin.debug:
        msg: >-
          Inventory sync final status: {{ _sync_final_status }}
          {%- if _sync_ok %} — SUCCESS{%- endif %}
          {%- if _sync_final_status in ['failed', 'error', 'canceled'] %} — check AAP UI for details{%- endif %}

    # ── prose-04: Verify >= 7 hosts in "Cloud inventory" after sync ───────────
    - name: Get host count in "Cloud inventory"
      ansible.builtin.uri:
        url: "{{ _api }}/inventories/{{ _inv_id }}/hosts/?page_size=1"
        method: GET
        url_username: "{{ _controller_user }}"
        url_password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_hosts
      ignore_errors: true
      when:
        - _inv_id | string | length > 0
        - _sync_ok | bool

    - name: Set host count fact
      ansible.builtin.set_fact:
        _host_count: "{{ r_hosts.json.count | default(0) | int }}"
        _hosts_ok: "{{ (r_hosts.json.count | default(0) | int) >= 7 }}"
      when: r_hosts is not skipped

    - name: Default host count when sync skipped or failed
      ansible.builtin.set_fact:
        _host_count: 0
        _hosts_ok: false
      when: r_hosts is skipped or r_hosts is not defined

    - name: Report host count in Cloud inventory
      ansible.builtin.debug:
        msg: >-
          Cloud inventory host count: {{ _host_count }}
          (>= 7 required): {{ 'ok' if _hosts_ok else 'NOT ok' }}

    # ── Final report ──────────────────────────────────────────────────────────
    - name: Report module 05 solve status
      ansible.builtin.debug:
        msg: |
          Gitea inventory_list HTTP 200:               {{ 'ok' if (_gitea_ok | default(false)) else 'NOT ok' }}
          Gitea response contains "dyngroup":          {{ 'ok' if (_gitea_has_dyngroup | default(false)) else 'NOT ok' }}
          dyninv.sh written to bastion (mode 0755):    ok (copy module used; check Play 2 tasks)
          dyninv.sh --list contains "dyngroup":        check Play 2 debug output
          Cloud inventory exists in AAP:               {{ 'ok' if (_inv_ok | default(false)) else 'NOT ok' }}
          Cloud inventory Script source exists:        {{ 'ok' if (_src_ok | default(false)) else 'NOT ok' }}
          Inventory sync status:                       {{ _sync_final_status | default('skipped') }}
          Cloud inventory host count (>= 7):           {{ 'ok' if (_hosts_ok | default(false)) else 'NOT ok — count=' ~ (_host_count | default(0)) }}
