---
# Module 05 Validate — Dynamic Inventories
#
# Checks:
#   Task 1: /home/lab-user/dyninv.sh exists on bastion, mode 0755
#   Task 2: dyninv.sh --list returns valid JSON containing "dyngroup"
#   Task 3: Gitea inventory_list URL returns HTTP 200
#   Task 4: AAP inventory "Cloud inventory" exists in org Default
#   Task 5: AAP inventory source "Cloud inventory Script" exists
#           (source=scm, update_on_launch=true, update_cache_timeout=300)
#   Task 6: At least one inventory sync for "Cloud inventory Script" has status=successful
#   Task 7: "Cloud inventory" has at least 7 hosts after sync
#
# Variable resolution: all via lookup('ansible.builtin.env', 'VAR_NAME')
# API base: /api/controller/v2/  (AAP 2.5)

# =============================================================================
# Play 1 — Build bastion in-memory inventory
# =============================================================================
- name: Module 05 Validate — build bastion inventory
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    student_user: "{{ lookup('ansible.builtin.env', 'SSH_USERNAME') | default('lab-user') }}"
    bastion_host: "{{ lookup('ansible.builtin.env', 'SSH_HOST') }}"
    bastion_port: "{{ lookup('ansible.builtin.env', 'SSH_PORT') | default(22) }}"
    bastion_user: "{{ lookup('ansible.builtin.env', 'SSH_USERNAME') | default('lab-user') }}"
    bastion_password: "{{ lookup('ansible.builtin.env', 'SSH_PASSWORD') }}"
  tasks:

    - name: Add bastion to in-memory inventory
      ansible.builtin.add_host:
        name: bastion
        groups: bastion
        ansible_host: "{{ bastion_host }}"
        ansible_port: "{{ bastion_port }}"
        ansible_user: "{{ bastion_user }}"
        ansible_password: "{{ bastion_password }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      when: bastion_host | length > 0

# =============================================================================
# Play 2 — Bastion checks (Tasks 1, 2, 3)
# =============================================================================
- name: Module 05 Validate — bastion checks
  hosts: bastion
  gather_facts: false
  vars:
    bastion_user: "{{ lookup('ansible.builtin.env', 'SSH_USERNAME') | default('lab-user') }}"
    gitea_url: "{{ lookup('ansible.builtin.env', 'GITEA_URL') | default('') }}"
    gitea_username: "{{ lookup('ansible.builtin.env', 'GITEA_USERNAME') | default('lab-user') }}"
    _script_path: "/home/{{ bastion_user }}/dyninv.sh"
    _check_script: "/tmp/dyninv_check.py"
    _gitea_repo: "playbooks-adv-controller"
    _inventory_list_url: >-
      {{ gitea_url | regex_replace('/+$', '') }}/{{ gitea_username }}/{{ _gitea_repo }}/raw/branch/main/constructed-inventory/inventory_list

  tasks:

    # -------------------------------------------------------
    # Check 1 — dyninv.sh exists and is executable (mode 0755)
    # -------------------------------------------------------
    - name: Stat dyninv.sh on bastion
      ansible.builtin.command:
        cmd: "sh -c 'test -x {{ _script_path }} && stat -c %a {{ _script_path }}'"
      register: r_stat
      changed_when: false
      ignore_errors: true

    - name: Set task-1 fact
      ansible.builtin.set_fact:
        _task1_ok: "{{ r_stat.rc | default(1) | int == 0 and '755' in (r_stat.stdout | default('')) }}"

    - name: Debug task-1
      ansible.builtin.debug:
        msg: "Task 1 — dyninv.sh exists mode 0755: {{ _task1_ok }}"

    # -------------------------------------------------------
    # Check 2 — dyninv.sh --list returns JSON with "dyngroup"
    # -------------------------------------------------------
    - name: Write dyninv JSON check helper to bastion
      ansible.builtin.copy:
        dest: "{{ _check_script }}"
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          import json, sys
          d = json.load(sys.stdin)
          has_dyngroup = 'dyngroup' in d
          print('DYNGROUP:' + str(has_dyngroup))
      when: _task1_ok | bool

    - name: Run dyninv.sh --list and verify dyngroup key
      ansible.builtin.shell:
        cmd: "{{ _script_path }} --list | python3 {{ _check_script }}"
      register: r_json
      changed_when: false
      ignore_errors: true
      when: _task1_ok | bool

    - name: Set task-2 fact
      ansible.builtin.set_fact:
        _task2_ok: >-
          {{
            r_json is defined
            and r_json is not skipped
            and r_json.rc | default(1) | int == 0
            and 'DYNGROUP:True' in (r_json.stdout | default(''))
          }}

    - name: Default task-2 when script was not run
      ansible.builtin.set_fact:
        _task2_ok: false
      when: not (_task1_ok | bool)

    - name: Debug task-2
      ansible.builtin.debug:
        msg: "Task 2 — dyninv.sh --list contains dyngroup: {{ _task2_ok }} (output: {{ r_json.stdout | default('skipped') }})"

    # -------------------------------------------------------
    # Check 3 — Gitea inventory_list URL returns HTTP 200
    # -------------------------------------------------------
    - name: Check Gitea inventory_list URL from bastion
      ansible.builtin.command:
        cmd: "sh -c 'curl -s -o /dev/null -w \"%{http_code}\" {{ _inventory_list_url }}'"
      register: r_gitea
      changed_when: false
      ignore_errors: true

    - name: Set task-3 fact
      ansible.builtin.set_fact:
        _task3_ok: "{{ '200' in (r_gitea.stdout | default('')) }}"

    - name: Debug task-3
      ansible.builtin.debug:
        msg: "Task 3 — Gitea inventory_list HTTP 200: {{ _task3_ok }} (got {{ r_gitea.stdout | default('no response') }})"

    # -------------------------------------------------------
    # Persist bastion results to hostvars for Play 3
    # -------------------------------------------------------
    - name: Persist bastion check results
      ansible.builtin.set_fact:
        bastion_task1_ok: "{{ _task1_ok | bool }}"
        bastion_task2_ok: "{{ _task2_ok | bool }}"
        bastion_task3_ok: "{{ _task3_ok | bool }}"

# =============================================================================
# Play 3 — AAP REST checks (Tasks 4–7) and final validation_check
# =============================================================================
- name: Module 05 Validate — AAP checks and final result
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    student_user: "{{ lookup('ansible.builtin.env', 'SSH_USERNAME') | default('lab-user') }}"
    controller_url: "{{ lookup('ansible.builtin.env', 'CONTROLLER_URL') }}"
    controller_username: "{{ lookup('ansible.builtin.env', 'CONTROLLER_USERNAME') }}"
    controller_password: "{{ lookup('ansible.builtin.env', 'CONTROLLER_PASSWORD') }}"
    bastion_user: "{{ lookup('ansible.builtin.env', 'SSH_USERNAME') | default('lab-user') }}"
    _api: "{{ controller_url | regex_replace('/+$', '') }}/api/controller/v2"

  tasks:

    # Pull bastion facts via hostvars
    - name: Pull bastion check results into localhost
      ansible.builtin.set_fact:
        _task1_ok: "{{ hostvars['bastion']['bastion_task1_ok'] | default(false) | bool }}"
        _task2_ok: "{{ hostvars['bastion']['bastion_task2_ok'] | default(false) | bool }}"
        _task3_ok: "{{ hostvars['bastion']['bastion_task3_ok'] | default(false) | bool }}"

    # -------------------------------------------------------
    # Check 4 — "Cloud inventory" exists in AAP org Default
    # -------------------------------------------------------
    - name: Query AAP for "Cloud inventory"
      ansible.builtin.uri:
        url: "{{ _api }}/inventories/?name=Cloud+inventory&organization__name=Default"
        method: GET
        url_username: "{{ controller_username }}"
        url_password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_inv
      ignore_errors: true

    - name: Set task-4 fact and inventory ID
      ansible.builtin.set_fact:
        _task4_ok: "{{ (r_inv.json.count | default(0)) | int > 0 }}"
        _inv_id: "{{ (r_inv.json.results | default([]) | map(attribute='id') | list | first) | default('') }}"

    - name: Debug task-4
      ansible.builtin.debug:
        msg: "Task 4 — Cloud inventory exists (ID={{ _inv_id }}): {{ _task4_ok }}"

    # -------------------------------------------------------
    # Check 5 — "Cloud inventory Script" source: scm, update_on_launch, cache=300
    # -------------------------------------------------------
    - name: Query AAP for "Cloud inventory Script" source
      ansible.builtin.uri:
        url: "{{ _api }}/inventory_sources/?name=Cloud+inventory+Script&inventory={{ _inv_id }}"
        method: GET
        url_username: "{{ controller_username }}"
        url_password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_src
      ignore_errors: true
      when: _task4_ok | bool and _inv_id | string | length > 0

    - name: Set task-5 fact and source ID
      ansible.builtin.set_fact:
        _task5_ok: >-
          {{
            r_src is not skipped
            and (r_src.json.count | default(0)) | int > 0
            and (r_src.json.results | default([])
                  | selectattr('source', 'equalto', 'scm') | list | length) > 0
            and (r_src.json.results | default([])
                  | selectattr('update_on_launch', 'equalto', true) | list | length) > 0
            and (r_src.json.results | default([])
                  | map(attribute='update_cache_timeout') | list | first | default(0)) | int == 300
          }}
        _src_id: "{{ (r_src.json.results | default([]) | map(attribute='id') | list | first) | default('') }}"
      when: r_src is defined and r_src is not skipped

    - name: Default task-5 facts when skipped
      ansible.builtin.set_fact:
        _task5_ok: false
        _src_id: ''
      when: r_src is not defined or r_src is skipped

    - name: Debug task-5
      ansible.builtin.debug:
        msg: "Task 5 — Cloud inventory Script source (scm, update_on_launch, cache=300): {{ _task5_ok }} (ID={{ _src_id }})"

    # -------------------------------------------------------
    # Check 6 — At least one sync for "Cloud inventory Script" is successful
    # -------------------------------------------------------
    - name: Query AAP for inventory update jobs on "Cloud inventory Script"
      ansible.builtin.uri:
        url: "{{ _api }}/inventory_updates/?inventory_source={{ _src_id }}&order_by=-finished&page_size=10"
        method: GET
        url_username: "{{ controller_username }}"
        url_password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_syncs
      ignore_errors: true
      when: _src_id | string | length > 0

    - name: Set task-6 facts
      ansible.builtin.set_fact:
        _task6_ok: >-
          {{
            r_syncs is defined
            and r_syncs is not skipped
            and (r_syncs.json.results | default([])
                  | selectattr('status', 'equalto', 'successful') | list | length) > 0
          }}
        _sync_running: >-
          {{
            r_syncs is defined
            and r_syncs is not skipped
            and (r_syncs.json.results | default([])
                  | selectattr('status', 'in', ['pending', 'waiting', 'running']) | list | length) > 0
            and (r_syncs.json.results | default([])
                  | selectattr('status', 'equalto', 'successful') | list | length) == 0
          }}
      when: r_syncs is defined and r_syncs is not skipped

    - name: Default task-6 facts when skipped
      ansible.builtin.set_fact:
        _task6_ok: false
        _sync_running: false
      when: r_syncs is not defined or r_syncs is skipped

    - name: Debug task-6
      ansible.builtin.debug:
        msg: "Task 6 — Inventory sync successful: {{ _task6_ok }} (still running: {{ _sync_running }})"

    # -------------------------------------------------------
    # Check 7 — "Cloud inventory" has at least 7 hosts
    # -------------------------------------------------------
    - name: Query AAP for host count in "Cloud inventory"
      ansible.builtin.uri:
        url: "{{ _api }}/hosts/?inventory={{ _inv_id }}&page_size=1"
        method: GET
        url_username: "{{ controller_username }}"
        url_password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_hosts
      ignore_errors: true
      when: _task4_ok | bool and _inv_id | string | length > 0

    - name: Set task-7 fact
      ansible.builtin.set_fact:
        _task7_ok: "{{ (r_hosts.json.count | default(0)) | int >= 7 }}"
        _host_count: "{{ r_hosts.json.count | default(0) }}"
      when: r_hosts is defined and r_hosts is not skipped

    - name: Default task-7 facts when skipped
      ansible.builtin.set_fact:
        _task7_ok: false
        _host_count: 0
      when: r_hosts is not defined or r_hosts is skipped

    - name: Debug task-7
      ansible.builtin.debug:
        msg: "Task 7 — Cloud inventory hosts: {{ _host_count }} (need >= 7): {{ _task7_ok }}"

    # -------------------------------------------------------
    # Build results and final validation_check
    # -------------------------------------------------------
    - name: Build task results
      ansible.builtin.set_fact:
        _all_ok: >-
          {{
            (_task1_ok | bool)
            and (_task2_ok | bool)
            and (_task3_ok | bool)
            and (_task4_ok | bool)
            and (_task5_ok | bool)
            and (_task6_ok | bool)
            and (_task7_ok | bool)
          }}

    - name: Validate all tasks — module 05 Dynamic Inventories
      rhpds.ftl.validation_check:
        check: "{{ _all_ok }}"
        pass_msg: |
          Task 1: dyninv.sh exists at /home/{{ bastion_user }}/dyninv.sh and is executable (mode 0755)
          Task 2: dyninv.sh --list returns valid JSON containing "dyngroup"
          Task 3: Gitea inventory_list URL is reachable (HTTP 200)
          Task 4: AAP inventory "Cloud inventory" exists in org Default
          Task 5: AAP inventory source "Cloud inventory Script" exists (scm, update_on_launch=true, cache=300)
          Task 6: At least one inventory sync completed successfully
          Task 7: "Cloud inventory" has {{ _host_count }} hosts (>= 7 required)
        error_msg: |
          {{ '✅' if (_task1_ok | bool) else '❌' }} Task 1: {{ 'dyninv.sh exists at /home/' + bastion_user + '/dyninv.sh (mode 0755)' if (_task1_ok | bool) else 'FAILED — /home/' + bastion_user + '/dyninv.sh is missing or not executable. Run Solve or create the file manually and run chmod 755.' }}
          {{ '✅' if (_task2_ok | bool) else '❌' }} Task 2: {{ 'dyninv.sh --list returns JSON with dyngroup key' if (_task2_ok | bool) else 'FAILED — dyninv.sh --list output missing "dyngroup" key. Verify the Gitea URL inside the script and run it manually: ./dyninv.sh --list | python3 -m json.tool' }}
          {{ '✅' if (_task3_ok | bool) else '❌' }} Task 3: {{ 'Gitea inventory_list URL returned HTTP 200' if (_task3_ok | bool) else 'FAILED — Gitea raw URL for inventory_list returned non-200. Confirm the Lab Project Repo is accessible and the branch/path is correct.' }}
          {{ '✅' if (_task4_ok | bool) else '❌' }} Task 4: {{ '"Cloud inventory" exists in AAP org Default' if (_task4_ok | bool) else 'FAILED — "Cloud inventory" not found. Create it under Automation Execution > Infrastructure > Inventories.' }}
          {{ '✅' if (_task5_ok | bool) else '❌' }} Task 5: {{ '"Cloud inventory Script" source exists (scm, update_on_launch=true, cache=300)' if (_task5_ok | bool) else 'FAILED — Source missing or misconfigured. Set Source=Project, Project=Lab Project Repo, Path=constructed-inventory/inventory-script, Update on launch=true, Cache=300.' }}
          {{ '✅' if (_task6_ok | bool) else '❌' }} Task 6: {{ 'Inventory sync completed successfully' if (_task6_ok | bool) else ('Sync still in progress — click Validate again in a minute.' if (_sync_running | bool) else 'FAILED — No successful sync found. Trigger a sync from the Sources tab of Cloud inventory and wait for it to complete.') }}
          {{ '✅' if (_task7_ok | bool) else '❌' }} Task 7: {{ '"Cloud inventory" has ' + (_host_count | string) + ' hosts (>= 7)' if (_task7_ok | bool) else 'FAILED — Only ' + (_host_count | string) + ' hosts found (need >= 7). Ensure the sync completed and inventory_list in Gitea contains all cloud hosts.' }}
