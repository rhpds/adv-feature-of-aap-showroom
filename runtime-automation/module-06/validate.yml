---
# Module 06 Validate — Constructed Inventory
#
# Checks (all via AAP REST API from localhost — no bastion needed):
#   Task 1:  "Constructed Inventory" exists in AAP with kind=constructed in org Default
#   Task 2:  Cloud inventory AND Lab inventory are attached as input inventories
#   Task 3:  Auto-created inventory source has source_vars containing compose,
#             groups, and keyed_groups keys (block-04 final state)
#   Task 4:  At least one inventory sync completed with status=successful
#   Task 5:  Group "dyngroup" is present in Constructed Inventory
#   Task 6:  Groups "production" and "development" are present
#   Task 7:  Hosts in "production" all contain "prod" in name;
#             hosts in "development" all contain "dev" in name
#   Task 8:  CLOUD3.cloud.example.com has ansible_host=cloud3.cloud.example.com
#             (compose: ansible_host: inventory_hostname | lower() applied)
#   Task 9:  An architecture keyed_group (x86_64, arm, aarch64, etc.) is present
#   Task 10: At least one group with prefix "server_type_" is present
#
# Credentials: env vars via lookup('ansible.builtin.env', ...)
# API base:    /api/controller/v2/  (AAP 2.5 unified gateway — NOT /api/v2/)
# Module:      validation_check  (FQCN required)

- name: Module 06 Validation — Constructed Inventory
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_connection: local
    ansible_host: 127.0.0.1
    _api: "{{ lookup('ansible.builtin.env', 'CONTROLLER_URL') }}/api/controller/v2"
    _aap_user: "{{ lookup('ansible.builtin.env', 'CONTROLLER_USERNAME') }}"
    _aap_pass: "{{ lookup('ansible.builtin.env', 'CONTROLLER_PASSWORD') }}"

  tasks:

    # -------------------------------------------------------
    # Prereq — resolve Default org ID
    # -------------------------------------------------------
    - name: Prereq — Get Default organisation ID
      ansible.builtin.uri:
        url: "{{ _api }}/organizations/?name=Default"
        method: GET
        url_username: "{{ _aap_user }}"
        url_password: "{{ _aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_org
      ignore_errors: true

    - name: Set org_id fact
      ansible.builtin.set_fact:
        _org_id: "{{ r_org.json.results[0].id | default(0) | int }}"

    # -------------------------------------------------------
    # Check 1 — "Constructed Inventory" exists with kind=constructed
    # -------------------------------------------------------
    - name: Check 1 — Query Constructed Inventory
      ansible.builtin.uri:
        url: "{{ _api }}/inventories/?name=Constructed+Inventory&kind=constructed&organization={{ _org_id }}"
        method: GET
        url_username: "{{ _aap_user }}"
        url_password: "{{ _aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_constructed
      ignore_errors: true

    - name: Set constructed inventory facts
      ansible.builtin.set_fact:
        _constructed_inv_id: "{{ r_constructed.json.results[0].id | default(0) | int }}"
        _task1_ok: "{{ r_constructed.json.count | default(0) | int > 0 }}"

    # -------------------------------------------------------
    # Check 2 — Cloud inventory + Lab inventory are input inventories
    # -------------------------------------------------------
    - name: Check 2 — Query input inventories for Constructed Inventory
      ansible.builtin.uri:
        url: "{{ _api }}/inventories/{{ _constructed_inv_id }}/input_inventories/?page_size=100"
        method: GET
        url_username: "{{ _aap_user }}"
        url_password: "{{ _aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_input_invs
      ignore_errors: true
      when: _task1_ok | bool

    - name: Set input inventory facts
      ansible.builtin.set_fact:
        _input_inv_names: "{{ r_input_invs.json.results | default([]) | map(attribute='name') | list }}"
        _task2_ok: >-
          {{
            r_input_invs is defined
            and r_input_invs is not skipped
            and r_input_invs is not failed
            and 'Cloud inventory' in (r_input_invs.json.results | default([]) | map(attribute='name') | list)
            and 'Lab inventory' in (r_input_invs.json.results | default([]) | map(attribute='name') | list)
          }}
      when: _task1_ok | bool

    - name: Default task-2 facts when task-1 failed
      ansible.builtin.set_fact:
        _input_inv_names: []
        _task2_ok: false
      when: not (_task1_ok | bool)

    # -------------------------------------------------------
    # Check 3 — source_vars contain compose + groups + keyed_groups
    # -------------------------------------------------------
    - name: Check 3a — Get auto-created inventory source
      ansible.builtin.uri:
        url: "{{ _api }}/inventories/{{ _constructed_inv_id }}/inventory_sources/?page_size=10"
        method: GET
        url_username: "{{ _aap_user }}"
        url_password: "{{ _aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_inv_sources
      ignore_errors: true
      when: _task1_ok | bool

    - name: Set inventory source ID fact
      ansible.builtin.set_fact:
        _constructed_src_id: "{{ r_inv_sources.json.results[0].id | default(0) | int }}"
      when:
        - _task1_ok | bool
        - r_inv_sources is not skipped
        - r_inv_sources.json is defined
        - r_inv_sources.json.results | default([]) | length > 0

    - name: Default source ID when inventory missing
      ansible.builtin.set_fact:
        _constructed_src_id: 0
      when: >-
        not (_task1_ok | bool)
        or r_inv_sources is skipped
        or r_inv_sources is failed
        or r_inv_sources.json.results | default([]) | length == 0

    - name: Check 3b — Get inventory source detail for source_vars
      ansible.builtin.uri:
        url: "{{ _api }}/inventory_sources/{{ _constructed_src_id }}/"
        method: GET
        url_username: "{{ _aap_user }}"
        url_password: "{{ _aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_src_detail
      ignore_errors: true
      when: _constructed_src_id | int > 0

    - name: Set task-3 fact — source_vars must contain compose, groups, keyed_groups
      ansible.builtin.set_fact:
        _task3_ok: >-
          {{
            r_src_detail is defined
            and r_src_detail is not skipped
            and r_src_detail is not failed
            and 'compose' in (r_src_detail.json.source_vars | default(''))
            and 'groups' in (r_src_detail.json.source_vars | default(''))
            and 'keyed_groups' in (r_src_detail.json.source_vars | default(''))
          }}
      when: _constructed_src_id | int > 0

    - name: Default task-3 when source not found
      ansible.builtin.set_fact:
        _task3_ok: false
      when: _constructed_src_id | int == 0

    # -------------------------------------------------------
    # Check 4 — At least one sync completed with status=successful
    # -------------------------------------------------------
    - name: Check 4 — Query inventory update jobs for Constructed Inventory source
      ansible.builtin.uri:
        url: "{{ _api }}/inventory_updates/?inventory_source={{ _constructed_src_id }}&order_by=-finished&page_size=10"
        method: GET
        url_username: "{{ _aap_user }}"
        url_password: "{{ _aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_syncs
      ignore_errors: true
      when: _constructed_src_id | int > 0

    - name: Set task-4 facts — successful sync and still-running flag
      ansible.builtin.set_fact:
        _task4_ok: >-
          {{
            r_syncs is defined
            and r_syncs is not skipped
            and (r_syncs.json.results | default([])
                  | selectattr('status', 'equalto', 'successful') | list | length) > 0
          }}
        _sync_running: >-
          {{
            r_syncs is defined
            and r_syncs is not skipped
            and (r_syncs.json.results | default([])
                  | selectattr('status', 'in', ['pending', 'waiting', 'running']) | list | length) > 0
            and (r_syncs.json.results | default([])
                  | selectattr('status', 'equalto', 'successful') | list | length) == 0
          }}
      when: r_syncs is defined and r_syncs is not skipped

    - name: Default task-4 facts when source not queried
      ansible.builtin.set_fact:
        _task4_ok: false
        _sync_running: false
      when: r_syncs is not defined or r_syncs is skipped

    # -------------------------------------------------------
    # Checks 5, 6, 9, 10 — Group presence checks
    # Single API call fetches all group names for all four checks
    # -------------------------------------------------------
    - name: Checks 5,6,9,10 — Query all groups in Constructed Inventory
      ansible.builtin.uri:
        url: "{{ _api }}/inventories/{{ _constructed_inv_id }}/groups/?page_size=200"
        method: GET
        url_username: "{{ _aap_user }}"
        url_password: "{{ _aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_groups
      ignore_errors: true
      when: _task1_ok | bool

    - name: Set group name list
      ansible.builtin.set_fact:
        _group_names: "{{ r_groups.json.results | default([]) | map(attribute='name') | list }}"
      when:
        - _task1_ok | bool
        - r_groups is not skipped
        - r_groups is not failed

    - name: Default group names when inventory missing
      ansible.builtin.set_fact:
        _group_names: []
      when: not (_task1_ok | bool) or r_groups is skipped or r_groups is failed

    - name: Set group-based task facts
      ansible.builtin.set_fact:
        _task5_ok: "{{ 'dyngroup' in _group_names }}"
        _task6_ok: "{{ 'production' in _group_names and 'development' in _group_names }}"
        _task9_ok: >-
          {{
            _group_names | select('match', '^(x86_64|arm|aarch64|arm64|ARM|ppc64|s390x|i386)$') | list | length > 0
          }}
        _task10_ok: >-
          {{
            _group_names | select('match', '^server_type_') | list | length > 0
          }}

    # -------------------------------------------------------
    # Check 7 — Host-to-group placement:
    #   production hosts all contain "prod" in name
    #   development hosts all contain "dev" in name
    # -------------------------------------------------------
    - name: Check 7a — Resolve production group ID
      ansible.builtin.uri:
        url: "{{ _api }}/groups/?name=production&inventory={{ _constructed_inv_id }}"
        method: GET
        url_username: "{{ _aap_user }}"
        url_password: "{{ _aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_prod_group
      ignore_errors: true
      when: _task6_ok | bool

    - name: Set production group ID
      ansible.builtin.set_fact:
        _prod_group_id: "{{ r_prod_group.json.results[0].id | default(0) | int }}"
      when: _task6_ok | bool and r_prod_group is not skipped and r_prod_group is not failed

    - name: Default production group ID
      ansible.builtin.set_fact:
        _prod_group_id: 0
      when: not (_task6_ok | bool)

    - name: Check 7a — Query hosts in production group
      ansible.builtin.uri:
        url: "{{ _api }}/groups/{{ _prod_group_id }}/hosts/?page_size=100"
        method: GET
        url_username: "{{ _aap_user }}"
        url_password: "{{ _aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_prod_hosts
      ignore_errors: true
      when: _prod_group_id | int > 0

    - name: Check 7b — Resolve development group ID
      ansible.builtin.uri:
        url: "{{ _api }}/groups/?name=development&inventory={{ _constructed_inv_id }}"
        method: GET
        url_username: "{{ _aap_user }}"
        url_password: "{{ _aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_dev_group
      ignore_errors: true
      when: _task6_ok | bool

    - name: Set development group ID
      ansible.builtin.set_fact:
        _dev_group_id: "{{ r_dev_group.json.results[0].id | default(0) | int }}"
      when: _task6_ok | bool and r_dev_group is not skipped and r_dev_group is not failed

    - name: Default development group ID
      ansible.builtin.set_fact:
        _dev_group_id: 0
      when: not (_task6_ok | bool)

    - name: Check 7b — Query hosts in development group
      ansible.builtin.uri:
        url: "{{ _api }}/groups/{{ _dev_group_id }}/hosts/?page_size=100"
        method: GET
        url_username: "{{ _aap_user }}"
        url_password: "{{ _aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_dev_hosts
      ignore_errors: true
      when: _dev_group_id | int > 0

    - name: Set task-7 fact — production hosts contain "prod", development hosts contain "dev"
      ansible.builtin.set_fact:
        _task7_ok: >-
          {{
            r_prod_hosts is defined
            and r_prod_hosts is not skipped
            and r_prod_hosts is not failed
            and (r_prod_hosts.json.results | default([]) | length) > 0
            and (r_prod_hosts.json.results | default([])
                  | map(attribute='name') | select('search', 'prod') | list | length)
                == (r_prod_hosts.json.results | default([]) | length)
            and r_dev_hosts is defined
            and r_dev_hosts is not skipped
            and r_dev_hosts is not failed
            and (r_dev_hosts.json.results | default([]) | length) > 0
            and (r_dev_hosts.json.results | default([])
                  | map(attribute='name') | select('search', 'dev') | list | length)
                == (r_dev_hosts.json.results | default([]) | length)
          }}
      when: _task6_ok | bool

    - name: Default task-7 when groups not present
      ansible.builtin.set_fact:
        _task7_ok: false
      when: not (_task6_ok | bool)

    # -------------------------------------------------------
    # Check 8 — CLOUD3.cloud.example.com has ansible_host = lowercase value
    # compose: ansible_host: inventory_hostname | lower()
    # Expected: cloud3.cloud.example.com
    # Parse variables JSON inside the condition — use from_json, not from_yaml
    # to avoid extra content in stdout parse errors.
    # -------------------------------------------------------
    - name: Check 8 — Query CLOUD3.cloud.example.com in Constructed Inventory
      ansible.builtin.uri:
        url: "{{ _api }}/hosts/?name=CLOUD3.cloud.example.com&inventory={{ _constructed_inv_id }}"
        method: GET
        url_username: "{{ _aap_user }}"
        url_password: "{{ _aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_cloud3
      ignore_errors: true
      when: _task1_ok | bool

    - name: Set task-8 fact — CLOUD3 ansible_host is lowercase
      ansible.builtin.set_fact:
        _task8_ok: >-
          {{
            r_cloud3 is defined
            and r_cloud3 is not skipped
            and r_cloud3 is not failed
            and (r_cloud3.json.count | default(0) | int) > 0
            and (r_cloud3.json.results[0].variables | default('{}') | from_json)
                .get('ansible_host', '') == 'cloud3.cloud.example.com'
          }}
      when: _task1_ok | bool

    - name: Default task-8 when inventory missing
      ansible.builtin.set_fact:
        _task8_ok: false
      when: not (_task1_ok | bool)

    # -------------------------------------------------------
    # Build overall pass/fail flag
    # -------------------------------------------------------
    - name: Build overall pass/fail flag
      ansible.builtin.set_fact:
        _all_ok: >-
          {{
            (_task1_ok | bool)
            and (_task2_ok | bool)
            and (_task3_ok | bool)
            and (_task4_ok | bool)
            and (_task5_ok | bool)
            and (_task6_ok | bool)
            and (_task7_ok | bool)
            and (_task8_ok | bool)
            and (_task9_ok | bool)
            and (_task10_ok | bool)
          }}

    # -------------------------------------------------------
    # Final validation_check
    # -------------------------------------------------------
    - name: Validate module 06 — Constructed Inventory
      validation_check:
        check: "{{ _all_ok }}"
        pass_msg: |
          Task 1:  "Constructed Inventory" exists in AAP (kind=constructed, org=Default)
          Task 2:  Cloud inventory and Lab inventory are both attached as input inventories
          Task 3:  Inventory source source_vars contain compose, groups, and keyed_groups (block-04 final state)
          Task 4:  Inventory sync completed successfully
          Task 5:  Group "dyngroup" is present in Constructed Inventory
          Task 6:  Groups "production" and "development" are present
          Task 7:  Hosts in "production" all contain "prod"; hosts in "development" all contain "dev"
          Task 8:  CLOUD3.cloud.example.com has ansible_host=cloud3.cloud.example.com (compose lowercase applied)
          Task 9:  Architecture keyed_group (x86_64/arm/aarch64) is present
          Task 10: At least one "server_type_" prefixed keyed_group is present
        error_msg: |
          {{ '  Task 1:  ok — "Constructed Inventory" exists with kind=constructed' if (_task1_ok | bool) else '  Task 1:  FAILED — "Constructed Inventory" not found. Create it under Automation Execution > Infrastructure > Inventories > Add > Constructed Inventory in org Default, or run Solve.' }}
          {{ '  Task 2:  ok — Cloud inventory and Lab inventory attached as input inventories' if (_task2_ok | bool) else '  Task 2:  FAILED — Input inventories missing (found: ' + (_input_inv_names | join(', ') | default('none')) + '). Open Constructed Inventory and add both "Cloud inventory" and "Lab inventory" as input inventories.' }}
          {{ '  Task 3:  ok — source_vars contain compose, groups, and keyed_groups' if (_task3_ok | bool) else '  Task 3:  FAILED — Inventory source source_vars missing one or more of: compose, groups, keyed_groups. Open the auto-created source inside Constructed Inventory, paste the final block-04 YAML, and save.' }}
          {{ '  Task 4:  ok — Inventory sync completed successfully' if (_task4_ok | bool) else ('  Task 4:  Sync still running — wait a moment and click Validate again.' if (_sync_running | bool) else '  Task 4:  FAILED — No successful sync found. Open Constructed Inventory > Sources, select the source, and click Sync.') }}
          {{ '  Task 5:  ok — Group "dyngroup" present' if (_task5_ok | bool) else '  Task 5:  FAILED — Group "dyngroup" not found. Confirm Cloud inventory (input inventory) contains a dyngroup group, then re-sync.' }}
          {{ '  Task 6:  ok — Groups "production" and "development" present' if (_task6_ok | bool) else '  Task 6:  FAILED — "production" or "development" group missing. Verify the groups: block uses inventory_hostname is search("prod") and inventory_hostname is search("dev") in source_vars, then re-sync.' }}
          {{ '  Task 7:  ok — Hosts correctly placed in production/development groups' if (_task7_ok | bool) else '  Task 7:  FAILED — Host-to-group placement incorrect. Check that the groups: search expressions match the actual host names in the input inventories, then re-sync.' }}
          {{ '  Task 8:  ok — CLOUD3 has ansible_host=cloud3.cloud.example.com (lowercase)' if (_task8_ok | bool) else '  Task 8:  FAILED — CLOUD3 ansible_host not set to lowercase. Verify compose: contains ansible_host: inventory_hostname | lower() in source_vars, then re-sync.' }}
          {{ '  Task 9:  ok — Architecture keyed_group present' if (_task9_ok | bool) else '  Task 9:  FAILED — No architecture keyed_group found. Ensure the keyed_groups: block has prefix: "" separator: "" key: architecture in source_vars, then re-sync.' }}
          {{ '  Task 10: ok — "server_type_" prefixed keyed_group present' if (_task10_ok | bool) else '  Task 10: FAILED — No "server_type_" group found. Ensure the keyed_groups: block has prefix: server_type separator: "_" key: type in source_vars, then re-sync.' }}
