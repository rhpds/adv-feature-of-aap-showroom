---
# Module 06 Solve — Constructed Inventory
#
# API base: /api/controller/v2/  (AAP 2.5 unified gateway — NOT /api/v2/)
#
# All credentials come from environment variables via lookup('ansible.builtin.env', ...).
# Constructed inventory source_vars go on the auto-created inventory SOURCE,
# not on the inventory object's variables field.
#
# Play 1: Build in-memory bastion group from env vars
# Play 2: Run prereq on bastion if Cloud/Lab inventories are missing
# Play 3: Create Constructed Inventory + attach input inventories + apply final
#         source_vars (block-04) to auto-created source + sync

# ---------------------------------------------------------------------------
# Play 1: Build bastion in-memory inventory
# ---------------------------------------------------------------------------
- name: Module 06 — Build bastion inventory
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_connection: local
    ansible_host: 127.0.0.1
    _ssh_host: "{{ lookup('ansible.builtin.env', 'SSH_HOSTNAME') }}"
    _ssh_port: "{{ lookup('ansible.builtin.env', 'SSH_PORT') | default('22', true) }}"
    _ssh_user: "{{ lookup('ansible.builtin.env', 'SSH_USERNAME') }}"
    _ssh_pass: "{{ lookup('ansible.builtin.env', 'SSH_PASSWORD') }}"
  tasks:
    - name: Add bastion to in-memory inventory
      ansible.builtin.add_host:
        name: bastion
        groups: bastion
        ansible_host: "{{ _ssh_host }}"
        ansible_port: "{{ _ssh_port | int }}"
        ansible_user: "{{ _ssh_user }}"
        ansible_password: "{{ _ssh_pass }}"
        ansible_ssh_private_key_file: "/app/.ssh/id_rsa"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      when: _ssh_host | length > 0

# ---------------------------------------------------------------------------
# Play 2: Prereq — run add-dyn-inventory.yml on bastion if inventories missing
# ---------------------------------------------------------------------------
- name: Module 06 — Run prereq playbook if dynamic inventories are missing
  hosts: bastion
  gather_facts: false
  vars:
    _controller_url: "{{ lookup('ansible.builtin.env', 'CONTROLLER_URL') }}"
    _aap_user: "{{ lookup('ansible.builtin.env', 'CONTROLLER_USERNAME') }}"
    _aap_pass: "{{ lookup('ansible.builtin.env', 'CONTROLLER_PASSWORD') }}"
    _api: "{{ lookup('ansible.builtin.env', 'CONTROLLER_URL') }}/api/controller/v2"
  tasks:
    - name: Check if Cloud inventory already exists in AAP
      ansible.builtin.uri:
        url: "{{ _api }}/inventories/?name=Cloud+inventory&organization__name=Default"
        method: GET
        url_username: "{{ _aap_user }}"
        url_password: "{{ _aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_cloud_inv_check
      ignore_errors: true
      delegate_to: localhost

    - name: Check if Lab inventory already exists in AAP
      ansible.builtin.uri:
        url: "{{ _api }}/inventories/?name=Lab+inventory&organization__name=Default"
        method: GET
        url_username: "{{ _aap_user }}"
        url_password: "{{ _aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_lab_inv_check
      ignore_errors: true
      delegate_to: localhost

    - name: Set prereq needed flag
      ansible.builtin.set_fact:
        prereq_needed: >-
          {{
            (r_cloud_inv_check.json.count | default(0) | int == 0) or
            (r_lab_inv_check.json.count | default(0) | int == 0)
          }}

    - name: Run add-dyn-inventory.yml prereq on bastion
      ansible.builtin.command:
        cmd: >-
          bash -c 'cd ~/playbooks-adv-controller &&
          ansible-navigator run add-dyn-inventory.yml --mode stdout --pull-policy missing'
      when: prereq_needed | bool
      register: r_prereq
      changed_when: true
      ignore_errors: true

    - name: Show prereq output
      ansible.builtin.debug:
        msg: "{{ r_prereq.stdout_lines | default(['prereq not needed — Cloud inventory and Lab inventory already exist']) }}"

# ---------------------------------------------------------------------------
# Play 3: All AAP REST API tasks — create constructed inventory + configure + sync
# ---------------------------------------------------------------------------
- name: Module 06 — Build Constructed Inventory via AAP API
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_connection: local
    ansible_host: 127.0.0.1
    _api: "{{ lookup('ansible.builtin.env', 'CONTROLLER_URL') }}/api/controller/v2"
    _aap_user: "{{ lookup('ansible.builtin.env', 'CONTROLLER_USERNAME') }}"
    _aap_pass: "{{ lookup('ansible.builtin.env', 'CONTROLLER_PASSWORD') }}"

    # Block-04 final source_vars — the complete constructed plugin config.
    # Applied directly; no need to go through blocks 01-03 incrementally.
    # compose  — lowercases ansible_host (CLOUD3.cloud.example.com → cloud3...)
    # groups   — creates production/development groups by hostname search
    # keyed_groups — creates architecture groups (x86_64, arm) and server_type_ groups
    final_source_vars: |
      plugin: ansible.builtin.constructed
      strict: false
      compose:
        ansible_host: inventory_hostname | lower()
        name: inventory_hostname | lower()
      groups:
        production: inventory_hostname is search('prod')
        development: inventory_hostname is search('dev')
      keyed_groups:
        - prefix: ""
          separator: ""
          key: architecture
        - prefix: server_type
          separator: "_"
          key: type

  tasks:
    # ------------------------------------------------------------------
    # Step 1: Resolve Default organisation ID
    # ------------------------------------------------------------------
    - name: Get Default organisation ID
      ansible.builtin.uri:
        url: "{{ _api }}/organizations/?name=Default"
        method: GET
        url_username: "{{ _aap_user }}"
        url_password: "{{ _aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_org
      ignore_errors: true

    - name: Set org_id fact
      ansible.builtin.set_fact:
        org_id: "{{ r_org.json.results[0].id | int }}"
      when:
        - r_org.json is defined
        - r_org.json.results | default([]) | length > 0

    # ------------------------------------------------------------------
    # Step 2: Resolve Cloud inventory and Lab inventory IDs
    # ------------------------------------------------------------------
    - name: Get Cloud inventory ID
      ansible.builtin.uri:
        url: "{{ _api }}/inventories/?name=Cloud+inventory&organization={{ org_id }}"
        method: GET
        url_username: "{{ _aap_user }}"
        url_password: "{{ _aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_cloud_inv
      ignore_errors: true

    - name: Get Lab inventory ID
      ansible.builtin.uri:
        url: "{{ _api }}/inventories/?name=Lab+inventory&organization={{ org_id }}"
        method: GET
        url_username: "{{ _aap_user }}"
        url_password: "{{ _aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_lab_inv
      ignore_errors: true

    - name: Set input inventory ID facts
      ansible.builtin.set_fact:
        cloud_inv_id: "{{ r_cloud_inv.json.results[0].id | default(0) | int }}"
        lab_inv_id: "{{ r_lab_inv.json.results[0].id | default(0) | int }}"

    - name: Abort if Cloud inventory not found
      ansible.builtin.fail:
        msg: >-
          Cloud inventory not found in AAP. The prereq play should have created it.
          Check add-dyn-inventory.yml output above.
      when: cloud_inv_id | int == 0

    - name: Abort if Lab inventory not found
      ansible.builtin.fail:
        msg: >-
          Lab inventory not found in AAP. The prereq play should have created it.
          Check add-dyn-inventory.yml output above.
      when: lab_inv_id | int == 0

    # ------------------------------------------------------------------
    # Step 3: Check if Constructed Inventory already exists
    # ------------------------------------------------------------------
    - name: Check if Constructed Inventory already exists
      ansible.builtin.uri:
        url: "{{ _api }}/inventories/?name=Constructed+Inventory&kind=constructed&organization={{ org_id }}"
        method: GET
        url_username: "{{ _aap_user }}"
        url_password: "{{ _aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_constructed_check
      ignore_errors: true

    - name: Set constructed inventory exists flag and ID
      ansible.builtin.set_fact:
        constructed_inv_exists: "{{ r_constructed_check.json.count | default(0) | int > 0 }}"
        constructed_inv_id: "{{ r_constructed_check.json.results[0].id | default(0) | int }}"

    # ------------------------------------------------------------------
    # Step 4: Create Constructed Inventory (if not present)
    # ------------------------------------------------------------------
    - name: Create Constructed Inventory
      ansible.builtin.uri:
        url: "{{ _api }}/inventories/"
        method: POST
        url_username: "{{ _aap_user }}"
        url_password: "{{ _aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        headers:
          Content-Type: application/json
        body_format: raw
        body: "{{ {'name': 'Constructed Inventory', 'kind': 'constructed', 'organization': org_id | int} | to_json }}"
        status_code: [200, 201]
        return_content: true
      register: r_constructed_create
      when: not constructed_inv_exists | bool
      ignore_errors: true

    - name: Set final constructed inventory ID
      ansible.builtin.set_fact:
        constructed_inv_id: >-
          {{
            r_constructed_create.json.id | int
            if not constructed_inv_exists | bool
            else constructed_inv_id | int
          }}

    # ------------------------------------------------------------------
    # Step 5: Associate input inventories (Cloud inventory + Lab inventory)
    # ------------------------------------------------------------------
    - name: Get current input inventories for Constructed Inventory
      ansible.builtin.uri:
        url: "{{ _api }}/inventories/{{ constructed_inv_id }}/input_inventories/"
        method: GET
        url_username: "{{ _aap_user }}"
        url_password: "{{ _aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_input_invs
      ignore_errors: true

    - name: Collect current input inventory IDs
      ansible.builtin.set_fact:
        current_input_ids: "{{ r_input_invs.json.results | default([]) | map(attribute='id') | map('string') | list }}"

    - name: Associate Cloud inventory as input inventory
      ansible.builtin.uri:
        url: "{{ _api }}/inventories/{{ constructed_inv_id }}/input_inventories/"
        method: POST
        url_username: "{{ _aap_user }}"
        url_password: "{{ _aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        headers:
          Content-Type: application/json
        body_format: raw
        body: "{{ {'id': cloud_inv_id | int} | to_json }}"
        status_code: [200, 201, 204]
      when: cloud_inv_id | string not in current_input_ids
      ignore_errors: true

    - name: Associate Lab inventory as input inventory
      ansible.builtin.uri:
        url: "{{ _api }}/inventories/{{ constructed_inv_id }}/input_inventories/"
        method: POST
        url_username: "{{ _aap_user }}"
        url_password: "{{ _aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        headers:
          Content-Type: application/json
        body_format: raw
        body: "{{ {'id': lab_inv_id | int} | to_json }}"
        status_code: [200, 201, 204]
      when: lab_inv_id | string not in current_input_ids
      ignore_errors: true

    # ------------------------------------------------------------------
    # Step 6: Find the auto-created inventory source and apply source_vars
    # The constructed inventory plugin config (compose, groups, keyed_groups)
    # must be PATCHed onto the auto-created inventory SOURCE, not on the
    # inventory's variables field.
    # ------------------------------------------------------------------
    - name: Get auto-created inventory source for Constructed Inventory
      ansible.builtin.uri:
        url: "{{ _api }}/inventories/{{ constructed_inv_id }}/inventory_sources/"
        method: GET
        url_username: "{{ _aap_user }}"
        url_password: "{{ _aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_inv_sources
      ignore_errors: true

    - name: Set inventory source ID fact
      ansible.builtin.set_fact:
        constructed_src_id: "{{ r_inv_sources.json.results[0].id | default(0) | int }}"
      when:
        - r_inv_sources.json is defined
        - r_inv_sources.json.results | default([]) | length > 0

    - name: Apply block-04 final source_vars to the auto-created inventory source
      ansible.builtin.uri:
        url: "{{ _api }}/inventory_sources/{{ constructed_src_id }}/"
        method: PATCH
        url_username: "{{ _aap_user }}"
        url_password: "{{ _aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        headers:
          Content-Type: application/json
        body_format: raw
        body: "{{ {'source_vars': final_source_vars} | to_json }}"
        status_code: [200, 201]
        return_content: true
      register: r_src_update
      when: constructed_src_id | default(0) | int > 0
      ignore_errors: true

    # ------------------------------------------------------------------
    # Step 7: Trigger sync and wait for completion
    # ------------------------------------------------------------------
    - name: Trigger sync of the Constructed Inventory source
      ansible.builtin.uri:
        url: "{{ _api }}/inventory_sources/{{ constructed_src_id }}/update/"
        method: POST
        url_username: "{{ _aap_user }}"
        url_password: "{{ _aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        headers:
          Content-Type: application/json
        body_format: raw
        body: "{}"
        status_code: [200, 201, 202]
        return_content: true
      register: r_sync
      when: constructed_src_id | default(0) | int > 0
      ignore_errors: true

    - name: Set sync job ID fact
      ansible.builtin.set_fact:
        sync_job_id: "{{ r_sync.json.id | default(0) | int }}"
      when:
        - r_sync is not skipped
        - r_sync is not failed
        - r_sync.json is defined

    - name: Default sync job ID when sync was skipped or failed
      ansible.builtin.set_fact:
        sync_job_id: 0
      when: sync_job_id is not defined

    - name: Poll inventory sync job until complete (up to 3 min — 18 x 10s)
      ansible.builtin.uri:
        url: "{{ _api }}/inventory_updates/{{ sync_job_id }}/"
        method: GET
        url_username: "{{ _aap_user }}"
        url_password: "{{ _aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_job_status
      until: r_job_status.json.status | default('') in ['successful', 'failed', 'error', 'canceled']
      retries: 18
      delay: 10
      when: sync_job_id | int > 0
      ignore_errors: true

    - name: Set sync final status fact
      ansible.builtin.set_fact:
        _sync_final_status: "{{ r_job_status.json.status | default('skipped') }}"
      when: r_job_status is not skipped

    - name: Default sync final status when not polled
      ansible.builtin.set_fact:
        _sync_final_status: "skipped"
      when: _sync_final_status is not defined

    # ------------------------------------------------------------------
    # Step 8: Verify final state — groups, hosts, CLOUD3 compose
    # ------------------------------------------------------------------
    - name: Verify Constructed Inventory has hosts
      ansible.builtin.uri:
        url: "{{ _api }}/inventories/{{ constructed_inv_id }}/hosts/"
        method: GET
        url_username: "{{ _aap_user }}"
        url_password: "{{ _aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_hosts
      ignore_errors: true

    - name: Verify groups in Constructed Inventory
      ansible.builtin.uri:
        url: "{{ _api }}/inventories/{{ constructed_inv_id }}/groups/?page_size=100"
        method: GET
        url_username: "{{ _aap_user }}"
        url_password: "{{ _aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_groups
      ignore_errors: true

    - name: Verify CLOUD3 host exists (compose lowercases ansible_host)
      ansible.builtin.uri:
        url: "{{ _api }}/inventories/{{ constructed_inv_id }}/hosts/?name=CLOUD3.cloud.example.com"
        method: GET
        url_username: "{{ _aap_user }}"
        url_password: "{{ _aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_cloud3_host
      ignore_errors: true

    - name: Set result facts
      ansible.builtin.set_fact:
        _constructed_ok: "{{ constructed_inv_id | int > 0 }}"
        _hosts_ok: "{{ r_hosts.json.count | default(0) | int > 0 }}"
        _groups_ok: "{{ r_groups.json.count | default(0) | int > 0 }}"
        _group_names: "{{ r_groups.json.results | default([]) | map(attribute='name') | list }}"
        _cloud3_ok: "{{ r_cloud3_host.json.count | default(0) | int > 0 }}"
        _sync_ok: "{{ _sync_final_status == 'successful' }}"

    - name: Derive per-group flags
      ansible.builtin.set_fact:
        _production_ok: "{{ 'production' in _group_names }}"
        _development_ok: "{{ 'development' in _group_names }}"
        _dyngroup_ok: "{{ 'dyngroup' in _group_names }}"
        _arch_keyed_ok: >-
          {{
            _group_names | select('match', '^(x86_64|arm|aarch64)$') | list | length > 0
          }}
        _type_keyed_ok: >-
          {{
            _group_names | select('match', '^server_type_') | list | length > 0
          }}

    - name: Report solve status
      ansible.builtin.debug:
        msg: |
          ========= Module 06 Solve Report =========
          Constructed Inventory created   : {{ 'ok' if _constructed_ok else 'NOT ok' }}
          Input inventories attached      : Cloud inventory + Lab inventory
          source_vars (block-04) applied  : to auto-created inventory source
          Inventory sync status           : {{ _sync_final_status }}
          Inventory has hosts             : {{ 'ok' if _hosts_ok else 'NOT ok' }}
          Inventory has groups            : {{ 'ok' if _groups_ok else 'NOT ok' }}
          Groups found                    : {{ _group_names | join(', ') | default('(none)') }}
          production group present        : {{ 'ok' if _production_ok else 'NOT ok' }}
          development group present       : {{ 'ok' if _development_ok else 'NOT ok' }}
          dyngroup present                : {{ 'ok' if _dyngroup_ok else 'NOT ok' }}
          architecture keyed_groups       : {{ 'ok' if _arch_keyed_ok else 'NOT ok' }}
          server_type_ keyed_groups       : {{ 'ok' if _type_keyed_ok else 'NOT ok' }}
          CLOUD3 host with compose        : {{ 'ok' if _cloud3_ok else 'NOT ok' }}
          ==========================================
