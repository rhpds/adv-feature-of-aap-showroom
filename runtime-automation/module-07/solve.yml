---
# Module 07 Solve — Secure the Automation Supply Chain
#
# What this playbook does:
#
#   Play 1 — localhost: Register bastion in in-memory inventory from env vars.
#
#   Play 2 — bastion: GPG setup, ansible-sign, initial signed commit+push.
#     1.  Clone playbooks-adv-controller repo (idempotent)
#     2.  Configure git global user identity
#     3.  Write ~/gpg.txt batch key spec (idempotent)
#     4.  Generate GPG key pair for VerySecure <student@localhost> (idempotent)
#     5.  Export GPG public key to ~/signing_demo.asc (idempotent)
#     6.  Install ansible-sign via dnf (state: present — naturally idempotent)
#     7.  Write MANIFEST.in to project root (idempotent)
#     8.  Generate sha256sum.txt via Python API + sign with gpg (no TTY needed)
#     9.  Stage, commit, and push .ansible-sign/ + MANIFEST.in to Gitea
#
#   Play 3 — localhost: Create AAP credentials, project, wait for initial sync.
#    10.  Read ~/signing_demo.asc from bastion via shell cat
#    11.  Create AAP GPG credential "ansible-sign-cred" (idempotent)
#    12.  Create AAP SCM credential "gitea-cred" (idempotent)
#    13.  Create AAP project "Signed Project" with signature validation (idempotent)
#    14.  Wait for initial project sync to succeed — must be SUCCESSFUL before tamper
#
#   Play 4 — bastion: Tamper with apache_install.yml and push (AFTER initial sync ok).
#    15.  Append tamper comment to apache_install.yml (idempotent)
#    16.  Commit and push the tampered file to Gitea
#
#   Play 5 — localhost: Trigger tamper re-sync, verify failure, final report.
#    17.  Trigger re-sync of "Signed Project" (detects tamper)
#    18.  Wait for tamper sync to complete (expect failure — Checksum mismatch)
#    19.  Final verification checks + report
#
# All variables are resolved via lookup('ansible.builtin.env', 'VAR_NAME').
# No bare extravars are used.

# ---------------------------------------------------------------------------
# Play 1 — Register bastion in the in-memory inventory
# ---------------------------------------------------------------------------
- name: Module 07 Solve — GPG, ansible-sign, signed commit on bastion
  hosts: bastions
  gather_facts: false
  vars:
    _user: "{{ lookup('ansible.builtin.env', 'SSH_USERNAME') }}"
    _gitea_url: "{{ lookup('ansible.builtin.env', 'GITEA_URL') | regex_replace('/+$', '') }}"
    _gitea_username: "{{ lookup('ansible.builtin.env', 'GITEA_USERNAME') }}"
    _gitea_password: "{{ lookup('ansible.builtin.env', 'GITEA_PASSWORD') }}"
    _gitea_project: "playbooks-adv-controller"
    _project_dir: "/home/{{ lookup('ansible.builtin.env', 'SSH_USERNAME') }}/playbooks-adv-controller"
    _gpg_txt: "/home/{{ lookup('ansible.builtin.env', 'SSH_USERNAME') }}/gpg.txt"
    _signing_asc: "/home/{{ lookup('ansible.builtin.env', 'SSH_USERNAME') }}/signing_demo.asc"

  tasks:

    # -------------------------------------------------------------------------
    # Step 1: Clone the repository (idempotent — skip if already present)
    # -------------------------------------------------------------------------
    - name: Check if project directory already exists
      ansible.builtin.stat:
        path: "{{ _project_dir }}"
      register: r_project_dir

    - name: Clone Gitea repository (if not present)
      ansible.builtin.shell: |
        cd /home/{{ _user }}
        git clone {{ _gitea_url }}/{{ _gitea_username }}/{{ _gitea_project }}.git
      when: not r_project_dir.stat.exists
      ignore_errors: true

    # -------------------------------------------------------------------------
    # Step 2: Configure git global user identity
    # -------------------------------------------------------------------------
    - name: Set git global user.name
      ansible.builtin.command:
        cmd: git config --global user.name "Lab User"
      changed_when: false

    - name: Set git global user.email
      ansible.builtin.command:
        cmd: git config --global user.email lab-user@localhost
      changed_when: false

    # -------------------------------------------------------------------------
    # Step 3: Write GPG batch file (idempotent — only create if missing)
    # -------------------------------------------------------------------------
    - name: Check if gpg.txt already exists
      ansible.builtin.stat:
        path: "{{ _gpg_txt }}"
      register: r_gpg_txt

    - name: Write ~/gpg.txt (GPG batch key spec)
      ansible.builtin.copy:
        dest: "{{ _gpg_txt }}"
        mode: "0600"
        content: |
          %echo Generating a basic OpenPGP key
          Key-Type: default
          Key-Length: 4096
          Subkey-Type: default
          Subkey-Length: default
          Name-Real: VerySecure
          Name-Comment: with no passphrase
          Name-Email: student@localhost
          Expire-Date: 0
          %no-ask-passphrase
          %no-protection
          # Do a commit here, so that we can later print "done" :-)
          %commit
          %echo done
      when: not r_gpg_txt.stat.exists

    # -------------------------------------------------------------------------
    # Step 4: Generate GPG key pair — idempotent: skip if VerySecure key exists
    # -------------------------------------------------------------------------
    - name: Check if VerySecure GPG key already exists
      ansible.builtin.shell: |
        gpg --list-keys 2>/dev/null | grep -q 'VerySecure' && echo exists || echo missing
      register: r_gpg_key_check
      changed_when: false

    - name: Generate GPG key pair from batch file
      ansible.builtin.shell: |
        gpg --batch --gen-key {{ _gpg_txt }}
      when: r_gpg_key_check.stdout | trim == 'missing'
      ignore_errors: true

    # -------------------------------------------------------------------------
    # Step 5: Export GPG public key to ~/signing_demo.asc — idempotent
    # -------------------------------------------------------------------------
    - name: Check if signing_demo.asc already exists
      ansible.builtin.stat:
        path: "{{ _signing_asc }}"
      register: r_asc_file

    - name: Export GPG public key to ~/signing_demo.asc
      ansible.builtin.shell: |
        gpg --output {{ _signing_asc }} --armor --export
      when: not r_asc_file.stat.exists
      ignore_errors: true

    # -------------------------------------------------------------------------
    # Step 6: Install ansible-sign (dnf state: present — naturally idempotent)
    # -------------------------------------------------------------------------
    - name: Install ansible-sign package
      ansible.builtin.dnf:
        name: ansible-sign
        state: present
      become: true
      ignore_errors: true

    # -------------------------------------------------------------------------
    # Step 7: Write MANIFEST.in to project root
    # -------------------------------------------------------------------------
    - name: Check if MANIFEST.in already exists
      ansible.builtin.stat:
        path: "{{ _project_dir }}/MANIFEST.in"
      register: r_manifest

    - name: Write MANIFEST.in to project root
      ansible.builtin.copy:
        dest: "{{ _project_dir }}/MANIFEST.in"
        mode: "0644"
        content: |
          recursive-exclude .git *
          recursive-exclude .vscode *
          recursive-exclude constructed-inventory *
          recursive-exclude inventory *
          exclude .ansible-lint
          exclude .gitignore
          exclude *.log
          exclude *.json
          include *.yml

    # -------------------------------------------------------------------------
    # Step 8: Generate sha256sum.txt via ansible_sign Python API,
    #         then sign it with gpg directly (no TTY required).
    #         Using a temp script file avoids YAML indentation issues with
    #         python3.11 -c multi-line inline code.
    # -------------------------------------------------------------------------
    - name: Write checksum generation script to /tmp
      ansible.builtin.copy:
        dest: /tmp/gen_checksums.py
        mode: "0755"
        content: |
          import sys
          sys.path.insert(0, '/usr/lib/python3.11/site-packages')
          from ansible_sign.checksum import ChecksumFile
          from pathlib import Path
          import os

          project_dir = sys.argv[1]
          p = Path(project_dir)
          cf = ChecksumFile(p)
          text = cf.generate_gnu_style()
          out = p / '.ansible-sign' / 'sha256sum.txt'
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(text)
          print('sha256sum.txt written ({} bytes)'.format(len(text)))

    - name: Generate sha256sum.txt using ansible_sign Python API
      ansible.builtin.shell: |
        mkdir -p {{ _project_dir }}/.ansible-sign
        python3.11 /tmp/gen_checksums.py {{ _project_dir }}
      register: r_checksums
      changed_when: "'written' in r_checksums.stdout"
      ignore_errors: true

    - name: Sign sha256sum.txt with gpg (no TTY)
      ansible.builtin.shell: |
        gpg --batch --yes --no-tty --armor --detach-sign \
            --output {{ _project_dir }}/.ansible-sign/sha256sum.txt.sig \
            --local-user "VerySecure" \
            {{ _project_dir }}/.ansible-sign/sha256sum.txt
        echo "GPG signing successful"
      register: r_sign
      changed_when: "'GPG signing successful' in r_sign.stdout"
      ignore_errors: true

    # -------------------------------------------------------------------------
    # Step 9: Configure Gitea remote URL with embedded credentials,
    #         stage, commit, and push .ansible-sign/ + MANIFEST.in
    # -------------------------------------------------------------------------
    - name: Configure Gitea remote URL with embedded credentials
      ansible.builtin.shell: |
        cd {{ _project_dir }}
        git remote set-url origin {{ _gitea_url | regex_replace('^(https?://)', '\1' + _gitea_username + ':' + _gitea_password + '@') }}/{{ _gitea_username }}/{{ _gitea_project }}.git
      no_log: true
      ignore_errors: true

    - name: Stage .ansible-sign/ and MANIFEST.in
      ansible.builtin.shell: |
        cd {{ _project_dir }}
        git add .ansible-sign/ MANIFEST.in
      changed_when: false
      ignore_errors: true

    - name: Commit signed content (skip if nothing to commit)
      ansible.builtin.shell: |
        cd {{ _project_dir }}
        git diff --cached --quiet && echo "nothing-to-commit" || git commit -m "Adding signatures for project"
      register: r_git_commit
      changed_when: "'nothing-to-commit' not in r_git_commit.stdout"
      ignore_errors: true

    - name: Push signed content to Gitea
      ansible.builtin.shell: |
        cd {{ _project_dir }}
        git push origin HEAD
      changed_when: false
      ignore_errors: true

    # -------------------------------------------------------------------------
    # Step 9b: Read signing_demo.asc on bastion and store as host var
    # -------------------------------------------------------------------------
    - name: Read signing_demo.asc content on bastion
      ansible.builtin.shell: |
        cat {{ _signing_asc }}
      register: r_signing_asc_content
      changed_when: false
      ignore_errors: true

# ---------------------------------------------------------------------------
# Play 3 — Create AAP credentials, project, and wait for initial sync
#           MUST complete before the tamper is pushed (Play 4)
# ---------------------------------------------------------------------------
- name: Module 07 Solve — configure AAP credentials and project, wait for initial sync
  hosts: bastions
  gather_facts: false
  vars:
    _ctrl_user: "{{ lookup('ansible.builtin.env', 'CONTROLLER_USERNAME') }}"
    _ctrl_pass: "{{ lookup('ansible.builtin.env', 'CONTROLLER_PASSWORD') }}"
    _gitea_url: "{{ lookup('ansible.builtin.env', 'GITEA_URL') | regex_replace('/+$', '') }}"
    _gitea_username: "{{ lookup('ansible.builtin.env', 'GITEA_USERNAME') }}"
    _gitea_password: "{{ lookup('ansible.builtin.env', 'GITEA_PASSWORD') }}"
    _ssh_user: "{{ lookup('ansible.builtin.env', 'SSH_USERNAME') }}"
    _aap_api: "{{ lookup('ansible.builtin.env', 'CONTROLLER_URL') | regex_replace('/+$', '') }}/api/controller/v2"
    _gitea_project: "playbooks-adv-controller"

  tasks:

    # -------------------------------------------------------------------------
    # Step 10: Get GPG key content from bastion hostvars
    # -------------------------------------------------------------------------
    - name: Set GPG public key fact from bastion hostvars
      ansible.builtin.set_fact:
        _gpg_pub_key: "{{ r_signing_asc_content['stdout'] }}"
      when:
        - r_signing_asc_content is defined
        - r_signing_asc_content['stdout'] is defined
        - r_signing_asc_content['stdout'] | length > 0

    # -------------------------------------------------------------------------
    # Step 11: Create AAP GPG credential "ansible-sign-cred" (idempotent)
    # -------------------------------------------------------------------------
    - name: Get GPG Public Key credential type ID
      ansible.builtin.uri:
        url: "{{ _aap_api }}/credential_types/?name=GPG+Public+Key"
        method: GET
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_gpg_cred_type
      ignore_errors: true

    - name: Set GPG credential type ID fact
      ansible.builtin.set_fact:
        _gpg_cred_type_id: "{{ (r_gpg_cred_type.json.results | first).id }}"
      when:
        - r_gpg_cred_type.json is defined
        - r_gpg_cred_type.json.results | length > 0

    - name: Check if ansible-sign-cred already exists
      ansible.builtin.uri:
        url: "{{ _aap_api }}/credentials/?name=ansible-sign-cred"
        method: GET
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_cred_check
      ignore_errors: true

    - name: Create GPG credential "ansible-sign-cred"
      ansible.builtin.uri:
        url: "{{ _aap_api }}/credentials/"
        method: POST
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          name: "ansible-sign-cred"
          organization: 1
          credential_type: "{{ _gpg_cred_type_id | int }}"
          inputs:
            gpg_public_key: "{{ _gpg_pub_key }}"
        timeout: 30
        status_code: [200, 201]
        return_content: true
      when:
        - _gpg_cred_type_id is defined
        - _gpg_pub_key is defined
        - r_cred_check.json is defined
        - r_cred_check.json.count | int == 0
      register: r_cred_create
      ignore_errors: true

    # -------------------------------------------------------------------------
    # Step 12: Create AAP SCM credential "gitea-cred" (idempotent)
    # -------------------------------------------------------------------------
    - name: Get Source Control credential type ID
      ansible.builtin.uri:
        url: "{{ _aap_api }}/credential_types/?name=Source+Control"
        method: GET
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_scm_cred_type
      ignore_errors: true

    - name: Set SCM credential type ID fact
      ansible.builtin.set_fact:
        _scm_cred_type_id: "{{ (r_scm_cred_type.json.results | first).id }}"
      when:
        - r_scm_cred_type.json is defined
        - r_scm_cred_type.json.results | length > 0

    - name: Check if gitea-cred already exists
      ansible.builtin.uri:
        url: "{{ _aap_api }}/credentials/?name=gitea-cred"
        method: GET
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_gitea_cred_check
      ignore_errors: true

    - name: Create SCM credential "gitea-cred"
      ansible.builtin.uri:
        url: "{{ _aap_api }}/credentials/"
        method: POST
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          name: "gitea-cred"
          organization: 1
          credential_type: "{{ _scm_cred_type_id | int }}"
          inputs:
            username: "{{ _gitea_username }}"
            password: "{{ _gitea_password }}"
        timeout: 30
        status_code: [200, 201]
        return_content: true
      when:
        - _scm_cred_type_id is defined
        - r_gitea_cred_check.json is defined
        - r_gitea_cred_check.json.count | int == 0
      register: r_gitea_cred_create
      ignore_errors: true

    # -------------------------------------------------------------------------
    # Step 13: Create AAP project "Signed Project" with signature validation.
    #          Re-fetch credential IDs (may have just been created above).
    # -------------------------------------------------------------------------
    - name: Fetch ansible-sign-cred ID
      ansible.builtin.uri:
        url: "{{ _aap_api }}/credentials/?name=ansible-sign-cred"
        method: GET
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_asc_cred
      ignore_errors: true

    - name: Set ansible-sign-cred ID fact
      ansible.builtin.set_fact:
        _asc_cred_id: "{{ (r_asc_cred.json.results | first).id }}"
      when:
        - r_asc_cred.json is defined
        - r_asc_cred.json.results | length > 0

    - name: Fetch gitea-cred ID
      ansible.builtin.uri:
        url: "{{ _aap_api }}/credentials/?name=gitea-cred"
        method: GET
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_gitea_cred
      ignore_errors: true

    - name: Set gitea-cred ID fact
      ansible.builtin.set_fact:
        _gitea_cred_id: "{{ (r_gitea_cred.json.results | first).id }}"
      when:
        - r_gitea_cred.json is defined
        - r_gitea_cred.json.results | length > 0

    - name: Check if "Signed Project" already exists
      ansible.builtin.uri:
        url: "{{ _aap_api }}/projects/?name=Signed+Project"
        method: GET
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_proj_check
      ignore_errors: true

    - name: Create project "Signed Project" with signature validation
      ansible.builtin.uri:
        url: "{{ _aap_api }}/projects/"
        method: POST
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          name: "Signed Project"
          organization: 1
          scm_type: "git"
          scm_url: "{{ _gitea_url }}/{{ _gitea_username }}/{{ _gitea_project }}.git"
          credential: "{{ _gitea_cred_id | int }}"
          signature_validation_credential: "{{ _asc_cred_id | int }}"
        timeout: 30
        status_code: [200, 201]
        return_content: true
      when:
        - _asc_cred_id is defined
        - _gitea_cred_id is defined
        - r_proj_check.json is defined
        - r_proj_check.json.count | int == 0
      register: r_proj_create
      ignore_errors: true

    # -------------------------------------------------------------------------
    # Step 14: Fetch project ID and wait for initial sync to succeed.
    #          AAP auto-triggers a sync when a project is created.
    #          This poll MUST complete before the tamper is pushed (Play 4).
    # -------------------------------------------------------------------------
    - name: Fetch "Signed Project" status — poll until terminal state
      ansible.builtin.uri:
        url: "{{ _aap_api }}/projects/?name=Signed+Project"
        method: GET
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_proj_status
      until: >-
        r_proj_status.json is defined
        and r_proj_status.json.results | length > 0
        and (r_proj_status.json.results | first).status in ['successful', 'failed', 'canceled']
      retries: 24
      delay: 5
      ignore_errors: true

    - name: Set initial sync status fact
      ansible.builtin.set_fact:
        _initial_sync_ok: >-
          {{
            r_proj_status.json is defined
            and r_proj_status.json.results | length > 0
            and (r_proj_status.json.results | first).status == 'successful'
          }}

    - name: Set project ID fact
      ansible.builtin.set_fact:
        _project_id: "{{ (r_proj_status.json.results | first).id }}"
      when:
        - r_proj_status.json is defined
        - r_proj_status.json.results | length > 0

# ---------------------------------------------------------------------------
# Play 4 — Tamper with apache_install.yml and push (AFTER initial sync ok)
# ---------------------------------------------------------------------------
- name: Module 07 Solve — tamper apache_install.yml on bastion and push
  hosts: bastions
  gather_facts: false
  vars:
    _user: "{{ lookup('ansible.builtin.env', 'SSH_USERNAME') }}"
    _gitea_project: "playbooks-adv-controller"
    _project_dir: "/home/{{ lookup('ansible.builtin.env', 'SSH_USERNAME') }}/playbooks-adv-controller"

  tasks:

    # -------------------------------------------------------------------------
    # Step 15: Tamper with apache_install.yml (append a comment — idempotent)
    # -------------------------------------------------------------------------
    - name: Check if tamper comment already added to apache_install.yml
      ansible.builtin.shell: |
        grep -q '# TAMPERED: supply chain check' {{ _project_dir }}/apache_install.yml \
          && echo exists || echo missing
      register: r_tamper_check
      changed_when: false
      ignore_errors: true

    - name: Append tamper comment to apache_install.yml
      ansible.builtin.lineinfile:
        path: "{{ _project_dir }}/apache_install.yml"
        line: "# TAMPERED: supply chain check"
        insertafter: EOF
      when: r_tamper_check.stdout | trim == 'missing'

    # -------------------------------------------------------------------------
    # Step 16: Commit and push the tampered file
    # -------------------------------------------------------------------------
    - name: Stage tampered apache_install.yml
      ansible.builtin.shell: |
        cd {{ _project_dir }}
        git add apache_install.yml
      changed_when: false
      ignore_errors: true

    - name: Commit tampered file (skip if nothing to commit)
      ansible.builtin.shell: |
        cd {{ _project_dir }}
        git diff --cached --quiet && echo "nothing-to-commit" || git commit -m "Changing file"
      register: r_tamper_commit
      changed_when: "'nothing-to-commit' not in r_tamper_commit.stdout"
      ignore_errors: true

    - name: Push tampered file to Gitea
      ansible.builtin.shell: |
        cd {{ _project_dir }}
        git push origin HEAD
      changed_when: false
      ignore_errors: true

# ---------------------------------------------------------------------------
# Play 5 — Trigger tamper re-sync, verify failure, final report
# ---------------------------------------------------------------------------
- name: Module 07 Solve — trigger tamper sync, verify checks, report
  hosts: bastions
  gather_facts: false
  vars:
    _ctrl_user: "{{ lookup('ansible.builtin.env', 'CONTROLLER_USERNAME') }}"
    _ctrl_pass: "{{ lookup('ansible.builtin.env', 'CONTROLLER_PASSWORD') }}"
    _ssh_user: "{{ lookup('ansible.builtin.env', 'SSH_USERNAME') }}"
    _aap_api: "{{ lookup('ansible.builtin.env', 'CONTROLLER_URL') | regex_replace('/+$', '') }}/api/controller/v2"
    _signing_asc: "/home/{{ lookup('ansible.builtin.env', 'SSH_USERNAME') }}/signing_demo.asc"
    _project_dir_path: "/home/{{ lookup('ansible.builtin.env', 'SSH_USERNAME') }}/playbooks-adv-controller"

  tasks:

    # -------------------------------------------------------------------------
    # Step 17: Trigger a fresh sync of "Signed Project" to detect the tamper
    # -------------------------------------------------------------------------
    - name: Trigger "Signed Project" re-sync (tamper detection)
      ansible.builtin.uri:
        url: "{{ _aap_api }}/projects/{{ _project_id | default('') }}/update/"
        method: POST
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200, 201, 202]
      when: _project_id is defined
      register: r_sync_trigger
      ignore_errors: true

    # -------------------------------------------------------------------------
    # Step 18: Wait for tamper sync to complete (expect failure)
    # -------------------------------------------------------------------------
    - name: Wait for "Signed Project" tamper sync to finish
      ansible.builtin.uri:
        url: "{{ _aap_api }}/projects/{{ _project_id }}/"
        method: GET
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_tamper_sync
      until: >-
        r_tamper_sync.json is defined
        and r_tamper_sync.json.status in ['successful', 'failed', 'canceled']
      retries: 24
      delay: 5
      when: _project_id is defined
      ignore_errors: true

    - name: Set tamper sync failed fact
      ansible.builtin.set_fact:
        _tamper_sync_failed: >-
          {{
            r_tamper_sync.json is defined
            and r_tamper_sync.json.status == 'failed'
          }}
      when: _project_id is defined

    # -------------------------------------------------------------------------
    # Verification checks — bastion-side via hostvars
    # -------------------------------------------------------------------------
    - name: Set GPG key exists fact from bastion hostvars
      ansible.builtin.set_fact:
        _gpg_key_ok: >-
          {{
            r_gpg_key_check is defined
            and (r_gpg_key_check['stdout'] | default('') | trim) == 'exists'
          }}

    - name: Set signing_demo.asc valid fact from bastion hostvars
      ansible.builtin.set_fact:
        _asc_ok: >-
          {{
            r_signing_asc_content is defined
            and (r_signing_asc_content['stdout'] | default('')) | length > 0
            and 'BEGIN PGP PUBLIC KEY BLOCK' in (r_signing_asc_content['stdout'] | default(''))
          }}

    - name: Set ansible-sign installed fact from bastion hostvars
      ansible.builtin.set_fact:
        _ansiblesign_ok: >-
          {{
            r_sign is defined
            or (r_manifest is defined
                and r_manifest['stat']['exists'] | default(false))
          }}

    - name: Verify ansible-sign installed on bastion
      ansible.builtin.shell: |
        rpm -q ansible-sign > /dev/null 2>&1 && echo installed || echo missing
      register: r_ansiblesign_verify
      changed_when: false
      ignore_errors: true
      delegate_to: bastion

    - name: Set ansible-sign installed fact from verify
      ansible.builtin.set_fact:
        _ansiblesign_ok: "{{ (r_ansiblesign_verify.stdout | default('') | trim) == 'installed' }}"

    - name: Set MANIFEST.in exists fact from bastion hostvars
      ansible.builtin.set_fact:
        _manifest_ok: >-
          {{
            r_manifest is defined
            and r_manifest['stat']['exists'] | default(false)
          }}

    - name: Set sha256sum.txt exists fact from bastion hostvars
      ansible.builtin.set_fact:
        _sha256_ok: >-
          {{
            r_sha256_verify is defined
            and r_sha256_verify['stat']['exists'] | default(false)
          }}

    - name: Verify .ansible-sign files exist on bastion
      ansible.builtin.shell: |
        test -f {{ _project_dir_path }}/.ansible-sign/sha256sum.txt \
          && test -f {{ _project_dir_path }}/.ansible-sign/sha256sum.txt.sig \
          && echo both_exist || echo missing
      register: r_sign_files_verify
      changed_when: false
      ignore_errors: true
      delegate_to: bastion

    - name: Set sha256sum files exist facts from verify
      ansible.builtin.set_fact:
        _sha256_ok: "{{ (r_sign_files_verify.stdout | default('') | trim) == 'both_exist' }}"
        _sig_ok: "{{ (r_sign_files_verify.stdout | default('') | trim) == 'both_exist' }}"

    - name: Verify signed commit is present in git log
      ansible.builtin.shell: |
        cd {{ _project_dir_path }}
        git log --oneline --name-only --diff-filter=A HEAD~5..HEAD 2>/dev/null \
          | grep -q '\.ansible-sign' && echo pushed || echo missing
      register: r_git_pushed_verify
      changed_when: false
      ignore_errors: true
      delegate_to: bastion

    - name: Set signed commit pushed fact
      ansible.builtin.set_fact:
        _git_signed_pushed_ok: "{{ (r_git_pushed_verify.stdout | default('') | trim) == 'pushed' }}"

    - name: Verify tamper commit is present in git log
      ansible.builtin.shell: |
        cd {{ _project_dir_path }}
        git log --oneline HEAD~3..HEAD 2>/dev/null \
          | grep -q 'Changing file' && echo pushed || echo missing
      register: r_tamper_pushed_verify
      changed_when: false
      ignore_errors: true
      delegate_to: bastion

    - name: Set tamper commit pushed fact
      ansible.builtin.set_fact:
        _tamper_pushed_ok: "{{ (r_tamper_pushed_verify.stdout | default('') | trim) == 'pushed' }}"

    # -------------------------------------------------------------------------
    # AAP credential and project existence checks
    # -------------------------------------------------------------------------
    - name: Check ansible-sign-cred exists in AAP
      ansible.builtin.uri:
        url: "{{ _aap_api }}/credentials/?name=ansible-sign-cred"
        method: GET
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_asc_cred_final
      ignore_errors: true

    - name: Set ansible-sign-cred final check fact
      ansible.builtin.set_fact:
        _asc_cred_ok: "{{ (r_asc_cred_final.json.count | default(0)) | int > 0 }}"

    - name: Check gitea-cred exists in AAP
      ansible.builtin.uri:
        url: "{{ _aap_api }}/credentials/?name=gitea-cred"
        method: GET
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_gitea_cred_final
      ignore_errors: true

    - name: Set gitea-cred final check fact
      ansible.builtin.set_fact:
        _gitea_cred_ok: "{{ (r_gitea_cred_final.json.count | default(0)) | int > 0 }}"

    - name: Check "Signed Project" exists in AAP
      ansible.builtin.uri:
        url: "{{ _aap_api }}/projects/?name=Signed+Project"
        method: GET
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_proj_final
      ignore_errors: true

    - name: Set Signed Project final check fact
      ansible.builtin.set_fact:
        _proj_ok: "{{ (r_proj_final.json.count | default(0)) | int > 0 }}"

    # -------------------------------------------------------------------------
    # Step 19: Final report
    # -------------------------------------------------------------------------
    - name: Report solve status
      ansible.builtin.debug:
        msg: |
          GPG key VerySecure <student@localhost> in keyring:    {{ 'ok' if _gpg_key_ok | default(false) else 'NOT ok' }}
          ~/signing_demo.asc exists with PGP PUBLIC KEY BLOCK: {{ 'ok' if _asc_ok | default(false) else 'NOT ok' }}
          ansible-sign installed on bastion:                    {{ 'ok' if _ansiblesign_ok | default(false) else 'NOT ok' }}
          MANIFEST.in in project root:                          {{ 'ok' if _manifest_ok | default(false) else 'NOT ok' }}
          .ansible-sign/sha256sum.txt exists:                   {{ 'ok' if _sha256_ok | default(false) else 'NOT ok' }}
          .ansible-sign/sha256sum.txt.sig exists:               {{ 'ok' if _sig_ok | default(false) else 'NOT ok' }}
          signed commit pushed to Gitea:                        {{ 'ok' if _git_signed_pushed_ok | default(false) else 'NOT ok' }}
          tamper commit pushed to Gitea:                        {{ 'ok' if _tamper_pushed_ok | default(false) else 'NOT ok' }}
          AAP credential ansible-sign-cred exists:              {{ 'ok' if _asc_cred_ok | default(false) else 'NOT ok' }}
          AAP credential gitea-cred exists:                     {{ 'ok' if _gitea_cred_ok | default(false) else 'NOT ok' }}
          AAP project "Signed Project" exists:                  {{ 'ok' if _proj_ok | default(false) else 'NOT ok' }}
          initial project sync succeeded:                       {{ 'ok' if _initial_sync_ok | default(false) else 'NOT ok' }}
          tamper sync failed (Checksum mismatch expected):      {{ 'ok' if _tamper_sync_failed | default(false) else 'NOT ok (sync may still be running — validate again)' }}
