---
# Module 07 Solve — Secure the Automation Supply Chain
#
# What this playbook does:
#   1. Ensures the git repository is cloned on the bastion host (idempotent)
#   2. Configures global git user name / email
#   3. Writes ~/gpg.txt (GPG batch key spec) — idempotent via stat guard
#   4. Generates a GPG key pair for VerySecure <student@localhost> — idempotent
#   5. Exports the public key to ~/signing_demo.asc — idempotent
#   6. Installs ansible-sign via dnf (state: present — naturally idempotent)
#   7. Writes MANIFEST.in into the project root — idempotent
#   8. Runs ansible-sign project gpg-sign (idempotent: re-signs on every run,
#      which is safe — the .sig file is simply overwritten)
#   9. Stages, commits, and pushes .ansible-sign/ + MANIFEST.in to Gitea
#  10. Slurps ~/signing_demo.asc into a variable for API calls
#  11. Creates AAP GPG credential "ansible-sign-cred" (idempotent: skip if exists)
#  12. Creates AAP SCM credential "gitea-cred" (idempotent: skip if exists)
#  13. Creates AAP project "Signed Project" with signature validation (idempotent)
#  14. Waits for the initial project sync to complete successfully
#  15. Tampers with apache_install.yml (appends a comment line — idempotent guard)
#  16. Commits and pushes the tampered file to Gitea
#  17. Triggers a fresh project sync of "Signed Project"
#  18. Waits for the sync job to complete (expects failure with Checksum mismatch)
#  19. Reports all check results
#
# Variables injected at runtime (via AgV / user_data extravars):
#   bastion_user        — bastion OS user (from bastion_ssh_user_name)
#   bastion_password    — bastion SSH password
#   bastion_host        — bastion SSH hostname
#   bastion_port        — bastion SSH port
#   gitea_url           — e.g. https://gitea-GUID.apps... (may not be in user_data)
#   controller_url      — AAP controller base URL
#   controller_username — AAP admin username
#   controller_password — AAP admin password
#   guid                — lab GUID
#
# Internal vars use _ prefix to avoid self-reference in vars: block

# ---------------------------------------------------------------------------
# Play 0: Register bastion in in-memory inventory
# ---------------------------------------------------------------------------
- name: Module 07 Solve — Register bastion host
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Add bastion to in-memory inventory
      ansible.builtin.add_host:
        name: bastion
        ansible_host: "{{ bastion_host }}"
        ansible_port: "{{ bastion_port }}"
        ansible_user: "{{ bastion_user }}"
        ansible_password: "{{ bastion_password }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

# ---------------------------------------------------------------------------
# Play 1: All solve steps on bastion (and AAP REST calls via uri)
# ---------------------------------------------------------------------------
- name: Module 07 Solve — Secure the Automation Supply Chain
  hosts: bastion
  gather_facts: false
  vars:
    # Use underscore-prefixed vars to avoid self-reference recursion.
    # All _xxx vars draw from known extravar names injected by jobs.py.
    _user: "{{ bastion_user | default('lab-user') }}"
    _gitea_project: "playbooks-adv-controller"
    _project_dir: "/home/{{ _user }}/{{ _gitea_project }}"
    _gpg_txt: "/home/{{ _user }}/gpg.txt"
    _signing_asc: "/home/{{ _user }}/signing_demo.asc"
    # gitea_url comes from extravars if set; derive from guid if not
    _gitea_url: "{{ gitea_url | default('https://gitea-' + (guid | default('')) + '.apps.ocpvdev01.rhdp.net') }}"
    _gitea_username: "{{ gitea_username | default(bastion_user | default('lab-user')) }}"
    _gitea_password: "{{ gitea_password | default(bastion_password | default('')) }}"
    _ctrl_url: "{{ controller_url | default('') }}"
    _ctrl_user: "{{ controller_username | default('') }}"
    _ctrl_pass: "{{ controller_password | default('') }}"
    # AAP 2.5 uses /api/controller/v2/ (not /api/v2/)
    _aap_api: "{{ controller_url | default('') }}/api/controller/v2"

  tasks:

    # -------------------------------------------------------------------------
    # Step 1: Clone the repository if it does not already exist
    # -------------------------------------------------------------------------
    - name: Check if project directory already exists
      ansible.builtin.stat:
        path: "{{ _project_dir }}"
      register: r_project_dir

    - name: Clone Gitea repository (if not present)
      ansible.builtin.shell: |
        cd /home/{{ _user }}
        git clone {{ _gitea_url }}/{{ _gitea_username }}/{{ _gitea_project }}.git
      when: not r_project_dir.stat.exists
      ignore_errors: true

    # -------------------------------------------------------------------------
    # Step 2: Configure git global user identity
    # -------------------------------------------------------------------------
    - name: Set git global user.name
      ansible.builtin.command:
        cmd: git config --global user.name "Your Name"
      changed_when: false

    - name: Set git global user.email
      ansible.builtin.command:
        cmd: git config --global user.email you@example.com
      changed_when: false

    # -------------------------------------------------------------------------
    # Step 3: Write GPG batch file (idempotent — only create if missing)
    # -------------------------------------------------------------------------
    - name: Check if gpg.txt already exists
      ansible.builtin.stat:
        path: "{{ _gpg_txt }}"
      register: r_gpg_txt

    - name: Write ~/gpg.txt (GPG batch key spec)
      ansible.builtin.copy:
        dest: "{{ _gpg_txt }}"
        mode: "0600"
        content: |
          %echo Generating a basic OpenPGP key
          Key-Type: default
          Key-Length: 4096
          Subkey-Type: default
          Subkey-Length: default
          Name-Real: VerySecure
          Name-Comment: with no passphrase
          Name-Email: student@localhost
          Expire-Date: 0
          %no-ask-passphrase
          %no-protection
          # Do a commit here, so that we can later print "done" :-)
          %commit
          %echo done
      when: not r_gpg_txt.stat.exists

    # -------------------------------------------------------------------------
    # Step 4: Generate GPG key pair — idempotent: skip if VerySecure key exists
    # -------------------------------------------------------------------------
    - name: Check if VerySecure GPG key already exists
      ansible.builtin.shell: |
        gpg --list-keys 2>/dev/null | grep -q 'VerySecure' && echo exists || echo missing
      register: r_gpg_key_check
      changed_when: false

    - name: Generate GPG key pair from batch file
      ansible.builtin.shell: |
        gpg --batch --gen-key {{ _gpg_txt }}
      when: r_gpg_key_check.stdout | trim == 'missing'
      ignore_errors: true

    # -------------------------------------------------------------------------
    # Step 5: Export GPG public key to ~/signing_demo.asc — idempotent
    # -------------------------------------------------------------------------
    - name: Check if signing_demo.asc already exists
      ansible.builtin.stat:
        path: "{{ _signing_asc }}"
      register: r_asc_file

    - name: Export GPG public key to ~/signing_demo.asc
      ansible.builtin.shell: |
        gpg --output {{ _signing_asc }} --armor --export
      when: not r_asc_file.stat.exists
      ignore_errors: true

    # -------------------------------------------------------------------------
    # Step 6: Install ansible-sign (dnf state: present — naturally idempotent)
    # -------------------------------------------------------------------------
    - name: Install ansible-sign package
      ansible.builtin.dnf:
        name: ansible-sign
        state: present
      become: true
      ignore_errors: true

    # -------------------------------------------------------------------------
    # Step 7: Write MANIFEST.in to project root — idempotent
    # -------------------------------------------------------------------------
    - name: Check if MANIFEST.in already exists
      ansible.builtin.stat:
        path: "{{ _project_dir }}/MANIFEST.in"
      register: r_manifest

    - name: Write MANIFEST.in to project root
      ansible.builtin.copy:
        dest: "{{ _project_dir }}/MANIFEST.in"
        mode: "0644"
        content: |
          recursive-exclude .git *
          recursive-exclude .vscode *
          recursive-exclude constructed-inventory *
          recursive-exclude inventory *
          exclude .ansible-lint
          exclude .gitignore
          include *.yml
      when: not r_manifest.stat.exists

    # -------------------------------------------------------------------------
    # Step 8: Sign the project with ansible-sign (re-sign is safe — overwrites .sig)
    # -------------------------------------------------------------------------
    - name: Run ansible-sign project gpg-sign
      ansible.builtin.shell: |
        ansible-sign project gpg-sign {{ _project_dir }}
      register: r_sign
      changed_when: "'GPG signing successful' in r_sign.stdout"
      ignore_errors: true

    # -------------------------------------------------------------------------
    # Step 9: Stage .ansible-sign/ + MANIFEST.in and push to Gitea
    # Uses credentials embedded in the remote URL for non-interactive push.
    # -------------------------------------------------------------------------
    - name: Configure Gitea remote URL with embedded credentials
      ansible.builtin.shell: |
        cd {{ _project_dir }}
        git remote set-url origin {{ _gitea_url | regex_replace('^(https?://)', '\1' + _gitea_username + ':' + _gitea_password + '@') }}/{{ _gitea_username }}/{{ _gitea_project }}.git
      no_log: true
      ignore_errors: true

    - name: Stage .ansible-sign/ and MANIFEST.in
      ansible.builtin.shell: |
        cd {{ _project_dir }}
        git add .ansible-sign/ MANIFEST.in
      register: r_git_add
      changed_when: false
      ignore_errors: true

    - name: Commit signed content (skip if nothing to commit)
      ansible.builtin.shell: |
        cd {{ _project_dir }}
        git diff --cached --quiet && echo "nothing-to-commit" || git commit -m "Adding signatures for project"
      register: r_git_commit
      changed_when: "'nothing-to-commit' not in r_git_commit.stdout"
      ignore_errors: true

    - name: Push signed content to Gitea
      ansible.builtin.shell: |
        cd {{ _project_dir }}
        git push origin HEAD
      register: r_git_push
      changed_when: false
      ignore_errors: true

    # -------------------------------------------------------------------------
    # Step 10: Slurp signing_demo.asc for use in AAP API calls
    # -------------------------------------------------------------------------
    - name: Read signing_demo.asc content
      ansible.builtin.slurp:
        src: "{{ _signing_asc }}"
      register: r_signing_asc
      ignore_errors: true

    - name: Set GPG public key fact
      ansible.builtin.set_fact:
        _gpg_pub_key: "{{ r_signing_asc.content | b64decode }}"
      when: r_signing_asc.content is defined

    # -------------------------------------------------------------------------
    # Step 11: Create AAP GPG credential "ansible-sign-cred" (idempotent)
    # Credential type: GPG Public Key (type ID = numeric; query first)
    # -------------------------------------------------------------------------
    - name: Get GPG Public Key credential type ID
      ansible.builtin.uri:
        url: "{{ _aap_api }}/credential_types/?name=GPG+Public+Key"
        method: GET
        user: "{{ _ctrl_user }}"
        password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_gpg_cred_type
      ignore_errors: true
      delegate_to: localhost

    - name: Set GPG credential type ID fact
      ansible.builtin.set_fact:
        _gpg_cred_type_id: "{{ (r_gpg_cred_type.json.results | first).id }}"
      when:
        - r_gpg_cred_type.json is defined
        - r_gpg_cred_type.json.results | length > 0

    - name: Check if ansible-sign-cred already exists
      ansible.builtin.uri:
        url: "{{ _aap_api }}/credentials/?name=ansible-sign-cred"
        method: GET
        user: "{{ _ctrl_user }}"
        password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_cred_check
      ignore_errors: true
      delegate_to: localhost

    - name: Create GPG credential "ansible-sign-cred"
      ansible.builtin.uri:
        url: "{{ _aap_api }}/credentials/"
        method: POST
        user: "{{ _ctrl_user }}"
        password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          name: "ansible-sign-cred"
          organization: 1
          credential_type: "{{ _gpg_cred_type_id | int }}"
          inputs:
            gpg_public_key: "{{ _gpg_pub_key }}"
        timeout: 30
        status_code: [200, 201]
      when:
        - _gpg_cred_type_id is defined
        - _gpg_pub_key is defined
        - r_cred_check.json is defined
        - r_cred_check.json.count | int == 0
      register: r_cred_create
      ignore_errors: true
      delegate_to: localhost

    # -------------------------------------------------------------------------
    # Step 12: Create AAP SCM credential "gitea-cred" (idempotent)
    # -------------------------------------------------------------------------
    - name: Get Source Control credential type ID
      ansible.builtin.uri:
        url: "{{ _aap_api }}/credential_types/?name=Source+Control"
        method: GET
        user: "{{ _ctrl_user }}"
        password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_scm_cred_type
      ignore_errors: true
      delegate_to: localhost

    - name: Set SCM credential type ID fact
      ansible.builtin.set_fact:
        _scm_cred_type_id: "{{ (r_scm_cred_type.json.results | first).id }}"
      when:
        - r_scm_cred_type.json is defined
        - r_scm_cred_type.json.results | length > 0

    - name: Check if gitea-cred already exists
      ansible.builtin.uri:
        url: "{{ _aap_api }}/credentials/?name=gitea-cred"
        method: GET
        user: "{{ _ctrl_user }}"
        password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_gitea_cred_check
      ignore_errors: true
      delegate_to: localhost

    - name: Create SCM credential "gitea-cred"
      ansible.builtin.uri:
        url: "{{ _aap_api }}/credentials/"
        method: POST
        user: "{{ _ctrl_user }}"
        password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          name: "gitea-cred"
          organization: 1
          credential_type: "{{ _scm_cred_type_id | int }}"
          inputs:
            username: "{{ _gitea_username }}"
            password: "{{ _gitea_password }}"
        timeout: 30
        status_code: [200, 201]
      when:
        - _scm_cred_type_id is defined
        - r_gitea_cred_check.json is defined
        - r_gitea_cred_check.json.count | int == 0
      register: r_gitea_cred_create
      ignore_errors: true
      delegate_to: localhost

    # -------------------------------------------------------------------------
    # Step 13: Create AAP project "Signed Project" with signature validation
    # Gather credential IDs first (may have just been created above)
    # -------------------------------------------------------------------------
    - name: Fetch ansible-sign-cred ID
      ansible.builtin.uri:
        url: "{{ _aap_api }}/credentials/?name=ansible-sign-cred"
        method: GET
        user: "{{ _ctrl_user }}"
        password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_asc_cred
      ignore_errors: true
      delegate_to: localhost

    - name: Set ansible-sign-cred ID fact
      ansible.builtin.set_fact:
        _asc_cred_id: "{{ (r_asc_cred.json.results | first).id }}"
      when:
        - r_asc_cred.json is defined
        - r_asc_cred.json.results | length > 0

    - name: Fetch gitea-cred ID
      ansible.builtin.uri:
        url: "{{ _aap_api }}/credentials/?name=gitea-cred"
        method: GET
        user: "{{ _ctrl_user }}"
        password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_gitea_cred
      ignore_errors: true
      delegate_to: localhost

    - name: Set gitea-cred ID fact
      ansible.builtin.set_fact:
        _gitea_cred_id: "{{ (r_gitea_cred.json.results | first).id }}"
      when:
        - r_gitea_cred.json is defined
        - r_gitea_cred.json.results | length > 0

    - name: Check if "Signed Project" already exists
      ansible.builtin.uri:
        url: "{{ _aap_api }}/projects/?name=Signed+Project"
        method: GET
        user: "{{ _ctrl_user }}"
        password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_proj_check
      ignore_errors: true
      delegate_to: localhost

    - name: Create project "Signed Project" with signature validation
      ansible.builtin.uri:
        url: "{{ _aap_api }}/projects/"
        method: POST
        user: "{{ _ctrl_user }}"
        password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          name: "Signed Project"
          organization: 1
          scm_type: "git"
          scm_url: "{{ _gitea_url }}/{{ _gitea_username }}/{{ _gitea_project }}.git"
          credential: "{{ _gitea_cred_id | int }}"
          signature_validation_credential: "{{ _asc_cred_id | int }}"
        timeout: 30
        status_code: [200, 201]
      when:
        - _asc_cred_id is defined
        - _gitea_cred_id is defined
        - r_proj_check.json is defined
        - r_proj_check.json.count | int == 0
      register: r_proj_create
      ignore_errors: true
      delegate_to: localhost

    # -------------------------------------------------------------------------
    # Step 14: Wait for the initial project sync to succeed
    # Creating a project triggers an automatic first sync in AAP.
    # Poll the project status until it reaches "successful" or 120 s timeout.
    # -------------------------------------------------------------------------
    - name: Fetch "Signed Project" current status
      ansible.builtin.uri:
        url: "{{ _aap_api }}/projects/?name=Signed+Project"
        method: GET
        user: "{{ _ctrl_user }}"
        password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_proj_status
      until: >-
        r_proj_status.json is defined
        and r_proj_status.json.results | length > 0
        and (r_proj_status.json.results | first).status in ['successful', 'failed', 'canceled']
      retries: 24
      delay: 5
      ignore_errors: true
      delegate_to: localhost

    - name: Set initial sync status fact
      ansible.builtin.set_fact:
        _initial_sync_ok: >-
          {{
            r_proj_status.json is defined
            and r_proj_status.json.results | length > 0
            and (r_proj_status.json.results | first).status == 'successful'
          }}

    - name: Set project ID fact
      ansible.builtin.set_fact:
        _project_id: "{{ (r_proj_status.json.results | first).id }}"
      when:
        - r_proj_status.json is defined
        - r_proj_status.json.results | length > 0

    # -------------------------------------------------------------------------
    # Step 15: Tamper with apache_install.yml (append a comment — idempotent)
    # -------------------------------------------------------------------------
    - name: Check if tamper comment already added to apache_install.yml
      ansible.builtin.shell: |
        grep -q '# TAMPERED: supply chain check' {{ _project_dir }}/apache_install.yml \
          && echo exists || echo missing
      register: r_tamper_check
      changed_when: false
      ignore_errors: true

    - name: Append tamper comment to apache_install.yml
      ansible.builtin.lineinfile:
        path: "{{ _project_dir }}/apache_install.yml"
        line: "# TAMPERED: supply chain check"
        insertafter: EOF
      when: r_tamper_check.stdout | trim == 'missing'

    # -------------------------------------------------------------------------
    # Step 16: Commit and push the tampered file
    # -------------------------------------------------------------------------
    - name: Stage tampered apache_install.yml
      ansible.builtin.shell: |
        cd {{ _project_dir }}
        git add apache_install.yml
      changed_when: false
      ignore_errors: true

    - name: Commit tampered file (skip if nothing to commit)
      ansible.builtin.shell: |
        cd {{ _project_dir }}
        git diff --cached --quiet && echo "nothing-to-commit" || git commit -m "Changing file"
      register: r_tamper_commit
      changed_when: "'nothing-to-commit' not in r_tamper_commit.stdout"
      ignore_errors: true

    - name: Push tampered file to Gitea
      ansible.builtin.shell: |
        cd {{ _project_dir }}
        git push origin HEAD
      changed_when: false
      ignore_errors: true

    # -------------------------------------------------------------------------
    # Step 17: Trigger a fresh sync of "Signed Project" to detect the tamper
    # -------------------------------------------------------------------------
    - name: Trigger "Signed Project" sync
      ansible.builtin.uri:
        url: "{{ _aap_api }}/projects/{{ _project_id }}/update/"
        method: POST
        user: "{{ _ctrl_user }}"
        password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200, 201, 202]
      when: _project_id is defined
      register: r_sync_trigger
      ignore_errors: true
      delegate_to: localhost

    # -------------------------------------------------------------------------
    # Step 18: Wait for the tamper sync to complete (expect failure)
    # -------------------------------------------------------------------------
    - name: Wait for "Signed Project" sync to finish
      ansible.builtin.uri:
        url: "{{ _aap_api }}/projects/{{ _project_id }}/"
        method: GET
        user: "{{ _ctrl_user }}"
        password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_tamper_sync
      until: >-
        r_tamper_sync.json is defined
        and r_tamper_sync.json.status in ['successful', 'failed', 'canceled']
      retries: 24
      delay: 5
      when: _project_id is defined
      ignore_errors: true
      delegate_to: localhost

    - name: Set tamper sync failed fact
      ansible.builtin.set_fact:
        _tamper_sync_failed: >-
          {{
            r_tamper_sync.json is defined
            and r_tamper_sync.json.status == 'failed'
          }}
      when: _project_id is defined

    # -------------------------------------------------------------------------
    # Verification checks for the final report
    # -------------------------------------------------------------------------
    - name: Verify VerySecure GPG key exists in keyring
      ansible.builtin.shell: |
        gpg --list-keys 2>/dev/null | grep -q 'VerySecure' && echo exists || echo missing
      register: r_gpg_verify
      changed_when: false
      ignore_errors: true

    - name: Set GPG key exists fact
      ansible.builtin.set_fact:
        _gpg_key_ok: "{{ (r_gpg_verify.stdout | trim) == 'exists' }}"

    - name: Verify signing_demo.asc exists and contains PGP block
      ansible.builtin.shell: |
        test -f {{ _signing_asc }} \
          && grep -q 'BEGIN PGP PUBLIC KEY BLOCK' {{ _signing_asc }} \
          && echo ok || echo missing
      register: r_asc_verify
      changed_when: false
      ignore_errors: true

    - name: Set signing_demo.asc exists fact
      ansible.builtin.set_fact:
        _asc_ok: "{{ (r_asc_verify.stdout | trim) == 'ok' }}"

    - name: Verify ansible-sign is installed
      ansible.builtin.shell: |
        rpm -q ansible-sign > /dev/null 2>&1 && echo installed || echo missing
      register: r_ansiblesign_verify
      changed_when: false
      ignore_errors: true

    - name: Set ansible-sign installed fact
      ansible.builtin.set_fact:
        _ansiblesign_ok: "{{ (r_ansiblesign_verify.stdout | trim) == 'installed' }}"

    - name: Verify MANIFEST.in exists in project root
      ansible.builtin.stat:
        path: "{{ _project_dir }}/MANIFEST.in"
      register: r_manifest_verify

    - name: Set MANIFEST.in exists fact
      ansible.builtin.set_fact:
        _manifest_ok: "{{ r_manifest_verify.stat.exists }}"

    - name: Verify .ansible-sign/sha256sum.txt exists
      ansible.builtin.stat:
        path: "{{ _project_dir }}/.ansible-sign/sha256sum.txt"
      register: r_sha256_verify

    - name: Set sha256sum.txt exists fact
      ansible.builtin.set_fact:
        _sha256_ok: "{{ r_sha256_verify.stat.exists }}"

    - name: Verify .ansible-sign/sha256sum.txt.sig exists
      ansible.builtin.stat:
        path: "{{ _project_dir }}/.ansible-sign/sha256sum.txt.sig"
      register: r_sig_verify

    - name: Set sha256sum.txt.sig exists fact
      ansible.builtin.set_fact:
        _sig_ok: "{{ r_sig_verify.stat.exists }}"

    - name: Verify signed commit is in Gitea (contains .ansible-sign path)
      ansible.builtin.shell: |
        cd {{ _project_dir }}
        git log --oneline --name-only --diff-filter=A HEAD~5..HEAD 2>/dev/null \
          | grep -q '\.ansible-sign' && echo pushed || echo missing
      register: r_git_pushed_verify
      changed_when: false
      ignore_errors: true

    - name: Set signed commit pushed fact
      ansible.builtin.set_fact:
        _git_signed_pushed_ok: "{{ (r_git_pushed_verify.stdout | trim) == 'pushed' }}"

    - name: Verify tamper commit is in Gitea (apache_install.yml changed)
      ansible.builtin.shell: |
        cd {{ _project_dir }}
        git log --oneline HEAD~3..HEAD 2>/dev/null \
          | grep -q 'Changing file' && echo pushed || echo missing
      register: r_tamper_pushed_verify
      changed_when: false
      ignore_errors: true

    - name: Set tamper commit pushed fact
      ansible.builtin.set_fact:
        _tamper_pushed_ok: "{{ (r_tamper_pushed_verify.stdout | trim) == 'pushed' }}"

    # -------------------------------------------------------------------------
    # Report
    # -------------------------------------------------------------------------
    - name: Report solve status
      ansible.builtin.debug:
        msg: |
          GPG key VerySecure <student@localhost> in keyring:   {{ 'ok' if _gpg_key_ok else 'NOT ok' }}
          ~/signing_demo.asc exists with PGP PUBLIC KEY BLOCK: {{ 'ok' if _asc_ok else 'NOT ok' }}
          ansible-sign installed:                               {{ 'ok' if _ansiblesign_ok else 'NOT ok' }}
          MANIFEST.in in project root:                          {{ 'ok' if _manifest_ok else 'NOT ok' }}
          .ansible-sign/sha256sum.txt exists:                   {{ 'ok' if _sha256_ok else 'NOT ok' }}
          .ansible-sign/sha256sum.txt.sig exists:               {{ 'ok' if _sig_ok else 'NOT ok' }}
          signed commit pushed to Gitea:                        {{ 'ok' if _git_signed_pushed_ok else 'NOT ok' }}
          initial project sync succeeded:                       {{ 'ok' if _initial_sync_ok else 'NOT ok' }}
          tamper commit pushed to Gitea:                        {{ 'ok' if _tamper_pushed_ok else 'NOT ok' }}
          tamper sync failed (Checksum mismatch expected):      {{ 'ok' if _tamper_sync_failed | default(false) else 'NOT ok (sync may still be running — validate again)' }}
