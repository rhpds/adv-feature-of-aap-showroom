---
# Module 07 Validate — Secure the Automation Supply Chain
#
# What this playbook checks (all durable outcomes):
#   Task 1:  ~/playbooks-adv-controller directory exists on bastion
#   Task 2:  GPG key for "VerySecure <student@localhost>" in bastion gpg keyring
#   Task 3:  ~/signing_demo.asc exists and contains "BEGIN PGP PUBLIC KEY BLOCK"
#   Task 4:  ansible-sign package installed on bastion (rpm -q)
#   Task 5:  MANIFEST.in exists in project root
#   Task 6:  .ansible-sign/sha256sum.txt exists in project root
#   Task 7:  .ansible-sign/sha256sum.txt.sig exists in project root
#   Task 8:  AAP credential "ansible-sign-cred" of type GPG Public Key exists
#   Task 9:  AAP credential "gitea-cred" of type Source Control exists
#   Task 10: AAP project "Signed Project" exists with signature_validation_credential set
#   Task 11: "Signed Project" has at least one successful sync (pre-tamper)
#   Task 12: Most recent sync of "Signed Project" is failed with "Checksum mismatch" (tamper test)

# ---------------------------------------------------------------------------
# Play 1: Register bastion in in-memory inventory
# ---------------------------------------------------------------------------
- name: Module 07 Validate — Bastion checks
  hosts: bastions
  gather_facts: false
  vars:
    _ssh_user: "{{ lookup('ansible.builtin.env', 'SSH_USERNAME') }}"
    project_dir: "/home/{{ _ssh_user }}/playbooks-adv-controller"
    signing_asc: "/home/{{ _ssh_user }}/signing_demo.asc"

  tasks:

    # -------------------------------------------------------
    # Check 1 — ~/playbooks-adv-controller directory exists
    # -------------------------------------------------------
    - name: Check playbooks-adv-controller directory exists on bastion
      ansible.builtin.shell: |
        test -d {{ project_dir }} && echo exists || echo missing
      register: r_projdir
      changed_when: false
      ignore_errors: true

    # -------------------------------------------------------
    # Check 2 — GPG key for VerySecure <student@localhost>
    # -------------------------------------------------------
    - name: Check VerySecure GPG key exists in bastion keyring
      ansible.builtin.shell: |
        gpg --list-keys 2>/dev/null | grep -q 'VerySecure' && echo exists || echo missing
      register: r_gpg_key
      changed_when: false
      ignore_errors: true

    # -------------------------------------------------------
    # Check 3 — ~/signing_demo.asc contains PGP header
    # -------------------------------------------------------
    - name: Check signing_demo.asc exists with PGP PUBLIC KEY BLOCK
      ansible.builtin.shell: |
        test -f {{ signing_asc }} \
          && grep -q 'BEGIN PGP PUBLIC KEY BLOCK' {{ signing_asc }} \
          && echo ok || echo missing
      register: r_asc
      changed_when: false
      ignore_errors: true

    # -------------------------------------------------------
    # Check 4 — ansible-sign rpm installed
    # -------------------------------------------------------
    - name: Check ansible-sign is installed via rpm
      ansible.builtin.shell: |
        rpm -q ansible-sign > /dev/null 2>&1 && echo installed || echo missing
      register: r_ansiblesign
      changed_when: false
      ignore_errors: true

    # -------------------------------------------------------
    # Check 5 — MANIFEST.in in project root
    # -------------------------------------------------------
    - name: Check MANIFEST.in exists in project root
      ansible.builtin.stat:
        path: "{{ project_dir }}/MANIFEST.in"
      register: r_manifest
      ignore_errors: true

    # -------------------------------------------------------
    # Check 6 — .ansible-sign/sha256sum.txt exists
    # -------------------------------------------------------
    - name: Check .ansible-sign/sha256sum.txt exists
      ansible.builtin.stat:
        path: "{{ project_dir }}/.ansible-sign/sha256sum.txt"
      register: r_sha256
      ignore_errors: true

    # -------------------------------------------------------
    # Check 7 — .ansible-sign/sha256sum.txt.sig exists
    # -------------------------------------------------------
    - name: Check .ansible-sign/sha256sum.txt.sig exists
      ansible.builtin.stat:
        path: "{{ project_dir }}/.ansible-sign/sha256sum.txt.sig"
      register: r_sig
      ignore_errors: true

    # -------------------------------------------------------
    # Persist bastion results as hostvars for Play 3
    # -------------------------------------------------------
    - name: Set bastion check facts
      ansible.builtin.set_fact:
        _projdir_ok: "{{ (r_projdir.stdout | default('') | trim) == 'exists' }}"
        _gpg_key_ok: "{{ (r_gpg_key.stdout | default('') | trim) == 'exists' }}"
        _asc_ok: "{{ (r_asc.stdout | default('') | trim) == 'ok' }}"
        _ansiblesign_ok: "{{ (r_ansiblesign.stdout | default('') | trim) == 'installed' }}"
        _manifest_ok: "{{ r_manifest.stat.exists | default(false) }}"
        _sha256_ok: "{{ r_sha256.stat.exists | default(false) }}"
        _sig_ok: "{{ r_sig.stat.exists | default(false) }}"

# ---------------------------------------------------------------------------
# Play 3: AAP REST API checks from localhost
# ---------------------------------------------------------------------------
- name: Module 07 Validate — AAP API checks
  hosts: bastions
  gather_facts: false
  vars:
    student_user: "{{ user | default('') }}"
    _controller_url: "{{ lookup('ansible.builtin.env', 'CONTROLLER_URL') }}"
    _controller_user: "{{ lookup('ansible.builtin.env', 'CONTROLLER_USERNAME') }}"
    _controller_pass: "{{ lookup('ansible.builtin.env', 'CONTROLLER_PASSWORD') }}"
    aap_api: "{{ _controller_url }}/api/controller/v2"

  tasks:

    # -------------------------------------------------------
    # Pull bastion facts into localhost play
    # -------------------------------------------------------
    - name: Pull bastion check facts into localhost play
      ansible.builtin.set_fact:
        _projdir_ok: "{{ _projdir_ok | default(false) }}"
        _gpg_key_ok: "{{ _gpg_key_ok | default(false) }}"
        _asc_ok: "{{ _asc_ok | default(false) }}"
        _ansiblesign_ok: "{{ _ansiblesign_ok | default(false) }}"
        _manifest_ok: "{{ _manifest_ok | default(false) }}"
        _sha256_ok: "{{ _sha256_ok | default(false) }}"
        _sig_ok: "{{ _sig_ok | default(false) }}"

    # -------------------------------------------------------
    # Check 8 — ansible-sign-cred exists (GPG Public Key type)
    # -------------------------------------------------------
    - name: Resolve GPG Public Key credential type ID
      ansible.builtin.uri:
        url: "{{ aap_api }}/credential_types/?name=GPG+Public+Key"
        method: GET
        user: "{{ _controller_user }}"
        password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 10
        status_code: [200]
        return_content: true
      register: r_gpg_type
      ignore_errors: true

    - name: Query ansible-sign-cred from AAP
      ansible.builtin.uri:
        url: "{{ aap_api }}/credentials/?name=ansible-sign-cred"
        method: GET
        user: "{{ _controller_user }}"
        password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 10
        status_code: [200]
        return_content: true
      register: r_asc_cred
      ignore_errors: true

    - name: Evaluate ansible-sign-cred presence and type
      ansible.builtin.set_fact:
        _gpg_type_id: >-
          {{
            ((r_gpg_type.json.results | default([]) | first).id | default('')) | string
            if r_gpg_type.json is defined and (r_gpg_type.json.results | default([])) | length > 0
            else ''
          }}
        _asc_cred_ok: >-
          {{
            r_asc_cred.json is defined
            and r_asc_cred.json.count | default(0) | int > 0
            and (r_gpg_type.json is defined and (r_gpg_type.json.results | default([])) | length > 0)
            and ((r_asc_cred.json.results | first).credential_type | default('') | string)
               == (((r_gpg_type.json.results | default([]) | first).id | default('')) | string)
          }}

    # -------------------------------------------------------
    # Check 9 — gitea-cred exists (Source Control type)
    # -------------------------------------------------------
    - name: Resolve Source Control credential type ID
      ansible.builtin.uri:
        url: "{{ aap_api }}/credential_types/?name=Source+Control"
        method: GET
        user: "{{ _controller_user }}"
        password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 10
        status_code: [200]
        return_content: true
      register: r_scm_type
      ignore_errors: true

    - name: Query gitea-cred from AAP
      ansible.builtin.uri:
        url: "{{ aap_api }}/credentials/?name=gitea-cred"
        method: GET
        user: "{{ _controller_user }}"
        password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 10
        status_code: [200]
        return_content: true
      register: r_gitea_cred
      ignore_errors: true

    - name: Evaluate gitea-cred presence and type
      ansible.builtin.set_fact:
        _gitea_cred_ok: >-
          {{
            r_gitea_cred.json is defined
            and r_gitea_cred.json.count | default(0) | int > 0
            and (r_scm_type.json is defined and (r_scm_type.json.results | default([])) | length > 0)
            and ((r_gitea_cred.json.results | first).credential_type | default('') | string)
               == (((r_scm_type.json.results | default([]) | first).id | default('')) | string)
          }}

    # -------------------------------------------------------
    # Check 10 — "Signed Project" exists with signature_validation_credential set
    # -------------------------------------------------------
    - name: Query "Signed Project" from AAP
      ansible.builtin.uri:
        url: "{{ aap_api }}/projects/?name=Signed+Project"
        method: GET
        user: "{{ _controller_user }}"
        password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 10
        status_code: [200]
        return_content: true
      register: r_project
      ignore_errors: true

    - name: Set project existence and signature validation fact
      ansible.builtin.set_fact:
        _project_id: >-
          {{
            ((r_project.json.results | default([]) | first).id | default('')) | string
            if r_project.json is defined and r_project.json.count | default(0) | int > 0
            else ''
          }}
        _project_ok: >-
          {{
            r_project.json is defined
            and r_project.json.count | default(0) | int > 0
            and (r_project.json.results | default([]) | first).signature_validation_credential is not none
            and ((r_project.json.results | default([]) | first).signature_validation_credential | default('') | string) | length > 0
          }}

    # -------------------------------------------------------
    # Check 11 + 12 — Sync history:
    #   ANY successful sync must exist (pre-tamper)
    #   Most recent sync must be failed with "Checksum mismatch"
    # -------------------------------------------------------
    - name: Fetch recent project_updates for "Signed Project"
      ansible.builtin.uri:
        url: "{{ aap_api }}/projects/{{ _project_id }}/project_updates/?order_by=-id&page_size=10"
        method: GET
        user: "{{ _controller_user }}"
        password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 10
        status_code: [200]
        return_content: true
      register: r_updates
      when: _project_id | string | length > 0
      ignore_errors: true

    - name: Set empty updates list when project was not found
      ansible.builtin.set_fact:
        _updates_list: []
      when: _project_id | string | length == 0

    - name: Set updates list from API response
      ansible.builtin.set_fact:
        _updates_list: "{{ r_updates.json.results | default([]) }}"
      when:
        - _project_id | string | length > 0
        - r_updates is not skipped
        - r_updates is not failed
        - r_updates.json is defined

    - name: Evaluate initial successful sync exists (any, not max)
      ansible.builtin.set_fact:
        _initial_sync_ok: >-
          {{
            _updates_list | selectattr('status', 'equalto', 'successful') | list | length > 0
          }}

    - name: Evaluate most recent sync is failed (tamper detected)
      ansible.builtin.set_fact:
        _tamper_sync_failed: >-
          {{
            _updates_list | length > 0
            and (_updates_list | first).status == 'failed'
          }}

    - name: Derive failed job ID for stdout check
      ansible.builtin.set_fact:
        _failed_job_id: >-
          {{
            ((_updates_list | first).id | default('')) | string
            if (_updates_list | length > 0 and (_updates_list | first).status == 'failed')
            else ''
          }}

    # -------------------------------------------------------
    # Check 12b — Confirm "Checksum mismatch" in failed job output
    # -------------------------------------------------------
    - name: Fetch failed sync job stdout
      ansible.builtin.uri:
        url: "{{ aap_api }}/project_updates/{{ _failed_job_id }}/stdout/?format=txt"
        method: GET
        user: "{{ _controller_user }}"
        password: "{{ _controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 15
        status_code: [200]
        return_content: true
      register: r_failed_stdout
      when: _failed_job_id | string | length > 0
      ignore_errors: true

    - name: Evaluate "Checksum mismatch" present in failed sync output
      ansible.builtin.set_fact:
        _checksum_mismatch_ok: >-
          {{
            r_failed_stdout is not skipped
            and r_failed_stdout is not failed
            and r_failed_stdout.content is defined
            and 'Checksum mismatch' in r_failed_stdout.content
          }}
      when: _failed_job_id | string | length > 0

    - name: Default checksum mismatch fact when no failed job found
      ansible.builtin.set_fact:
        _checksum_mismatch_ok: false
      when: _failed_job_id | string | length == 0

    # -------------------------------------------------------
    # Build final task result booleans
    # -------------------------------------------------------
    - name: Build task results
      ansible.builtin.set_fact:
        _task1_ok: "{{ _projdir_ok | bool }}"
        _task2_ok: "{{ _gpg_key_ok | bool }}"
        _task3_ok: "{{ _asc_ok | bool }}"
        _task4_ok: "{{ _ansiblesign_ok | bool }}"
        _task5_ok: "{{ _manifest_ok | bool }}"
        _task6_ok: "{{ _sha256_ok | bool }}"
        _task7_ok: "{{ _sig_ok | bool }}"
        _task8_ok: "{{ _asc_cred_ok | bool }}"
        _task9_ok: "{{ _gitea_cred_ok | bool }}"
        _task10_ok: "{{ _project_ok | bool }}"
        _task11_ok: "{{ _initial_sync_ok | bool }}"
        _task12_ok: "{{ _tamper_sync_failed | bool and _checksum_mismatch_ok | bool }}"

    # -------------------------------------------------------
    # Validate all tasks
    # -------------------------------------------------------
    - name: Validate all tasks
      validation_check:
        check: >-
          {{
            _task1_ok and _task2_ok and _task3_ok and _task4_ok
            and _task5_ok and _task6_ok and _task7_ok and _task8_ok
            and _task9_ok and _task10_ok and _task11_ok and _task12_ok
          }}
        pass_msg: |
          Task 1:  playbooks-adv-controller directory exists on bastion
          Task 2:  GPG key VerySecure <student@localhost> present in keyring
          Task 3:  ~/signing_demo.asc exists with PGP PUBLIC KEY BLOCK
          Task 4:  ansible-sign package is installed
          Task 5:  MANIFEST.in exists in project root
          Task 6:  .ansible-sign/sha256sum.txt exists
          Task 7:  .ansible-sign/sha256sum.txt.sig exists
          Task 8:  AAP credential ansible-sign-cred (GPG Public Key) exists
          Task 9:  AAP credential gitea-cred (Source Control) exists
          Task 10: AAP project Signed Project exists with signature validation credential
          Task 11: Signed Project had a successful sync before tamper
          Task 12: Most recent sync of Signed Project failed with Checksum mismatch
        error_msg: |
          {{ '  OK' if _task1_ok else 'FAIL' }} Task 1:  playbooks-adv-controller on bastion — {{ 'present' if _task1_ok else 'MISSING — clone the repo: git clone <gitea_url> ~/playbooks-adv-controller' }}
          {{ '  OK' if _task2_ok else 'FAIL' }} Task 2:  GPG key VerySecure <student@localhost> — {{ 'present' if _task2_ok else 'MISSING — run: gpg --batch --gen-key ~/gpg_params.txt' }}
          {{ '  OK' if _task3_ok else 'FAIL' }} Task 3:  ~/signing_demo.asc with PGP header — {{ 'present' if _task3_ok else 'MISSING — run: gpg --output ~/signing_demo.asc --armor --export student@localhost' }}
          {{ '  OK' if _task4_ok else 'FAIL' }} Task 4:  ansible-sign installed — {{ 'installed' if _task4_ok else 'MISSING — run: sudo dnf install -y ansible-sign' }}
          {{ '  OK' if _task5_ok else 'FAIL' }} Task 5:  MANIFEST.in in project root — {{ 'present' if _task5_ok else 'MISSING — create MANIFEST.in in ~/playbooks-adv-controller/ as shown in the lab' }}
          {{ '  OK' if _task6_ok else 'FAIL' }} Task 6:  .ansible-sign/sha256sum.txt — {{ 'present' if _task6_ok else 'MISSING — run: ansible-sign project gpg-sign ~/playbooks-adv-controller' }}
          {{ '  OK' if _task7_ok else 'FAIL' }} Task 7:  .ansible-sign/sha256sum.txt.sig — {{ 'present' if _task7_ok else 'MISSING — run: ansible-sign project gpg-sign ~/playbooks-adv-controller' }}
          {{ '  OK' if _task8_ok else 'FAIL' }} Task 8:  ansible-sign-cred (GPG Public Key) in AAP — {{ 'found' if _task8_ok else 'MISSING — create a GPG Public Key credential named ansible-sign-cred in AAP' }}
          {{ '  OK' if _task9_ok else 'FAIL' }} Task 9:  gitea-cred (Source Control) in AAP — {{ 'found' if _task9_ok else 'MISSING — create a Source Control credential named gitea-cred in AAP' }}
          {{ '  OK' if _task10_ok else 'FAIL' }} Task 10: Signed Project with signature validation — {{ 'configured' if _task10_ok else 'MISSING — create project Signed Project and set the signature validation credential to ansible-sign-cred' }}
          {{ '  OK' if _task11_ok else 'FAIL' }} Task 11: Signed Project successful sync — {{ 'found' if _task11_ok else 'MISSING — trigger a project sync and wait for it to succeed before tampering' }}
          {{ '  OK' if _task12_ok else 'FAIL' }} Task 12: Tamper sync failed with Checksum mismatch — {{ 'confirmed' if _task12_ok else 'MISSING — edit apache_install.yml, commit+push to Gitea, then trigger another project sync' }}
