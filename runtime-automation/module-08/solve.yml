---
# Module 08 Solve — The new Self-Service Automation Portal (SSAP)
#
# What this playbook automates:
#   prose-01: Verify AAP OAuth app "Selfservice-*" exists (api — informational)
#   prose-02: Create AAP team "aap-admins" in org Default (api)
#   prose-03: SSAP OAuth sign-in — SKIP (browser OAuth consent, cannot automate)
#   prose-04: SSAP RBAC create role "ssap_operators" — SKIP (no SSAP REST API documented)
#   prose-05a: PATCH "Demo Job Template" description in AAP (api)
#   prose-05b: SSAP "Sync now" — SKIP (no SSAP REST API documented)
#   prose-06: Exploratory job run — SKIP
#   prose-07: Import custom SSAP template from Gitea URL (ui-playwright)
#   prose-08: Launch custom template — SKIP (exploratory)

- name: Module 08 Solve — Self-Service Automation Portal
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    controller_url: "{{ controller_url | default('') }}"
    controller_username: "{{ controller_username | default('') }}"
    controller_password: "{{ controller_password | default('') }}"
    ssap_url: "{{ ssap_url | default('') }}"
    gitea_url: "{{ gitea_url | default('') }}"
    gitea_username: "{{ gitea_username | default('') }}"
    common_password: "{{ common_password | default('') }}"
    # AAP API base (strips trailing slash if present)
    aap_api: "{{ controller_url | regex_replace('/$', '') }}/api/v2"

  tasks:

    # -------------------------------------------------------------------------
    # prose-01: Verify AAP OAuth app "Selfservice-*" exists
    # GET /api/v2/o/applications/?name__startswith=Selfservice
    # -------------------------------------------------------------------------
    - name: Query AAP OAuth applications named Selfservice-*
      ansible.builtin.uri:
        url: "{{ aap_api }}/o/applications/?name__startswith=Selfservice"
        method: GET
        user: "{{ controller_username }}"
        password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
      register: r_oauth_apps
      ignore_errors: true

    - name: Set OAuth app found fact
      ansible.builtin.set_fact:
        _oauth_app_ok: >-
          {{
            r_oauth_apps.status | default(0) == 200
            and (r_oauth_apps.json.count | default(0) | int) > 0
          }}

    # -------------------------------------------------------------------------
    # prose-02: Create AAP team "aap-admins" in org Default
    # Idempotent: query first, create only if absent
    # -------------------------------------------------------------------------
    - name: Query for org Default ID
      ansible.builtin.uri:
        url: "{{ aap_api }}/organizations/?name=Default"
        method: GET
        user: "{{ controller_username }}"
        password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
      register: r_org
      ignore_errors: true

    - name: Set Default org ID fact
      ansible.builtin.set_fact:
        _default_org_id: "{{ (r_org.json.results | default([]) | first).id | default(omit) }}"
      when: r_org.json.count | default(0) | int > 0

    - name: Check if team aap-admins already exists
      ansible.builtin.uri:
        url: "{{ aap_api }}/teams/?name=aap-admins"
        method: GET
        user: "{{ controller_username }}"
        password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
      register: r_team_check
      ignore_errors: true

    - name: Create team aap-admins in org Default
      ansible.builtin.uri:
        url: "{{ aap_api }}/teams/"
        method: POST
        user: "{{ controller_username }}"
        password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        body_format: json
        body:
          name: "aap-admins"
          organization: "{{ _default_org_id }}"
        status_code: [200, 201]
      register: r_team_create
      ignore_errors: true
      when:
        - _default_org_id is defined
        - r_team_check.json.count | default(0) | int == 0

    - name: Set team created/exists fact
      ansible.builtin.set_fact:
        _team_ok: >-
          {{
            (r_team_check.json.count | default(0) | int > 0)
            or (r_team_create.status | default(0) in [200, 201])
          }}

    # -------------------------------------------------------------------------
    # prose-03: SSAP OAuth sign-in — SKIP
    # Cannot automate OAuth consent flow (browser redirect chain + Authorize button)
    # -------------------------------------------------------------------------
    # SKIP: prose-03 — SSAP OAuth sign-in
    # Student step: Open ssap_url → Sign In → log in with AAP credentials → click Authorize
    # Not automatable: OAuth consent requires interactive browser session; no headless workaround.

    # -------------------------------------------------------------------------
    # prose-04: SSAP RBAC create role "ssap_operators" — SKIP
    # No SSAP REST API documented for role management; Backstage RBAC plugin
    # requires authenticated session token obtained only after OAuth flow.
    # -------------------------------------------------------------------------
    # SKIP: prose-04 — SSAP RBAC create ssap_operators role
    # Student step: Administration → RBAC → Create → name ssap_operators →
    #               AAP Administrators group → Catalog + Scaffolder plugins + all perms → Create
    # Not automatable: No SSAP REST API for role management; requires authenticated session from OAuth flow.

    # -------------------------------------------------------------------------
    # prose-05a: PATCH "Demo Job Template" description in AAP
    # -------------------------------------------------------------------------
    - name: Query Demo Job Template ID
      ansible.builtin.uri:
        url: "{{ aap_api }}/job_templates/?name=Demo+Job+Template"
        method: GET
        user: "{{ controller_username }}"
        password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
      register: r_demo_jt
      ignore_errors: true

    - name: Set Demo Job Template ID fact
      ansible.builtin.set_fact:
        _demo_jt_id: "{{ (r_demo_jt.json.results | default([]) | first).id | default('') }}"
      when: r_demo_jt.json.count | default(0) | int > 0

    - name: Patch Demo Job Template description to "Say hello to the world"
      ansible.builtin.uri:
        url: "{{ aap_api }}/job_templates/{{ _demo_jt_id }}/"
        method: PATCH
        user: "{{ controller_username }}"
        password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        body_format: json
        body:
          description: "Say hello to the world"
        status_code: [200]
      register: r_patch_jt
      ignore_errors: true
      when: _demo_jt_id | default('') | length > 0

    - name: Set Demo JT patched fact
      ansible.builtin.set_fact:
        _demo_jt_patched: >-
          {{
            _demo_jt_id | default('') | length > 0
            and r_patch_jt.status | default(0) == 200
            and (r_patch_jt.json.description | default('')) == 'Say hello to the world'
          }}

    # -------------------------------------------------------------------------
    # prose-05b: SSAP "Sync now" → Job templates — SKIP
    # No SSAP REST API documented for triggering catalog sync.
    # -------------------------------------------------------------------------
    # SKIP: prose-05b — SSAP Sync now
    # Student step: In SSAP click "Sync now" → select Job templates → Ok → refresh page
    # Not automatable: No SSAP REST API for catalog sync; requires authenticated SSAP session.

    # -------------------------------------------------------------------------
    # prose-06: Execute job template — SKIP (exploratory, no validation target)
    # -------------------------------------------------------------------------
    # SKIP: prose-06 — Run Demo Job Template in SSAP
    # Student step: Click Start → optionally Cancel → observe Show Logs → Start Over
    # Not automatable: Exploratory step, no persistent outcome to check.

    # -------------------------------------------------------------------------
    # prose-07: Import custom template from Gitea URL (ui-playwright)
    # SSAP Add Template → paste URL → Analyze → Import
    # -------------------------------------------------------------------------
    - name: Create evidence directory
      ansible.builtin.file:
        path: /tmp/evidence
        state: directory
        mode: "0755"
      ignore_errors: true

    - name: "prose-07: Import custom SSAP template from Gitea via Playwright"
      ansible.builtin.command:
        argv:
          - node
          - -e
          - |
            const {chromium} = require('playwright');
            (async () => {
              const templateUrl = `{{ gitea_url }}/{{ gitea_username }}/ssap-customtemplates/raw/branch/main/rhel_dynamic.yml`;
              const ssapUrl = `{{ ssap_url }}`;

              const b = await chromium.launch({
                headless: true,
                args: ['--no-sandbox', '--disable-dev-shm-usage', '--disable-setuid-sandbox']
              });
              const ctx = await b.newContext({ignoreHTTPSErrors: true});
              const p = await ctx.newPage();

              // INTENT: Navigate to SSAP, sign in with AAP credentials, and import the Gitea custom template

              // Step 1: Navigate to SSAP and sign in
              console.log('Navigating to SSAP:', ssapUrl);
              await p.goto(ssapUrl, {waitUntil: 'domcontentloaded', timeout: 60000});
              await p.screenshot({path: '/tmp/evidence/step-07-01-ssap-loaded.png'});

              // Click Sign In
              const signInBtn = p.getByRole('button', {name: /sign in/i});
              if (await signInBtn.isVisible({timeout: 10000}).catch(() => false)) {
                await signInBtn.click();
                console.log('Clicked Sign In');
              } else {
                console.log('Sign In button not visible — may already be logged in');
              }

              // AAP login form (if redirected)
              await p.waitForTimeout(3000);
              await p.screenshot({path: '/tmp/evidence/step-07-02-after-signin-click.png'});

              const usernameInput = p.locator('input[name="username"], input[id="id_username"], input[type="text"]').first();
              if (await usernameInput.isVisible({timeout: 8000}).catch(() => false)) {
                await usernameInput.fill(`{{ controller_username }}`);
                const passwordInput = p.locator('input[name="password"], input[id="id_password"], input[type="password"]').first();
                await passwordInput.fill(`{{ controller_password }}`);
                await p.getByRole('button', {name: /log in|sign in|next/i}).first().click();
                console.log('Submitted AAP login credentials');
                await p.waitForTimeout(3000);
              }

              // Authorize page
              await p.screenshot({path: '/tmp/evidence/step-07-03-after-aap-login.png'});
              const authorizeBtn = p.getByRole('button', {name: /authorize/i});
              if (await authorizeBtn.isVisible({timeout: 8000}).catch(() => false)) {
                await authorizeBtn.click();
                console.log('Clicked Authorize');
                await p.waitForTimeout(3000);
              }

              // Step 2: Navigate to SSAP and click Add Template
              await p.waitForTimeout(2000);
              await p.screenshot({path: '/tmp/evidence/step-07-04-ssap-home.png'});

              // Look for Add Template button
              const addTemplateBtn = p.getByRole('button', {name: /add template/i});
              await addTemplateBtn.waitFor({timeout: 15000});
              await addTemplateBtn.click();
              console.log('Clicked Add Template');
              await p.waitForTimeout(2000);
              await p.screenshot({path: '/tmp/evidence/step-07-05-add-template-dialog.png'});

              // Step 3: Paste the Gitea URL
              const urlInput = p.locator('input[placeholder*="URL"], input[type="url"], input[type="text"]').first();
              await urlInput.waitFor({timeout: 10000});
              await urlInput.fill(templateUrl);
              console.log('Pasted template URL:', templateUrl);
              await p.screenshot({path: '/tmp/evidence/step-07-06-url-pasted.png'});

              // Step 4: Click Analyze
              await p.getByRole('button', {name: /analyze/i}).click();
              console.log('Clicked Analyze');
              await p.waitForTimeout(5000);
              await p.screenshot({path: '/tmp/evidence/step-07-07-after-analyze.png'});

              // Step 5: Click Import (on the Review step)
              const importBtn = p.getByRole('button', {name: /import/i});
              await importBtn.waitFor({timeout: 20000});
              await importBtn.click();
              console.log('Clicked Import');
              await p.waitForTimeout(5000);
              await p.screenshot({path: '/tmp/evidence/step-07-08-after-import.png'});

              // Step 6: Verify "Manage RHEL Time Servers" appears in the template list
              const templateEntry = p.getByText(/Manage RHEL Time Servers/i);
              const found = await templateEntry.isVisible({timeout: 15000}).catch(() => false);
              if (found) {
                console.log('SUCCESS: Custom template "Manage RHEL Time Servers" is visible in SSAP');
                await p.screenshot({path: '/tmp/evidence/step-07-09-template-imported.png'});
              } else {
                console.log('WARNING: Custom template not yet visible — may need a page refresh');
                await p.reload({waitUntil: 'domcontentloaded', timeout: 30000});
                await p.waitForTimeout(3000);
                const foundAfterRefresh = await p.getByText(/Manage RHEL Time Servers/i).isVisible({timeout: 10000}).catch(() => false);
                console.log(foundAfterRefresh ? 'SUCCESS after refresh' : 'NOT FOUND after refresh');
                await p.screenshot({path: '/tmp/evidence/step-07-10-after-refresh.png'});
              }

              await b.close();
            })().catch(async e => {
              const {chromium} = require('playwright');
              const b2 = await chromium.launch({headless: true, args: ['--no-sandbox']}).catch(() => null);
              if (b2) {
                const p2 = await b2.newContext({ignoreHTTPSErrors: true}).then(c => c.newPage());
                await p2.screenshot({path: '/tmp/playwright-debug.png'}).catch(() => {});
                await b2.close();
              }
              console.error('FAILED:', e.message);
              console.error('INTENT: Navigate to SSAP → sign in with AAP creds → click Add Template → paste Gitea URL → Analyze → Import → confirm Manage RHEL Time Servers appears');
              process.exit(1);
            });
      environment:
        PLAYWRIGHT_BROWSERS_PATH: /app/.playwright
      register: r_playwright_import
      ignore_errors: true
      when: ssap_url | length > 0 and gitea_url | length > 0

    - name: Set custom template import fact
      ansible.builtin.set_fact:
        _custom_template_imported: >-
          {{
            r_playwright_import.rc | default(1) == 0
            and 'SUCCESS' in (r_playwright_import.stdout | default(''))
          }}

    # -------------------------------------------------------------------------
    # prose-08: Launch custom template — SKIP (exploratory)
    # -------------------------------------------------------------------------
    # SKIP: prose-08 — Launch the custom dynamic template
    # Student step: Start → examine options → Enable Show Advanced Options → Next → Create
    # Not automatable: Exploratory step with no persistent outcome to validate.

    # -------------------------------------------------------------------------
    # Verify SSAP is reachable (HTTP 200) — baseline check
    # -------------------------------------------------------------------------
    - name: Check SSAP is reachable (HTTP 200)
      ansible.builtin.uri:
        url: "{{ ssap_url }}"
        method: GET
        validate_certs: false
        timeout: 15
        status_code: [200, 302]
      register: r_ssap_reachable
      ignore_errors: true
      when: ssap_url | length > 0

    - name: Set SSAP reachable fact
      ansible.builtin.set_fact:
        _ssap_reachable: "{{ r_ssap_reachable.status | default(0) in [200, 302] }}"

    # -------------------------------------------------------------------------
    # Final verify — Demo Job Template description (re-read to confirm patch)
    # -------------------------------------------------------------------------
    - name: Re-read Demo Job Template description to confirm patch
      ansible.builtin.uri:
        url: "{{ aap_api }}/job_templates/{{ _demo_jt_id }}/"
        method: GET
        user: "{{ controller_username }}"
        password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
      register: r_jt_verify
      ignore_errors: true
      when: _demo_jt_id | default('') | length > 0

    - name: Set Demo JT description verified fact
      ansible.builtin.set_fact:
        _demo_jt_desc_ok: >-
          {{
            (r_jt_verify.json.description | default('')) == 'Say hello to the world'
          }}
      when: _demo_jt_id | default('') | length > 0

    # -------------------------------------------------------------------------
    # Report solve status
    # -------------------------------------------------------------------------
    - name: Report solve status
      ansible.builtin.debug:
        msg: |
          AAP OAuth app Selfservice-* found:                {{ 'ok' if _oauth_app_ok else 'NOT ok' }}
          AAP team aap-admins created in org Default:       {{ 'ok' if _team_ok | default(false) else 'NOT ok' }}
          SSAP accessible (HTTP 200/302):                   {{ 'ok' if _ssap_reachable | default(false) else 'NOT ok' }}
          Demo Job Template description set:                {{ 'ok' if _demo_jt_desc_ok | default(false) else 'NOT ok — expected "Say hello to the world"' }}
          Custom template imported (Manage RHEL Time Servers): {{ 'ok' if _custom_template_imported | default(false) else 'NOT ok — check /tmp/evidence/ screenshots' }}

          SKIPPED (no API / non-automatable):
            prose-03: SSAP OAuth sign-in (browser OAuth consent)
            prose-04: SSAP RBAC role ssap_operators (no SSAP REST API)
            prose-05b: SSAP Sync now (no SSAP REST API)
            prose-06: Run Demo Job Template in SSAP (exploratory)
            prose-08: Launch custom dynamic template (exploratory)

          Evidence screenshots saved to: /tmp/evidence/
