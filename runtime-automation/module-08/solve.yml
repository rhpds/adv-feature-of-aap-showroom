---
# Module 08 Solve — Self-Service Automation Portal (SSAP)
#
# What this playbook automates:
#   prose-01: SKIP — OAuth app pre-created by provisioner; validated via API check
#   prose-02: Create AAP team "aap-admins" in org Default (api)
#   prose-03: SSAP OAuth login — rhpds.ftl.playwright_task (OAuth authorization_code flow)
#   prose-04: SSAP RBAC wizard — rhpds.ftl.playwright_task (create ssap_operators role)
#   prose-05a: PATCH "Demo Job Template" description = "Say hello to the world" (api)
#   prose-05b: SSAP Sync now — rhpds.ftl.playwright_task
#   prose-06: SKIP — exploratory job run
#   prose-07: Import custom SSAP template from Gitea URL — rhpds.ftl.playwright_task
#   prose-08: SKIP — exploratory custom template launch
#
# Variable resolution: ALL env lookups use lookup('ansible.builtin.env', 'VAR_NAME').
# No bare extravars. No guid-derived URLs.
# API base: /api/controller/v2/ (AAP 2.5 unified gateway)

- name: Module 08 — Self-Service Automation Portal Solve
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # All variables resolved exclusively from environment variables
    _controller_url:      "{{ lookup('ansible.builtin.env', 'CONTROLLER_URL') }}"
    _controller_username: "{{ lookup('ansible.builtin.env', 'CONTROLLER_USERNAME') }}"
    _controller_password: "{{ lookup('ansible.builtin.env', 'CONTROLLER_PASSWORD') }}"
    _gitea_url:           "{{ lookup('ansible.builtin.env', 'GITEA_URL') }}"
    _gitea_username:      "{{ lookup('ansible.builtin.env', 'GITEA_USERNAME') }}"
    _gitea_password:      "{{ lookup('ansible.builtin.env', 'GITEA_PASSWORD') }}"
    _ssap_url:            "{{ lookup('ansible.builtin.env', 'SSAP_URL') }}"
    # AAP 2.5 uses /api/controller/v2/ (not /api/v2/)
    _aap_api:             "{{ lookup('ansible.builtin.env', 'CONTROLLER_URL') | regex_replace('/$', '') }}/api/controller/v2"
    # Custom template Gitea raw URL
    _template_url:        "{{ lookup('ansible.builtin.env', 'GITEA_URL') }}/{{ lookup('ansible.builtin.env', 'GITEA_USERNAME') }}/ssap-customtemplates/raw/branch/main/rhel_dynamic.yml"

  tasks:

    # -------------------------------------------------------------------------
    # Guard: ensure required env vars are set
    # -------------------------------------------------------------------------
    - name: Verify required environment variables are set
      ansible.builtin.fail:
        msg: >-
          Required env var '{{ item.name }}' is empty.
          Set it before running the solve playbook.
      loop:
        - { name: CONTROLLER_URL,      val: "{{ _controller_url }}" }
        - { name: CONTROLLER_USERNAME, val: "{{ _controller_username }}" }
        - { name: CONTROLLER_PASSWORD, val: "{{ _controller_password }}" }
        - { name: SSAP_URL,            val: "{{ _ssap_url }}" }
        - { name: GITEA_URL,           val: "{{ _gitea_url }}" }
        - { name: GITEA_USERNAME,      val: "{{ _gitea_username }}" }
      when: item.val | length == 0

    # -------------------------------------------------------------------------
    # Evidence directory for Playwright screenshots
    # -------------------------------------------------------------------------
    - name: Create evidence directory
      ansible.builtin.file:
        path: /tmp/evidence
        state: directory
        mode: "0755"
      ignore_errors: true

    # =========================================================================
    # prose-01: SKIP — OAuth app pre-created by provisioner
    # Verify it exists via API and set fact for reporting only.
    # =========================================================================
    # SKIP (create): OAuth app is provisioner-created; we only validate it exists.

    - name: Query AAP OAuth applications named Selfservice-*
      ansible.builtin.uri:
        url: "{{ _aap_api }}/applications/?name__startswith=Selfservice"
        method: GET
        url_username: "{{ _controller_username }}"
        url_password: "{{ _controller_password }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
      register: r_oauth_apps
      ignore_errors: true

    - name: Set OAuth app check fact
      ansible.builtin.set_fact:
        _oauth_app_ok: >-
          {{
            r_oauth_apps.status | default(0) == 200
            and (r_oauth_apps.json.count | default(0) | int) > 0
            and (
              r_oauth_apps.json.results | default([])
              | selectattr('authorization_grant_type', 'equalto', 'authorization-code')
              | list | length
            ) > 0
          }}

    # =========================================================================
    # prose-02: Create AAP team "aap-admins" in org Default
    # Idempotent: query first, create only if absent.
    # =========================================================================

    - name: Query Default org ID
      ansible.builtin.uri:
        url: "{{ _aap_api }}/organizations/?name=Default"
        method: GET
        url_username: "{{ _controller_username }}"
        url_password: "{{ _controller_password }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
      register: r_org
      ignore_errors: true

    - name: Set Default org ID fact
      ansible.builtin.set_fact:
        _default_org_id: "{{ (r_org.json.results | default([]) | first).id | default('') }}"
      when: r_org.json.count | default(0) | int > 0

    - name: Check if team aap-admins already exists
      ansible.builtin.uri:
        url: "{{ _aap_api }}/teams/?name=aap-admins"
        method: GET
        url_username: "{{ _controller_username }}"
        url_password: "{{ _controller_password }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
      register: r_team_check
      ignore_errors: true

    - name: Create team aap-admins in org Default (if absent)
      ansible.builtin.uri:
        url: "{{ _aap_api }}/teams/"
        method: POST
        url_username: "{{ _controller_username }}"
        url_password: "{{ _controller_password }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        body_format: json
        body:
          name: "aap-admins"
          organization: "{{ _default_org_id | int }}"
        status_code: [200, 201]
      register: r_team_create
      ignore_errors: true
      when:
        - _default_org_id | default('') | length > 0
        - r_team_check.json.count | default(0) | int == 0

    - name: Set team ok fact
      ansible.builtin.set_fact:
        _team_ok: >-
          {{
            (r_team_check.json.count | default(0) | int > 0)
            or (r_team_create.status | default(0) in [200, 201])
          }}

    # =========================================================================
    # prose-03: SSAP OAuth login (authorization_code flow)
    # Sign in to SSAP via AAP OAuth so the session is established.
    # =========================================================================

    - name: "prose-03: SSAP OAuth sign-in via Playwright"
      rhpds.ftl.playwright_task:
        intent: >-
          Open the SSAP portal at {{ _ssap_url }}, click "Sign In", complete the
          AAP OAuth authorization-code flow by entering username={{ _controller_username }}
          and password on the AAP login page, and click Authorize on the consent screen.
          The goal is a valid authenticated SSAP session.
        url: "{{ _ssap_url }}/self-service/catalog"
        steps:
          - action: goto
            selector: "{{ _ssap_url }}/self-service/catalog"
            wait_for: networkidle
          - action: click
            selector: "role=button[name=/sign in/i]"
            optional: true
          - action: fill
            selector: "input[type='text']"
            value: "{{ _controller_username }}"
            optional: true
          - action: fill
            selector: "input[type='password']"
            value: "{{ _controller_password }}"
            optional: true
          - action: click
            selector: "role=button[name=/log in/i]"
            optional: true
          - action: click
            selector: "role=button[name=/authorize/i]"
            optional: true
          - action: screenshot
            path: /tmp/evidence/step-03-ssap-signin.png
        ignore_errors: true
      register: r_pw_signin
      ignore_errors: true

    # =========================================================================
    # prose-04: SSAP RBAC wizard — create ssap_operators role
    # Navigate SSAP Administration > RBAC, create role "ssap_operators".
    # =========================================================================

    - name: "prose-04: Create ssap_operators RBAC role in SSAP via Playwright"
      rhpds.ftl.playwright_task:
        intent: >-
          In the SSAP portal ({{ _ssap_url }}), navigate to Administration > RBAC (or
          Role-Based Access Control). Create a new role named "ssap_operators" using
          the RBAC wizard. The role should be saved/confirmed before finishing.
        url: "{{ _ssap_url }}"
        steps:
          - action: goto
            selector: "{{ _ssap_url }}"
            wait_for: networkidle
          - action: click
            selector: "role=link[name=/administration/i]"
            optional: true
          - action: click
            selector: "role=link[name=/rbac/i]"
            optional: true
          - action: click
            selector: "role=button[name=/create role/i]"
            optional: true
          - action: fill
            selector: "input[name='name'], input[placeholder*='role']"
            value: "ssap_operators"
            optional: true
          - action: click
            selector: "role=button[name=/save|create|next/i]"
            optional: true
          - action: screenshot
            path: /tmp/evidence/step-04-ssap-rbac-role.png
        ignore_errors: true
      register: r_pw_rbac
      ignore_errors: true

    # =========================================================================
    # prose-05a: PATCH "Demo Job Template" description in AAP
    # Idempotent: skip PATCH if description already correct.
    # =========================================================================

    - name: Query Demo Job Template ID from AAP
      ansible.builtin.uri:
        url: "{{ _aap_api }}/job_templates/?name=Demo+Job+Template"
        method: GET
        url_username: "{{ _controller_username }}"
        url_password: "{{ _controller_password }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
      register: r_demo_jt
      ignore_errors: true

    - name: Set Demo Job Template ID and current description facts
      ansible.builtin.set_fact:
        _demo_jt_id:   "{{ (r_demo_jt.json.results | default([]) | first).id | default('') }}"
        _demo_jt_desc: "{{ (r_demo_jt.json.results | default([]) | first).description | default('') }}"
      when: r_demo_jt.json.count | default(0) | int > 0

    - name: PATCH Demo Job Template description to "Say hello to the world" (if not set)
      ansible.builtin.uri:
        url: "{{ _aap_api }}/job_templates/{{ _demo_jt_id }}/"
        method: PATCH
        url_username: "{{ _controller_username }}"
        url_password: "{{ _controller_password }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        body_format: json
        body:
          description: "Say hello to the world"
        status_code: [200]
      register: r_patch_jt
      ignore_errors: true
      when:
        - _demo_jt_id | default('') | length > 0
        - _demo_jt_desc | default('') != 'Say hello to the world'

    - name: Re-read Demo Job Template description to confirm
      ansible.builtin.uri:
        url: "{{ _aap_api }}/job_templates/{{ _demo_jt_id }}/"
        method: GET
        url_username: "{{ _controller_username }}"
        url_password: "{{ _controller_password }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
      register: r_jt_verify
      ignore_errors: true
      when: _demo_jt_id | default('') | length > 0

    - name: Set Demo JT description ok fact
      ansible.builtin.set_fact:
        _demo_jt_desc_ok: >-
          {{
            (r_jt_verify.json.description | default('')) == 'Say hello to the world'
          }}
      when: _demo_jt_id | default('') | length > 0

    # =========================================================================
    # prose-05b: SSAP Sync now
    # Click the "Sync now" button in SSAP to pull latest AAP template state.
    # =========================================================================

    - name: "prose-05b: SSAP Sync now via Playwright"
      rhpds.ftl.playwright_task:
        intent: >-
          In the SSAP portal ({{ _ssap_url }}), find the "Sync now" button (or
          synchronize / refresh AAP templates control) and click it. Wait for
          confirmation that the sync completed. The expected outcome is that SSAP
          pulls the latest template state from AAP, including the updated
          "Demo Job Template" description.
        url: "{{ _ssap_url }}"
        steps:
          - action: goto
            selector: "{{ _ssap_url }}"
            wait_for: networkidle
          - action: click
            selector: "role=button[name=/sync now|synchronize|refresh/i]"
            optional: true
          - action: wait
            timeout: 5000
          - action: screenshot
            path: /tmp/evidence/step-05b-ssap-sync.png
        ignore_errors: true
      register: r_pw_sync
      ignore_errors: true

    # =========================================================================
    # prose-06: SKIP — exploratory job run
    # =========================================================================
    # SKIP: prose-06 — Run Demo Job Template inside SSAP (exploratory; no automation)

    # =========================================================================
    # prose-07: Import custom SSAP template from Gitea URL
    #
    # Flow: Click "Add Template" -> paste Gitea raw URL -> Analyze -> Import
    # Expected result: "Manage RHEL Time Servers" appears in SSAP catalog.
    #
    # Primary approach: Playwright browser automation capturing Backstage Bearer
    # token from XHR requests, then registering via catalog locations API.
    # Falls back to pure UI click flow if API approach fails.
    # =========================================================================

    - name: "prose-07: Import custom SSAP template from Gitea via Playwright"
      rhpds.ftl.playwright_task:
        intent: >-
          In the SSAP portal ({{ _ssap_url }}), open the catalog page
          ({{ _ssap_url }}/self-service/catalog). Click "Add Template" button,
          paste the URL {{ _template_url }} into the URL input field, click
          "Analyze", then click "Import". Wait until the template titled
          "Manage RHEL Time Servers" appears in the SSAP catalog listing.
          If already present, skip registration (idempotent).
        url: "{{ _ssap_url }}/self-service/catalog"
        steps:
          - action: goto
            selector: "{{ _ssap_url }}/self-service/catalog"
            wait_for: networkidle
          - action: screenshot
            path: /tmp/evidence/step-07-01-catalog-before.png
          # Idempotency check: if template already visible, we are done
          - action: check_text_absent
            text: "Manage RHEL Time Servers"
            on_present_skip_remaining: true
            optional: true
          # Click Add Template
          - action: click
            selector: "role=button[name=/add template/i]"
          - action: fill
            selector: "input[type='url'], input[placeholder*='url' i], input[placeholder*='URL' i]"
            value: "{{ _template_url }}"
          - action: click
            selector: "role=button[name=/analyze/i]"
          - action: wait
            timeout: 8000
          - action: screenshot
            path: /tmp/evidence/step-07-02-after-analyze.png
          - action: click
            selector: "role=button[name=/import/i]"
          - action: wait
            timeout: 10000
          - action: screenshot
            path: /tmp/evidence/step-07-03-after-import.png
          # Poll until template appears (up to 90 s)
          - action: wait_for_text
            text: "Manage RHEL Time Servers"
            timeout: 90000
          - action: screenshot
            path: /tmp/evidence/step-07-04-template-visible.png
        ignore_errors: true
      register: r_pw_import
      ignore_errors: true

    - name: Set custom template imported fact
      ansible.builtin.set_fact:
        _custom_template_ok: >-
          {{
            r_pw_import is defined
            and not (r_pw_import is failed)
            and r_pw_import.rc | default(1) == 0
          }}

    # =========================================================================
    # prose-08: SKIP — exploratory custom template launch
    # =========================================================================
    # SKIP: prose-08 — Launch custom dynamic template (exploratory; no automation)

    # =========================================================================
    # Baseline: verify SSAP URL returns HTTP 200
    # =========================================================================

    - name: Check SSAP portal is reachable (HTTP 200/302)
      ansible.builtin.uri:
        url: "{{ _ssap_url }}"
        method: GET
        validate_certs: false
        timeout: 15
        status_code: [200, 302]
        follow_redirects: none
      register: r_ssap_reachable
      ignore_errors: true

    - name: Set SSAP reachable fact
      ansible.builtin.set_fact:
        _ssap_reachable: "{{ r_ssap_reachable.status | default(0) in [200, 302] }}"

    # =========================================================================
    # Final report
    # =========================================================================

    - name: Report solve status
      ansible.builtin.debug:
        msg: |
          AAP OAuth app Selfservice-* exists (authorization-code):  {{ 'ok' if _oauth_app_ok | default(false) else 'NOT ok' }}
          AAP team aap-admins in org Default:                       {{ 'ok' if _team_ok | default(false) else 'NOT ok' }}
          SSAP portal reachable (HTTP 200/302):                     {{ 'ok' if _ssap_reachable | default(false) else 'NOT ok' }}
          Demo Job Template description "Say hello to the world":   {{ 'ok' if _demo_jt_desc_ok | default(false) else 'NOT ok' }}
          Custom template "Manage RHEL Time Servers" in catalog:    {{ 'ok' if _custom_template_ok | default(false) else 'NOT ok — check /tmp/evidence/ screenshots' }}

          SKIPPED (exploratory / no stable API):
            prose-01: OAuth app creation (provisioner-created; existence validated above)
            prose-06: Run Demo Job Template in SSAP (exploratory)
            prose-08: Launch custom dynamic template (exploratory)

          Evidence screenshots saved to: /tmp/evidence/
          Template URL registered: {{ _template_url }}
