---
# Module 08 Validate — Self-Service Automation Portal (SSAP)
#
# What this playbook verifies:
#   task-01: AAP OAuth app "Selfservice-*" exists with
#            authorization_grant_type=authorization-code, client_type=confidential
#   task-02: AAP team "aap-admins" exists in org Default
#   task-03: SSAP portal is accessible (HTTP 200 or 302)
#   task-04: AAP "Demo Job Template" description == "Say hello to the world"
#   task-05: SSAP catalog contains "Manage RHEL Time Servers" template
#            (verified via rhpds.ftl.playwright_task — Backstage catalog requires auth)
#
# Variable resolution: ALL env lookups use lookup('ansible.builtin.env', 'VAR_NAME').
# No bare extravars. No guid-derived URLs.
# API base: /api/controller/v2/ (AAP 2.5 unified gateway)

- name: Module 08 Validation — Self-Service Automation Portal
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    student_user:         "{{ user | default('') }}"
    _controller_url:      "{{ lookup('ansible.builtin.env', 'CONTROLLER_URL') }}"
    _controller_username: "{{ lookup('ansible.builtin.env', 'CONTROLLER_USERNAME') }}"
    _controller_password: "{{ lookup('ansible.builtin.env', 'CONTROLLER_PASSWORD') }}"
    _ssap_url:            "{{ lookup('ansible.builtin.env', 'SSAP_URL') }}"
    _aap_api:             "{{ lookup('ansible.builtin.env', 'CONTROLLER_URL') | regex_replace('/$', '') }}/api/controller/v2"

  tasks:

    # -------------------------------------------------------
    # Check 1 — AAP OAuth app "Selfservice-*" exists with
    #            authorization_grant_type=authorization-code
    #            and client_type=confidential in org Default
    # -------------------------------------------------------
    - name: Query AAP OAuth applications named Selfservice-*
      ansible.builtin.uri:
        url: "{{ _aap_api }}/applications/?name__startswith=Selfservice"
        method: GET
        url_username: "{{ _controller_username }}"
        url_password: "{{ _controller_password }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 10
        status_code: [200]
      register: r_oauth_apps
      ignore_errors: true

    - name: Set OAuth app check fact
      ansible.builtin.set_fact:
        _task1_ok: >-
          {{
            r_oauth_apps.status | default(0) == 200
            and (r_oauth_apps.json.count | default(0) | int) > 0
            and (
              r_oauth_apps.json.results
              | default([])
              | selectattr('authorization_grant_type', 'equalto', 'authorization-code')
              | selectattr('client_type', 'equalto', 'confidential')
              | list
              | length
            ) > 0
          }}

    # -------------------------------------------------------
    # Check 2 — AAP team "aap-admins" exists in org Default
    # -------------------------------------------------------
    - name: Query org Default ID
      ansible.builtin.uri:
        url: "{{ _aap_api }}/organizations/?name=Default"
        method: GET
        url_username: "{{ _controller_username }}"
        url_password: "{{ _controller_password }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 10
        status_code: [200]
      register: r_org
      ignore_errors: true

    - name: Set Default org ID fact
      ansible.builtin.set_fact:
        _default_org_id: "{{ (r_org.json.results | default([]) | first).id | default(-1) }}"

    - name: Query AAP for team named aap-admins
      ansible.builtin.uri:
        url: "{{ _aap_api }}/teams/?name=aap-admins"
        method: GET
        url_username: "{{ _controller_username }}"
        url_password: "{{ _controller_password }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 10
        status_code: [200]
      register: r_team
      ignore_errors: true

    - name: Set team aap-admins check fact
      ansible.builtin.set_fact:
        _task2_ok: >-
          {{
            r_team.status | default(0) == 200
            and (r_team.json.count | default(0) | int) > 0
            and (
              r_team.json.results
              | default([])
              | selectattr('name', 'equalto', 'aap-admins')
              | selectattr('summary_fields.organization.id', 'equalto', _default_org_id | int)
              | list
              | length
            ) > 0
          }}

    # -------------------------------------------------------
    # Check 3 — SSAP portal is accessible (HTTP 200 or 302)
    # -------------------------------------------------------
    - name: Check SSAP portal is reachable
      ansible.builtin.uri:
        url: "{{ _ssap_url }}"
        method: GET
        validate_certs: false
        timeout: 10
        status_code: [200, 302]
        follow_redirects: none
      register: r_ssap
      ignore_errors: true

    - name: Set SSAP reachable fact
      ansible.builtin.set_fact:
        _task3_ok: "{{ r_ssap.status | default(0) in [200, 302] }}"

    # -------------------------------------------------------
    # Check 4 — AAP "Demo Job Template" description is
    #            "Say hello to the world"
    # -------------------------------------------------------
    - name: Query Demo Job Template from AAP
      ansible.builtin.uri:
        url: "{{ _aap_api }}/job_templates/?name=Demo+Job+Template"
        method: GET
        url_username: "{{ _controller_username }}"
        url_password: "{{ _controller_password }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 10
        status_code: [200]
      register: r_demo_jt
      ignore_errors: true

    - name: Set Demo Job Template description fact
      ansible.builtin.set_fact:
        _task4_ok: >-
          {{
            r_demo_jt.status | default(0) == 200
            and (r_demo_jt.json.count | default(0) | int) > 0
            and (
              r_demo_jt.json.results
              | default([])
              | map(attribute='description')
              | list
              | first
              | default('')
            ) == 'Say hello to the world'
          }}

    # -------------------------------------------------------
    # Check 5 — SSAP catalog contains "Manage RHEL Time Servers"
    # Uses rhpds.ftl.playwright_task to sign in via AAP OAuth
    # and verify the template is visible in the catalog.
    # -------------------------------------------------------
    - name: "Playwright — check SSAP catalog for Manage RHEL Time Servers template"
      rhpds.ftl.playwright_task:
        intent: >-
          Open the SSAP portal catalog at {{ _ssap_url }}/self-service/catalog.
          If a Sign In button is visible, click it and complete the AAP OAuth flow
          using username={{ _controller_username }} and the corresponding password.
          After authentication, confirm that a catalog card or item titled
          "Manage RHEL Time Servers" is visible on the page.
          Take a screenshot as evidence.
        url: "{{ _ssap_url }}/self-service/catalog"
        steps:
          - action: goto
            selector: "{{ _ssap_url }}/self-service/catalog"
            wait_for: networkidle
          - action: click
            selector: "role=button[name=/sign in/i]"
            optional: true
          - action: fill
            selector: "input[type='text']"
            value: "{{ _controller_username }}"
            optional: true
          - action: fill
            selector: "input[type='password']"
            value: "{{ _controller_password }}"
            optional: true
          - action: click
            selector: "role=button[name=/log in/i]"
            optional: true
          - action: click
            selector: "role=button[name=/authorize/i]"
            optional: true
          - action: wait
            timeout: 5000
          - action: wait_for_text
            text: "Manage RHEL Time Servers"
            timeout: 30000
          - action: screenshot
            path: /tmp/playwright-evidence-module08-catalog.png
      register: r_pw_catalog
      ignore_errors: true

    - name: Set SSAP catalog template check fact
      ansible.builtin.set_fact:
        _task5_ok: >-
          {{
            r_pw_catalog is defined
            and r_pw_catalog is not failed
            and r_pw_catalog is not skipped
            and r_pw_catalog.rc | default(1) == 0
          }}

    # -------------------------------------------------------
    # Build results and emit validation_check
    # -------------------------------------------------------
    - name: Build task result facts
      ansible.builtin.set_fact:
        _task1_ok: "{{ _task1_ok | default(false) }}"
        _task2_ok: "{{ _task2_ok | default(false) }}"
        _task3_ok: "{{ _task3_ok | default(false) }}"
        _task4_ok: "{{ _task4_ok | default(false) }}"
        _task5_ok: "{{ _task5_ok | default(false) }}"

    - name: Validate all tasks
      rhpds.ftl.validation_check:
        check: "{{ _task1_ok and _task2_ok and _task3_ok and _task4_ok and _task5_ok }}"
        pass_msg: |
          Task 1: AAP OAuth app Selfservice-* exists with authorization_grant_type=authorization-code and client_type=confidential
          Task 2: AAP team aap-admins exists in org Default
          Task 3: SSAP portal is accessible (HTTP 200/302)
          Task 4: Demo Job Template description is "Say hello to the world"
          Task 5: "Manage RHEL Time Servers" template is visible in the SSAP catalog
        error_msg: |
          {{ 'OK' if _task1_ok else 'FAILED' }} Task 1: AAP OAuth app Selfservice-* {{ 'found with correct grant type and client type' if _task1_ok else 'not found or missing authorization_grant_type=authorization-code / client_type=confidential — open AAP Access Management > OAuth Applications and confirm the Selfservice-* app exists with those settings' }}
          {{ 'OK' if _task2_ok else 'FAILED' }} Task 2: AAP team aap-admins {{ 'exists in org Default' if _task2_ok else 'missing from org Default — open AAP Access Management > Teams and create a team named aap-admins inside the Default organization' }}
          {{ 'OK' if _task3_ok else 'FAILED' }} Task 3: SSAP portal {{ 'is reachable' if _task3_ok else 'is not responding — verify the SSAP_URL environment variable is correct and the SSAP service is running' }}
          {{ 'OK' if _task4_ok else 'FAILED' }} Task 4: Demo Job Template description {{ 'is set correctly' if _task4_ok else 'is wrong or blank — open AAP > Automation Execution > Templates > Demo Job Template, set the Description field to "Say hello to the world" and save' }}
          {{ 'OK' if _task5_ok else 'FAILED' }} Task 5: "Manage RHEL Time Servers" template {{ 'is visible in the SSAP catalog' if _task5_ok else 'not found in SSAP catalog — open SSAP, click Add Template, paste the Gitea raw URL for rhel_dynamic.yml, click Analyze then Import' }}
