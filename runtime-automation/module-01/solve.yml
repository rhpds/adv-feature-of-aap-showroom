---
# Module 01 — Introduction to Unified UI
# Solve playbook
#
# What the student does in this module:
#   prose-01: Navigate to AAP login page at {{ controller_url }}
#   prose-02: Log in with {{ controller_username }} / {{ controller_password }}
#   prose-03/04/05: Read informational orientation content (skipped — no automatable action)
#
# Automation strategy:
#   - No VM-side state is created in this module (orientation only)
#   - "Navigate and log in" is replaced by two REST checks:
#       1. GET {{ controller_url }}                    → HTTP 200 (UI reachable)
#       2. GET {{ controller_url }}/api/gateway/v1/me/ → HTTP 200 with Basic Auth (credentials valid)
#          AAP 2.5 unified gateway API path (replaces legacy /api/v2/me/)
#   - Both checks run from localhost inside the runner container over HTTPS
#
# Variable resolution order:
#   controller_url      — extravar > CONTROLLER_URL env > derived from guid
#   controller_username — extravar > CONTROLLER_USERNAME env > bastion_user > 'lab-user'
#   controller_password — extravar > CONTROLLER_PASSWORD env > bastion_password

- name: Module 01 — Introduction to Unified UI Solve
  hosts: bastions
  gather_facts: false
  vars:
    # Required for connection: local inside runner container where ~lab-user does not exist
    # Derive controller URL — extravar > CONTROLLER_URL env > guid-based default
    _env_controller_url: "{{ lookup('env', 'CONTROLLER_URL') }}"
    _default_controller_url: "https://controller-{{ guid | default('') }}.apps.ocpvdev01.rhdp.net"
    aap_url: "{{ controller_url | default(_env_controller_url if _env_controller_url else _default_controller_url) }}"
    # Resolve username — extravar > CONTROLLER_USERNAME env > bastion_user > 'lab-user'
    _env_controller_username: "{{ lookup('env', 'CONTROLLER_USERNAME') }}"
    aap_user: "{{ controller_username | default(_env_controller_username if _env_controller_username else bastion_user | default('lab-user')) }}"
    # Resolve password — extravar > CONTROLLER_PASSWORD env > bastion_password
    _env_controller_password: "{{ lookup('env', 'CONTROLLER_PASSWORD') }}"
    aap_pass: "{{ controller_password | default(_env_controller_password if _env_controller_password else bastion_password | default('')) }}"

  tasks:

    # ------------------------------------------------------------------
    # Guard: nothing to do if we can't determine controller_url
    # ------------------------------------------------------------------
    - name: Fail early if controller_url cannot be determined
      ansible.builtin.fail:
        msg: "controller_url extravar is empty and guid is also empty — cannot derive AAP URL"
      when: aap_url | length == 0

    # ------------------------------------------------------------------
    # prose-01 — Check AAP login page is reachable (HTTP 200)
    # ------------------------------------------------------------------
    - name: Check AAP controller URL is reachable
      ansible.builtin.uri:
        url: "{{ aap_url }}"
        method: GET
        validate_certs: false
        timeout: 30
        status_code: [200]
        follow_redirects: all
      register: r_url_check
      ignore_errors: true

    - name: Record URL reachability result
      ansible.builtin.set_fact:
        _url_ok: "{{ r_url_check.status | default(0) == 200 }}"

    # ------------------------------------------------------------------
    # prose-02 — Verify login credentials via AAP 2.5 Gateway REST API
    #   GET /api/gateway/v1/me/ returns 200 + user data when Basic Auth is valid.
    #   Returns 401 on bad credentials.
    #   Note: AAP 2.5 unified UI uses /api/gateway/v1/ (not legacy /api/v2/)
    # ------------------------------------------------------------------
    - name: Verify AAP credentials via Gateway API (GET /api/gateway/v1/me/)
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/gateway/v1/me/"
        method: GET
        url_username: "{{ aap_user }}"
        url_password: "{{ aap_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
        return_content: true
      register: r_login_check
      ignore_errors: true

    - name: Record login result
      ansible.builtin.set_fact:
        _login_ok: "{{ r_login_check.status | default(0) == 200 }}"

    # ------------------------------------------------------------------
    # prose-03/04/05 — Informational orientation content
    # SKIP: No automatable action — student reads menu descriptions only
    # ------------------------------------------------------------------
    # prose-03: Overview / Dashboard read-through
    # prose-04: Menu items read-through (Automation Execution, Decisions, etc.)
    # prose-05: Responsive UI note
    # These produce no persistent state that can be checked.

    # ------------------------------------------------------------------
    # Report
    # ------------------------------------------------------------------
    - name: Report solve status
      ansible.builtin.debug:
        msg: |
          AAP controller URL : {{ aap_url }}
          AAP controller URL reachable : {{ 'ok' if _url_ok else 'NOT ok — ' ~ (r_url_check.msg | default('no response')) }}
          AAP credentials valid        : {{ 'ok' if _login_ok else 'NOT ok — check controller_username / controller_password extravars' }}
