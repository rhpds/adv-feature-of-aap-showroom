---
# Module 02 Validate — Configure resources with Ansible
#
# Checks:
#   task-1: ~/.ansible-navigator.yml exists on bastion with CONTROLLER_HOST
#   task-2: configure-controller.yml present in ~/playbooks-adv-controller/
#   task-3: AAP inventory exists (count > 0)
#   task-4: AAP hosts exist (count > 0)
#   task-5: AAP SSH credential exists
#   task-6: AAP projects exist (count > 0)
#   task-7: >= 3 successful SCM project sync jobs
#   task-8: AAP job templates exist (count > 0)
#
# All variables resolved from environment variables injected by the zt-runner.

# -------------------------------------------------------------------------
# Play 1 — Build dynamic bastion inventory from environment variables
# -------------------------------------------------------------------------
- name: Build bastion inventory
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_connection: local
    ansible_host: 127.0.0.1
    _ssh_host: "{{ lookup('ansible.builtin.env', 'SSH_HOSTNAME') }}"
    _ssh_port: "{{ lookup('ansible.builtin.env', 'SSH_PORT') | default('22') }}"
    _ssh_user: "{{ lookup('ansible.builtin.env', 'SSH_USERNAME') }}"
    _ssh_pass: "{{ lookup('ansible.builtin.env', 'SSH_PASSWORD') }}"

  tasks:

    - name: Add bastion to in-memory inventory
      ansible.builtin.add_host:
        name: bastion
        groups: bastion
        ansible_host: "{{ _ssh_host }}"
        ansible_port: "{{ _ssh_port | int }}"
        ansible_user: "{{ _ssh_user }}"
        ansible_password: "{{ _ssh_pass }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      when: _ssh_host | length > 0

# -------------------------------------------------------------------------
# Play 2 — Check bastion-side state
# -------------------------------------------------------------------------
- name: Module 02 Validate — Check bastion state
  hosts: bastion
  gather_facts: false
  vars:
    home_dir: "/home/{{ lookup('ansible.builtin.env', 'SSH_USERNAME') | default('lab-user') }}"
    navigator_cfg: "{{ home_dir }}/.ansible-navigator.yml"
    repo_dir: "{{ home_dir }}/playbooks-adv-controller"

  tasks:

    - name: Check ~/.ansible-navigator.yml exists
      ansible.builtin.stat:
        path: "{{ navigator_cfg }}"
      register: r_nav_cfg

    - name: Check CONTROLLER_HOST in ansible-navigator.yml
      ansible.builtin.shell: "grep -q 'CONTROLLER_HOST' {{ navigator_cfg }} && echo found || echo missing"
      register: r_ctrl_host
      changed_when: false
      ignore_errors: true
      when: r_nav_cfg.stat.exists | default(false)

    - name: Set nav config validation fact
      ansible.builtin.set_fact:
        _task1_ok: "{{ r_nav_cfg.stat.exists | default(false) and (r_ctrl_host.stdout | default('missing')) == 'found' }}"

    - name: Check configure-controller.yml present in repo
      ansible.builtin.stat:
        path: "{{ repo_dir }}/configure-controller.yml"
      register: r_playbook_file

    - name: Set playbook present fact
      ansible.builtin.set_fact:
        _task2_ok: "{{ r_playbook_file.stat.exists | default(false) }}"

    - name: Store bastion validation facts
      ansible.builtin.set_fact:
        _val_task1_ok: "{{ _task1_ok }}"
        _val_task2_ok: "{{ _task2_ok }}"

# -------------------------------------------------------------------------
# Play 3 — REST API checks (localhost)
# -------------------------------------------------------------------------
- name: Module 02 Validate — REST API checks
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_connection: local
    ansible_host: 127.0.0.1
    _ctrl_url: "{{ lookup('ansible.builtin.env', 'CONTROLLER_URL') }}"
    _ctrl_user: "{{ lookup('ansible.builtin.env', 'CONTROLLER_USERNAME') }}"
    _ctrl_pass: "{{ lookup('ansible.builtin.env', 'CONTROLLER_PASSWORD') }}"
    _api_base: "{{ lookup('ansible.builtin.env', 'CONTROLLER_URL') }}/api/controller/v2"
    _b: "{{ hostvars['bastion'] | default({}) }}"

  tasks:

    - name: Check AAP inventories exist
      ansible.builtin.uri:
        url: "{{ _api_base }}/inventories/?page_size=20"
        method: GET
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
      register: r_inventory
      ignore_errors: true

    - name: Validate inventory
      validation_check:
        check: "{{ (r_inventory.json.count | default(0)) > 0 }}"
        pass_msg: "Task 3: AAP inventory exists ({{ r_inventory.json.count | default(0) }} found)"
        error_msg: "Task 3: FAILED — No AAP inventory found — run configure-controller.yml first"

    - name: Check AAP hosts exist
      ansible.builtin.uri:
        url: "{{ _api_base }}/hosts/?page_size=20"
        method: GET
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
      register: r_hosts
      ignore_errors: true

    - name: Validate hosts
      validation_check:
        check: "{{ (r_hosts.json.count | default(0)) > 0 }}"
        pass_msg: "Task 4: AAP hosts exist ({{ r_hosts.json.count | default(0) }} found)"
        error_msg: "Task 4: FAILED — No AAP hosts found in inventory"

    - name: Check AAP SSH credentials exist
      ansible.builtin.uri:
        url: "{{ _api_base }}/credentials/?credential_type__namespace=ssh&page_size=20"
        method: GET
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
      register: r_creds
      ignore_errors: true

    - name: Validate SSH credential
      validation_check:
        check: "{{ (r_creds.json.count | default(0)) > 0 }}"
        pass_msg: "Task 5: SSH credential found ({{ r_creds.json.count | default(0) }} found)"
        error_msg: "Task 5: FAILED — No SSH machine credential found in AAP"

    - name: Check AAP projects exist
      ansible.builtin.uri:
        url: "{{ _api_base }}/projects/?page_size=20"
        method: GET
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
      register: r_projects
      ignore_errors: true

    - name: Validate projects
      validation_check:
        check: "{{ (r_projects.json.count | default(0)) > 0 }}"
        pass_msg: "Task 6: AAP projects exist ({{ r_projects.json.count | default(0) }} found)"
        error_msg: "Task 6: FAILED — No AAP projects found"

    - name: Check AAP SCM project sync jobs
      ansible.builtin.uri:
        url: "{{ _api_base }}/project_updates/?status=successful&page_size=20"
        method: GET
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
      register: r_scm
      ignore_errors: true

    - name: Validate SCM syncs
      validation_check:
        check: "{{ (r_scm.json.count | default(0)) >= 3 }}"
        pass_msg: "Task 7: SCM syncs OK ({{ r_scm.json.count | default(0) }} successful jobs found)"
        error_msg: "Task 7: FAILED — Need >= 3 successful SCM project sync jobs (found {{ r_scm.json.count | default(0) }})"

    - name: Check AAP job templates exist
      ansible.builtin.uri:
        url: "{{ _api_base }}/job_templates/?page_size=20"
        method: GET
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
      register: r_templates
      ignore_errors: true

    - name: Validate job templates
      validation_check:
        check: "{{ (r_templates.json.count | default(0)) > 0 }}"
        pass_msg: "Task 8: Job templates exist ({{ r_templates.json.count | default(0) }} found)"
        error_msg: "Task 8: FAILED — No job templates found in AAP"

    - name: Validate ansible-navigator.yml with CONTROLLER_HOST
      validation_check:
        check: "{{ _b._val_task1_ok | default(false) | bool }}"
        pass_msg: "Task 1: ~/.ansible-navigator.yml exists and contains CONTROLLER_HOST"
        error_msg: "Task 1: FAILED — ~/.ansible-navigator.yml missing or does not contain CONTROLLER_HOST"

    - name: Validate configure-controller.yml present
      validation_check:
        check: "{{ _b._val_task2_ok | default(false) | bool }}"
        pass_msg: "Task 2: ~/playbooks-adv-controller/configure-controller.yml found"
        error_msg: "Task 2: FAILED — ~/playbooks-adv-controller/configure-controller.yml not found — clone the repo first"
