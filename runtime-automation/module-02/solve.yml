---
# Module 02 Solve — Configure resources with Ansible
#
# What this playbook does:
#   1. Verifies ~/.ansible-navigator.yml exists on bastion with CONTROLLER_HOST set
#   2. Clones the gitea repo (playbooks-adv-controller) if not already present
#   3. Runs ansible-navigator run configure-controller.yml from inside the repo
#   4. Verifies AAP resources via REST API (inventory, hosts, credentials, projects, JTs)
#
# All variables resolved from environment variables injected by the zt-runner.

# -------------------------------------------------------------------------
# Play 1 — Build dynamic bastion inventory from environment variables
# -------------------------------------------------------------------------
- name: Build bastion inventory
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _ssh_host: "{{ lookup('ansible.builtin.env', 'SSH_HOSTNAME') }}"
    _ssh_port: "{{ lookup('ansible.builtin.env', 'SSH_PORT') | default('22') }}"
    _ssh_user: "{{ lookup('ansible.builtin.env', 'SSH_USERNAME') }}"
    _ssh_pass: "{{ lookup('ansible.builtin.env', 'SSH_PASSWORD') }}"

  tasks:

    - name: Add bastion to in-memory inventory
      ansible.builtin.add_host:
        name: bastion
        groups: bastion
        ansible_host: "{{ _ssh_host }}"
        ansible_port: "{{ _ssh_port | int }}"
        ansible_user: "{{ _ssh_user }}"
        ansible_password: "{{ _ssh_pass }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      when: _ssh_host | length > 0

# -------------------------------------------------------------------------
# Play 2 — Run solve steps on bastion via SSH
# -------------------------------------------------------------------------
- name: Module 02 Solve — Configure resources with Ansible (bastion)
  hosts: bastion
  gather_facts: false
  vars:
    _ssh_user: "{{ lookup('ansible.builtin.env', 'SSH_USERNAME') }}"
    _gitea_url: "{{ lookup('ansible.builtin.env', 'GITEA_URL') }}"
    _gitea_username: "{{ lookup('ansible.builtin.env', 'GITEA_USERNAME') }}"
    _gitea_password: "{{ lookup('ansible.builtin.env', 'GITEA_PASSWORD') }}"
    _controller_url: "{{ lookup('ansible.builtin.env', 'CONTROLLER_URL') }}"
    _controller_password: "{{ lookup('ansible.builtin.env', 'CONTROLLER_PASSWORD') }}"
    gitea_controller_project: "playbooks-adv-controller"
    home_dir: "/home/{{ lookup('ansible.builtin.env', 'SSH_USERNAME') | default('lab-user') }}"
    repo_dir: "{{ home_dir }}/{{ gitea_controller_project }}"
    navigator_cfg: "{{ home_dir }}/.ansible-navigator.yml"

  tasks:

    # -----------------------------------------------------------------------
    # Step 1 — Verify ~/.ansible-navigator.yml exists with CONTROLLER_HOST
    # -----------------------------------------------------------------------
    - name: Check ~/.ansible-navigator.yml exists
      ansible.builtin.stat:
        path: "{{ navigator_cfg }}"
      register: r_nav_cfg

    - name: Set ansible-navigator config exists fact
      ansible.builtin.set_fact:
        _nav_cfg_exists: "{{ r_nav_cfg.stat.exists }}"

    - name: Check CONTROLLER_HOST key present in ansible-navigator.yml
      ansible.builtin.shell: "grep -q 'CONTROLLER_HOST' {{ navigator_cfg }} && echo found || echo missing"
      register: r_nav_ctrl_host
      changed_when: false
      ignore_errors: true
      when: _nav_cfg_exists | bool

    - name: Set CONTROLLER_HOST present fact
      ansible.builtin.set_fact:
        _nav_ctrl_host_ok: "{{ (r_nav_ctrl_host.stdout | default('missing')) == 'found' }}"

    # -----------------------------------------------------------------------
    # Step 2 — Clone Gitea repo (idempotent)
    # -----------------------------------------------------------------------
    - name: Check if repo directory already exists
      ansible.builtin.stat:
        path: "{{ repo_dir }}"
      register: r_repo_dir

    - name: Set repo dir exists fact
      ansible.builtin.set_fact:
        _repo_dir_exists: "{{ r_repo_dir.stat.exists and r_repo_dir.stat.isdir }}"

    - name: Clone Gitea repo with embedded credentials (skip if already cloned)
      ansible.builtin.git:
        repo: >-
          {{ _gitea_url | regex_replace('^(https?://)', '\1' +
             (_gitea_username | urlencode) + ':' +
             (_gitea_password | urlencode) + '@') }}/{{ _gitea_username }}/{{ gitea_controller_project }}.git
        dest: "{{ repo_dir }}"
        force: false
        version: HEAD
      when:
        - not (_repo_dir_exists | bool)
        - _gitea_url | length > 0
      ignore_errors: true

    - name: Check configure-controller.yml exists in repo
      ansible.builtin.stat:
        path: "{{ repo_dir }}/configure-controller.yml"
      register: r_playbook_file

    - name: Set playbook file exists fact
      ansible.builtin.set_fact:
        _playbook_exists: "{{ r_playbook_file.stat.exists }}"

    # -----------------------------------------------------------------------
    # Step 3 — Run ansible-navigator run configure-controller.yml
    #   --mode stdout : headless, no TUI
    #   --pull-policy missing : reuse already-pulled EE image
    #   async 600s / poll 30s : project syncs are slow
    # -----------------------------------------------------------------------
    - name: Run configure-controller.yml via ansible-navigator
      ansible.builtin.shell: |
        cd {{ repo_dir }} && \
        ansible-navigator run configure-controller.yml \
          --mode stdout \
          --pull-policy missing \
          -e gitea_url="{{ _gitea_url }}" \
          -e gitea_username="{{ _gitea_username }}" \
          2>&1
      register: r_navigator_run
      changed_when: true
      ignore_errors: true
      async: 600
      poll: 30
      when: _playbook_exists | bool

    - name: Set navigator run success fact
      ansible.builtin.set_fact:
        _navigator_ok: "{{ r_navigator_run.rc | default(1) == 0 }}"

    # -----------------------------------------------------------------------
    # Expose facts for Play 3 via hostvars
    # -----------------------------------------------------------------------
    - name: Store bastion solve facts for cross-play reporting
      ansible.builtin.set_fact:
        _solve_nav_cfg_exists: "{{ _nav_cfg_exists }}"
        _solve_nav_ctrl_host_ok: "{{ _nav_ctrl_host_ok }}"
        _solve_repo_cloned: "{{ _repo_dir_exists or (_playbook_exists | default(false)) }}"
        _solve_playbook_exists: "{{ _playbook_exists | default(false) }}"
        _solve_navigator_ok: "{{ _navigator_ok | default(false) }}"
        _solve_navigator_rc: "{{ r_navigator_run.rc | default('N/A') | string }}"

# -------------------------------------------------------------------------
# Play 3 — Verify AAP resources via REST API (localhost)
# -------------------------------------------------------------------------
- name: Module 02 Solve — Verify AAP resources via REST API
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _ctrl_url: "{{ lookup('ansible.builtin.env', 'CONTROLLER_URL') }}"
    _ctrl_user: "{{ lookup('ansible.builtin.env', 'CONTROLLER_USERNAME') }}"
    _ctrl_pass: "{{ lookup('ansible.builtin.env', 'CONTROLLER_PASSWORD') }}"
    _api_base: "{{ lookup('ansible.builtin.env', 'CONTROLLER_URL') }}/api/controller/v2"
    _b: "{{ hostvars['bastion'] | default({}) }}"

  tasks:

    - name: Check AAP inventories via REST API
      ansible.builtin.uri:
        url: "{{ _api_base }}/inventories/?page_size=20"
        method: GET
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
      register: r_inventory
      ignore_errors: true
      when: _ctrl_url | length > 0

    - name: Set inventory exists fact
      ansible.builtin.set_fact:
        _inventory_ok: "{{ (r_inventory.json.count | default(0)) > 0 }}"
      when: r_inventory is not skipped and r_inventory.status | default(0) == 200

    - name: Default inventory fact
      ansible.builtin.set_fact:
        _inventory_ok: false
      when: r_inventory is skipped or r_inventory.status | default(0) != 200

    - name: Check AAP hosts via REST API
      ansible.builtin.uri:
        url: "{{ _api_base }}/hosts/?page_size=20"
        method: GET
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
      register: r_hosts
      ignore_errors: true
      when: _ctrl_url | length > 0

    - name: Set hosts exist fact
      ansible.builtin.set_fact:
        _hosts_ok: "{{ (r_hosts.json.count | default(0)) > 0 }}"
      when: r_hosts is not skipped and r_hosts.status | default(0) == 200

    - name: Default hosts fact
      ansible.builtin.set_fact:
        _hosts_ok: false
      when: r_hosts is skipped or r_hosts.status | default(0) != 200

    - name: Check AAP credentials via REST API
      ansible.builtin.uri:
        url: "{{ _api_base }}/credentials/?credential_type__namespace=ssh&page_size=20"
        method: GET
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
      register: r_credentials
      ignore_errors: true
      when: _ctrl_url | length > 0

    - name: Set credentials exist fact
      ansible.builtin.set_fact:
        _credentials_ok: "{{ (r_credentials.json.count | default(0)) > 0 }}"
      when: r_credentials is not skipped and r_credentials.status | default(0) == 200

    - name: Default credentials fact
      ansible.builtin.set_fact:
        _credentials_ok: false
      when: r_credentials is skipped or r_credentials.status | default(0) != 200

    - name: Check AAP projects via REST API
      ansible.builtin.uri:
        url: "{{ _api_base }}/projects/?page_size=20"
        method: GET
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
      register: r_projects
      ignore_errors: true
      when: _ctrl_url | length > 0

    - name: Set projects exist fact
      ansible.builtin.set_fact:
        _projects_ok: "{{ (r_projects.json.count | default(0)) > 0 }}"
      when: r_projects is not skipped and r_projects.status | default(0) == 200

    - name: Default projects fact
      ansible.builtin.set_fact:
        _projects_ok: false
      when: r_projects is skipped or r_projects.status | default(0) != 200

    - name: Check AAP SCM project update jobs (>= 3 successful)
      ansible.builtin.uri:
        url: "{{ _api_base }}/project_updates/?status=successful&page_size=20"
        method: GET
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
      register: r_scm_updates
      ignore_errors: true
      when: _ctrl_url | length > 0

    - name: Set SCM syncs OK fact
      ansible.builtin.set_fact:
        _scm_syncs_ok: "{{ (r_scm_updates.json.count | default(0)) >= 3 }}"
        _scm_syncs_count: "{{ r_scm_updates.json.count | default(0) }}"
      when: r_scm_updates is not skipped and r_scm_updates.status | default(0) == 200

    - name: Default SCM syncs fact
      ansible.builtin.set_fact:
        _scm_syncs_ok: false
        _scm_syncs_count: 0
      when: r_scm_updates is skipped or r_scm_updates.status | default(0) != 200

    - name: Check AAP job templates via REST API
      ansible.builtin.uri:
        url: "{{ _api_base }}/job_templates/?page_size=20"
        method: GET
        url_username: "{{ _ctrl_user }}"
        url_password: "{{ _ctrl_pass }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 30
        status_code: [200]
      register: r_templates
      ignore_errors: true
      when: _ctrl_url | length > 0

    - name: Set job templates exist fact
      ansible.builtin.set_fact:
        _templates_ok: "{{ (r_templates.json.count | default(0)) > 0 }}"
      when: r_templates is not skipped and r_templates.status | default(0) == 200

    - name: Default job templates fact
      ansible.builtin.set_fact:
        _templates_ok: false
      when: r_templates is skipped or r_templates.status | default(0) != 200

    - name: Report solve status
      ansible.builtin.debug:
        msg: |
          ~/.ansible-navigator.yml exists:        {{ 'ok' if (_b._solve_nav_cfg_exists | default(false)) else 'NOT ok' }}
          CONTROLLER_HOST in nav config:          {{ 'ok' if (_b._solve_nav_ctrl_host_ok | default(false)) else 'NOT ok' }}
          repo cloned (playbooks-adv-controller): {{ 'ok' if (_b._solve_repo_cloned | default(false)) else 'NOT ok' }}
          configure-controller.yml present:      {{ 'ok' if (_b._solve_playbook_exists | default(false)) else 'NOT ok' }}
          ansible-navigator run exit 0:          {{ 'ok' if (_b._solve_navigator_ok | default(false)) else 'NOT ok (rc=' ~ (_b._solve_navigator_rc | default('N/A') | string) ~ ')' }}
          AAP inventory created:                 {{ 'ok' if _inventory_ok else 'NOT ok' }}
          AAP hosts added to inventory:          {{ 'ok' if _hosts_ok else 'NOT ok' }}
          AAP machine credentials created:       {{ 'ok' if _credentials_ok else 'NOT ok' }}
          AAP projects created:                  {{ 'ok' if _projects_ok else 'NOT ok' }}
          AAP SCM syncs succeeded (>= 3):       {{ 'ok (' ~ _scm_syncs_count ~ ' found)' if _scm_syncs_ok else 'NOT ok (' ~ _scm_syncs_count ~ ' found, need >= 3)' }}
          AAP job templates created:             {{ 'ok' if _templates_ok else 'NOT ok' }}
